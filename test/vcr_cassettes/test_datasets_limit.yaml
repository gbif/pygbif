        Malacology Collection","description":"<p>The malacology collection at the
        Burke Museum houses more than 35,000 specimen lots (&gt;150,000 individual
        specimens) of molluscs, representing bivalves (clams, mussels, and oysters),
        gastropods (snails and slugs), cephalopods (octopods, squids, and nautiluses),
        polyplacophorans (chitons), and scaphopods (tusk shells). The collection dates
        to the late 1800s, however, the majority of acquisitions stem from the past
        50 years, donated by researchers and shell collectors. The collection is broad
        in geographical and ecological  scope, but with an emphasis on the Pacific
        region and marine taxa. Currently, the collection is composed primarily of
        dry shells, with only a small, but increasing, number of fluid-preserved specimens.
