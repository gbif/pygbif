        de Informa\xE7\xE3o sobre a Biodiversidade Brasileira - OBIS Brasil\",\"description\":\"O
        IPT (Integrated Publishing Toolkit) do OBIS \u2013 Brasil \xE9 a principal
        ferramenta de publica\xE7\xE3o e gest\xE3o de dados sobre biodiversidade marinha
        e costeira do pa\xEDs. O sistema integra o Brasil \xE0 rede global do Ocean
        Biodiversity Information System (OBIS), iniciativa coordenada pela Comiss\xE3o
        Oceanogr\xE1fica Intergovernamental (COI/UNESCO). O OBIS \u2013 Brasil \xE9
        administrado pelo SiBBr (Sistema de Informa\xE7\xE3o sobre a Biodiversidade
        Brasileira), que atua como o n\xF3 nacional respons\xE1vel por promover a
        integra\xE7\xE3o, padroniza\xE7\xE3o e dissemina\xE7\xE3o dos dados marinhos
        produzidos por institui\xE7\xF5es de pesquisa, universidades e \xF3rg\xE3os
        governamentais. Por meio do IPT, o OBIS \u2013 Brasil, sob coordena\xE7\xE3o
        do SiBBr, assegura que os dados marinhos nacionais sejam acess\xEDveis, reutiliz\xE1veis
        e integrados \xE0 rede global, fortalecendo a ci\xEAncia aberta e subsidiando
        pol\xEDticas p\xFAblicas voltadas \xE0 conserva\xE7\xE3o da biodiversidade
        oce\xE2nica, \xE0 gest\xE3o de recursos pesqueiros e ao monitoramento ambiental.\",\"createdBy\":\"f5fd374b-89cb-4ab6-b3eb-794c65f232c3\",\"modifiedBy\":\"f5fd374b-89cb-4ab6-b3eb-794c65f232c3\",\"created\":\"2025-11-02T18:50:34.920+00:00\",\"modified\":\"2025-11-02T18:50:34.920+00:00\",\"disabled\":false,\"contacts\":[{\"key\":6312340,\"type\":\"TECHNICAL_POINT_OF_CONTACT\",\"primary\":true,\"userId\":[],\"firstName\":\"Equipe
