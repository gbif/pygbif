        Universidade Cat\xF3lica do Paran\xE1\",\"abbreviation\":\"PUCPR\",\"description\":\"The
        Pontifical Catholic University of Paran\xE1 (PUCPR) is one of Brazil\u2019s
        leading higher education and research institutions, recognized for its strong
        commitment to sustainability, innovation, and biodiversity conservation. Founded
        in 1959 and located in Curitiba, Paran\xE1 State, PUCPR integrates teaching,
        research, and community engagement through interdisciplinary approaches across
        its campuses. The university hosts a variety of research groups dedicated
        to environmental sciences, ecology, and biodiversity management. PUCPR\u2019s
        collections and biodiversity data are valuable contributions to understanding
