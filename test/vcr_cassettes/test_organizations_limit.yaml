        Estadual do Norte Fluminense\",\"abbreviation\":\"UENF\",\"description\":\"The
        State University of Northern Rio de Janeiro \u201CDarcy Ribeiro\u201D (UENF)
        is a public research university located in Campos dos Goytacazes, Rio de Janeiro,
        Brazil. Founded in 1991 by educator Darcy Ribeiro and designed by architect
        Oscar Niemeyer, UENF was created to integrate teaching, research, and extension
        in pursuit of scientific and technological development for regional and national
        progress. Recognized for excellence in agricultural sciences, environmental
        studies, biotechnology, and engineering, UENF develops research focused on
        biodiversity, ecosystem conservation, and the sustainable use of natural resources.
        Its projects include studies on the flora and fauna of the Atlantic Forest
        and ecological monitoring of regional environments. Situated in one of Brazil\u2019s
        most biodiverse areas, UENF contributes valuable data and expertise to national
        and international networks such as the Global Biodiversity Information Facility
        (GBIF), promoting open access to biodiversity knowledge for research and conservation.\",\"language\":\"por\",\"email\":[\"lrmont@uenf.br\"],\"phone\":[],\"homepage\":[\"https://uenf.br/portal/\"],\"logoUrl\":\"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRq9N7HOC1GVvEgFsMH602cDwBfRPp1bqEZvw&s\",\"address\":[\"Av.
