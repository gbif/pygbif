        Botanical Museum\",\"description\":\"The Helsinki Botanical Museum houses
        specimens from around the globe, particularly from the Nordic countries, North
        America and the cool and temperate zones of Asia. Prominent regional collections
        are from China, Papua New Guinea and Patagonia, among others. The collections
        contain tens of thousands of globally valuable type specimens. The collections
        are organised into five groups of organisms: vascular plants, bryophytes,
        fungi, lichens and algae. Most of these have been further divided into two
        sections, of which East Fennoscandia (Herbarium Fennoscandiae orientalis)
        encompasses Finland and its neighbouring areas (Russian Karelia, the Kola
        Peninsula and the western parts of the Leningrad Oblast), and the general
