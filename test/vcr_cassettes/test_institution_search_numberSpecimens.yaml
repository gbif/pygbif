        Lee herbarium\",\"description\":\"The T.B. Lee Herbarium is a part of the
        Arboretum of the College of Agriculture and Life Sciences at Seoul National
        University, and when the college moved to the Gwanak Campus in 2003, it was
        renamed in honor of the late Professor Changbok Lee, borrowing his family
        name and the national name of the T.B. Lee Herbarium. The T.B. Lee herbarium
        was initially a small facility within the Department of Forestry (now the
        Department of Forest Science), but when the Arboretum was established in 1969,
        it became part of the Arboretum, where it has remained ever since.\",\"types\":[\"Herbarium\"],\"active\":true,\"email\":[\"quercus@snu.ac.kr\"],\"phone\":[],\"homepage\":\"https://arbor.snu.ac.kr/\",\"catalogUrls\":[],\"apiUrls\":[],\"institutionalGovernances\":[\"Academic\"],\"disciplines\":[],\"latitude\":37.457469,\"longitude\":126.948676,\"mailingAddress\":{\"key\":55870},\"address\":{\"key\":55869,\"country\":\"KR\"},\"additionalNames\":[],\"foundingDate\":1952,\"numberSpecimens\":100000,\"createdBy\":\"mgrosjean\",\"modifiedBy\":\"mgrosjean\",\"created\":\"2025-06-04T13:04:16.387+00:00\",\"modified\":\"2025-06-04T13:04:16.387+00:00\",\"tags\":[],\"identifiers\":[],\"contactPersons\":[],\"machineTags\":[],\"alternativeCodes\":[],\"comments\":[],\"occurrenceMappings\":[],\"masterSource\":\"GRSCICOLL\",\"displayOnNHCPortal\":true,\"occurrenceCount\":0,\"typeSpecimenCount\":0},{\"key\":\"35d2e89f-9f26-4ad2-b37a-ab26ee29aca0\",\"code\":\"NBG-BFD\",\"name\":\"National
        Botanical Garden\",\"description\":\"The National Botanical Garden, located
        in Mirpur, Dhaka, is the largest plant conservation center in Bangladesh,
        covering an extensive area of approximately 84 hectares (210 acres). Established
        in 1961, it serves as a vital hub for plant conservation, botanical research,
        environmental education, and public recreation. Managed by the Forest Department
        under the Ministry of Environment, Forest and Climate Change, the garden plays
        a significant role in preserving the country's floral biodiversity.\\n\\nThe
        garden is thoughtfully divided into 57 distinct sections, each curated to
        showcase diverse plant species and ecosystems. It is home to around 56,000
        individual trees, shrubs, and herbs, including a rich assortment of aquatic
        plants, medicinal herbs, and ornamental species.\\n\\nTo support the conservation
        of rare and endangered species, the garden features a modern vegetative propagation
        center and a tissue culture laboratory, currently focusing on orchids and
        other threatened flora. \",\"types\":[\"BotanicalGarden\"],\"active\":true,\"email\":[],\"phone\":[],\"catalogUrls\":[],\"apiUrls\":[],\"institutionalGovernances\":[\"Governmental\"],\"disciplines\":[\"Taxonomy\",\"Biological\"],\"latitude\":23.812747,\"longitude\":90.347627,\"mailingAddress\":{\"key\":55800,\"address\":\"National
        Botanical Garden, Zoo Road\",\"city\":\"Dhaka\",\"postalCode\":\"1216\",\"country\":\"BD\"},\"address\":{\"key\":55799,\"address\":\"National
        Botanical Garden, Zoo Road\",\"city\":\"Dhaka\",\"postalCode\":\"1216\",\"country\":\"BD\"},\"additionalNames\":[],\"foundingDate\":1961,\"numberSpecimens\":56000,\"createdBy\":\"mgrosjean\",\"modifiedBy\":\"mgrosjean\",\"created\":\"2025-05-21T08:19:45.282+00:00\",\"modified\":\"2025-05-21T08:19:45.282+00:00\",\"tags\":[],\"identifiers\":[],\"contactPersons\":[],\"machineTags\":[],\"alternativeCodes\":[],\"comments\":[],\"occurrenceMappings\":[],\"masterSource\":\"GRSCICOLL\",\"displayOnNHCPortal\":true,\"occurrenceCount\":0,\"typeSpecimenCount\":0},{\"key\":\"c06409bb-7841-41ad-a975-d976de4d9edf\",\"code\":\"BLG-BFD\",\"name\":\"Baldah
        Garden\",\"description\":\"Baldah Garden a botanical garden located at Wari
        in the old part of the city of Dhaka. It is one of the oldest botanical gardens
        established in this part of Bengal by a private individual. The naturalist,
        philanthropist and poet Narendra Narayan Roy Chaudhury, landlord of the Estate
        of Baldah, established the garden on his own property in 1909. It is divided
        into two units. The larger unit is named Cybele after the Greek nature goddess
        of fertility. It is roughly rectangular, with the northern side slightly cutting
        a corner, and measures about 136 metres in length and 76 metres in width.
        The smaller unit, Psyche meaning 'soul', is approximately 100 metres long
        and 45 metre wide. Chaudhury passionately enriched the garden with rare plant
        species collected from different parts of the world until his death in 1943,
        when further expansion of the garden came to a halt. This situation continued
        until 1962, when the garden was handed over to the government of East Pakistan
        and the Forestry Department took charge of managing the garden. After the
        creation of Bangladesh in 1971, the Department of Forestry of the new government
        began to work with renewed vigour for its improvement, with the result that
        most of its past glory has now been restored with the addition of two new
        greenhouses and modernisation of civil amenities inside the garden. The Baldah
        Garden is now managed as a satellite unit of the National Botanical Garden
        by the Department of Forestry.\\nThe collection of the garden is classified
        into seven categories - orchids, cacti, conservatory plants, aquatic plants,
        roses, rockery and wall plants, arboretum, and miscellaneous flora. The garden
        has about 15,000 plants representing 672 species.\\nMany of these are exotic
        and rare plants; perhaps the richest collection of exotic plants in the country
        is housed in the Baldah Garden. The flora of the garden represents collections
        from over 50 different countries. The garden has among its attractions the
        'century plant' which is believed to flower only once in a hundred years,
        and was seen in bloom a few years back. The Adansonia digitata tree which
        adorns the garden is historical. Central African aborigines used to seal their
        deads in holes dug into the cavity of the tree in order to mummify the body
        long before the days of the Pharaohs.\",\"types\":[\"BotanicalGarden\"],\"active\":true,\"email\":[],\"phone\":[],\"catalogUrls\":[],\"apiUrls\":[],\"institutionalGovernances\":[\"Governmental\"],\"disciplines\":[\"Biological\",\"Taxonomy\"],\"latitude\":23.716951,\"longitude\":90.419472,\"mailingAddress\":{\"key\":55790,\"address\":\"Narinda
