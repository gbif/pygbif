        - ResourceMetaData\\n - OccurrenceData\\n - ChecklistData\\n - SamplingEventData\\n\\nExpected
        data content:\\n\\n> ADE-CLIMATERRA RDC pr\xE9voit de publier principalement
        les donn\xE9es sur les occurrences et les donn\xE9es de la liste de contr\xF4le,
        accompagn\xE9es de m\xE9tadonn\xE9es des ressources. Ces donn\xE9es seront
        issues de nos projets de reforestation communautaire, d\u2019agroforesterie
        et de documentation des savoirs autochtones dans les provinces de l\u2019Ituri,
        du Sud-Kivu et de la Tshopo.\\n> \\n> Donn\xE9es sur les occurrences : Observations
        g\xE9or\xE9f\xE9renc\xE9es d\u2019esp\xE8ces v\xE9g\xE9tales locales (arbres,
        plantes m\xE9dicinales, esp\xE8ces agroforesti\xE8res), collect\xE9es lors
        de nos activit\xE9s de terrain et de suivi \xE9cologique participatif.\\n>
        \\n> Donn\xE9es de la liste de contr\xF4le : Inventaires floristiques communautaires
        r\xE9alis\xE9s dans les zones de reforestation, incluant les esp\xE8ces end\xE9miques,
        utiles ou menac\xE9es, identifi\xE9es avec l\u2019appui des communaut\xE9s
        locales.\\n> \\n> M\xE9tadonn\xE9es des ressources : Informations sur les
        m\xE9thodes de collecte, les zones g\xE9ographiques couvertes, les p\xE9riodes
        d\u2019observation, les acteurs impliqu\xE9s et les objectifs de conservation.\\n>
        \\n> \\uD83D\\uDEE0\uFE0F Besoins d\u2019assistance\\n> Nous souhaiterions
        b\xE9n\xE9ficier d\u2019un appui technique pour :\\n> \\n> La structuration
        des donn\xE9es selon les standards Darwin Core\\n> \\n> L\u2019utilisation
        d\u2019outils adapt\xE9s pour le formatage et l\u2019h\xE9bergement des jeux
        de donn\xE9es (ex. IPT, tableurs structur\xE9s)\\n> \\n> La validation des
        m\xE9tadonn\xE9es et la mise en ligne sur GBIF.org\\n> \\n> Le renforcement
        des capacit\xE9s de notre \xE9quipe locale en gestion et publication de donn\xE9es
        de biodiversit\xE9\\n> \\n> Notre objectif est de rendre visibles les efforts
        communautaires de conservation et de contribuer activement \xE0 la documentation
        de la biodiversit\xE9 congolaise sur des plateformes ouvertes et interop\xE9rables.\\n\\n\\nWill
        run a server which exposes data: no\\n\\n\\nPlans to run publishing software
        (e.g. an IPT): no\\n\\n\\nNeeds help for data publishing: yes\\n\",\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-10-20T18:55:37.279+00:00\",\"modified\":\"2025-10-20T18:55:37.279+00:00\"}]},{\"key\":\"4180274b-32d6-4a75-a987-35ea969ab5fb\",\"endorsingNodeKey\":\"7f48e0c8-5c96-49ec-b972-30748e339115\",\"endorsementApproved\":true,\"endorsementStatus\":\"ENDORSED\",\"title\":\"MUSE
        - Museo delle Scienze\",\"description\":\"MUSE - Museo delle Scienze of Trento
        was founded in 1922. The museum is a public institution of the Autonomous
        Province of Trento and is one of the main Italian hubs of the scientific culture.
        Its archaeological and natural history collections house 5 millions specimens.
        \  \\nMUSE develops projects of research, conservation, education, training
        and participation, mainly focused on the relationship among nature, science
        and society. Its mission is to interpret nature, starting with the mountain
        landscape, using the eyes, tools and questions of scientific research, picking
        up contemporary challenges and enjoying the pleasure of knowledge, to lend
        value to discovery, innovation, and sustainability.\",\"language\":\"eng\",\"email\":[\"museinfo@muse.it\"],\"phone\":[],\"homepage\":[\"https://www.muse.it/\"],\"logoUrl\":\"https://www.muse.it/contrib/uploads/2025/10/abcdefg-scaled.jpg\",\"address\":[\"Corso
