        National Park Headquarters\",\"description\":\"Shei-Pa National Park (SPNP),
        located in the Syueshan Mountain Range of north-central Taiwan, is an area
        of majestic high mountains and magnificent scenery, including the iconic Syueshan
        (Snow Mountain) and Dabajian Mountain. This dramatic landscape harbors a rich
        diversity of flora and fauna, including endemic and protected species such
        as the Formosan landlocked salmon and the Guanwu salamander . Our core mission
        is the conservation of these unique species, forest ecosystems, and overall
        biodiversity. We actively engage in research, environmental education, and
        international collaboration to advance this mission.\\nAs part of our commitment
        to global conservation efforts, Shei-Pa National Park is dedicated to a policy
        of open data. We believe that sharing the results of our extensive biodiversity
        monitoring and research is crucial for scientific advancement and public awareness.
        By making ourdata accessible through local biodiversity data alliance TBIA
        or global GBIF, we aim to contribute to a deeper understanding of Taiwan's
        unique\\necosystems and support collaborative conservation initiatives worldwide.\",\"language\":\"eng\",\"email\":[],\"phone\":[\"+886-37-996100\"],\"homepage\":[\"https://www.spnp.gov.tw/\"],\"logoUrl\":\"https://www.spnp.gov.tw/\",\"address\":[\"100
