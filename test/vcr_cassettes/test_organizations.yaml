        to GBIF, we aim to connect hobbyists, researchers, and the public with reliable
        data that supports orchid science and the conservation of orchids in the wild.\",\"language\":\"eng\",\"email\":[\"fcospresident@gmail.com\"],\"phone\":[\"3602713971\"],\"homepage\":[\"https://www.fcos.org\"],\"logoUrl\":\"https://drive.google.com/file/d/110EaGydGbbsvcc8jnKso6h714Hj3WZb7/view?usp=drivesdk\",\"address\":[\"P.O.
        Box 1066\"],\"city\":\"Grover Beach\",\"province\":\"CA\",\"country\":\"US\",\"postalCode\":\"93483\",\"latitude\":35.12127,\"longitude\":-120.61770,\"numPublishedDatasets\":0,\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-28T00:12:02.353+00:00\",\"modified\":\"2025-08-28T00:12:02.353+00:00\",\"contacts\":[{\"key\":6221067,\"type\":\"ADMINISTRATIVE_POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Jeffery\",\"lastName\":\"Parham\",\"position\":[],\"email\":[\"jsp1440@aol.com\"],\"phone\":[\"3602713971\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-28T00:12:02.353+00:00\",\"modified\":\"2025-08-28T00:12:02.353+00:00\"},{\"key\":6221068,\"type\":\"POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Jeffery\",\"lastName\":\"Parham\",\"position\":[],\"email\":[\"fcospresident@gmail.com\"],\"phone\":[\"3602713971\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-28T00:12:02.353+00:00\",\"modified\":\"2025-08-28T00:12:02.353+00:00\"}],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[{\"key\":40135,\"content\":\"\\nIs
        associated with a GBIF-funded project: no\\n\\n\\nExpects to publish:\\n\\n\\n
        - ResourceMetaData\\n - OccurrenceData\\n - ChecklistData\\n - SamplingEventData\\n\\nExpected
        data content:\\n\\n> The Five Cities Orchid Society will publish curated occurrence
        records, species checklists, and associated metadata for orchids and companion
        plants. Data sources include cultivated collections, society shows, field
        observations, photographic records, and member-submitted occurrence data.
        These datasets contribute to orchid biodiversity knowledge, conservation,
        and cultivation research, complementing global orchid distribution data.\\n\\n\\nWill
        run a server which exposes data: no\\n\\n\\nPlans to run publishing software
        (e.g. an IPT): no\\n\\n\\nNeeds help for data publishing: yes\\n\",\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-28T00:12:02.353+00:00\",\"modified\":\"2025-08-28T00:12:02.353+00:00\"}]},{\"key\":\"290c8069-3dd1-48fb-8e61-36b7eb35168b\",\"endorsingNodeKey\":\"7f48e0c8-5c96-49ec-b972-30748e339115\",\"endorsementApproved\":false,\"endorsementStatus\":\"WAITING_FOR_ENDORSEMENT\",\"title\":\"Nangui
        Abrogoua University / Vector Control Product Evaluation Centre-Institut Pierre
        Richet\",\"description\":\"Affiliation 1\\n\\nNangui Abrogoua University,
        UFR Natural Sciences, Department of Animal Genetics, Abidjan, C\xF4te d\u2019Ivoire\\nNangui
        Abrogoua University is a public higher education and research institution
        in Abidjan, C\xF4te d\u2019Ivoire. The Department of Animal Genetics within
        the UFR Natural Sciences focuses on training and research in genetics, biodiversity,
        and applied biology, with strong links to ecological and health-related studies.\\nAffiliation
        2\\nInstitut Pierre Richet (VCPEC-IPR/INSP), Bouak\xE9, C\xF4te d\u2019Ivoire\\nThe
        Vector Control Product Evaluation Centre (VCPEC) is part of the Institut Pierre
        Richet (IPR), under the Institut National de Sant\xE9 Publique (INSP). Located
        in Bouak\xE9, VCPEC is a WHO-recognized center specialized in evaluating vector
        control products (such as insecticides and treated nets) through laboratory
        and semi-field trials, supporting malaria and vector-borne disease control
        in West Africa.\",\"language\":\"eng\",\"email\":[\"wolierosine@yahoo.fr\"],\"phone\":[\"0748532551\"],\"homepage\":[],\"address\":[\"BP
        1500 Bouak\xE9\"],\"city\":\"Abidjan / Bouak\xE9\",\"country\":\"CI\",\"latitude\":7.96082,\"longitude\":-4.67146,\"numPublishedDatasets\":0,\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-26T21:59:54.571+00:00\",\"modified\":\"2025-08-26T21:59:54.571+00:00\",\"contacts\":[{\"key\":6218977,\"type\":\"POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Rosine
        Z.\",\"lastName\":\"Wolie\",\"position\":[],\"email\":[\"wolierosine@yahoo.fr\"],\"phone\":[\"0748532551\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-26T21:59:54.571+00:00\",\"modified\":\"2025-08-26T21:59:54.571+00:00\"}],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[{\"key\":40111,\"content\":\"\\nExpects
        to publish:\\n\\n\\n - ResourceMetaData\\n - SamplingEventData\\n\\nExpected
        data content:\\n\\n> This dataset accompanies the study \u201CInsecticide
        resistance and species diversity in Anopheles gambiae s.l. in C\xF4te d\u2019Ivoire.\u201D
        The study investigated insecticide resistance phenotypes, target-site mutations,
        and species distribution in malaria vectors collected across three ecological
        zones (savannah, pre-forest, and forest) in C\xF4te d\u2019Ivoire between
        July and October 2020.\\n> Mosquito larvae and adults were sampled and analyzed
        using WHO susceptibility bioassays with pyrethroids (deltamethrin, permethrin)
        and an organophosphate (pirimiphos-methyl), complemented by synergist assays
        with piperonyl butoxide (PBO) and resistance intensity assays at 5x and 10x
        diagnostic doses. Molecular analyses included PCR-based species identification
        and genotyping for Kdr L1014F and Ace-1R G119S mutations.\\n> The dataset
        provides raw and processed data on:\\n> \u2022\\tSpecies composition across
        ecological areas,\\n> \u2022\\tMortality outcomes from bioassays,\\n> \u2022\\tResistance
        intensity and synergist effects,\\n> \u2022\\tAllelic frequencies of resistance-associated
        mutations,\\n> \u2022\\tGPS coordinates of mosquito sampling sites across
        study areas.\\n> These data support evidence of significant ecological variation
        in both vector species distribution and resistance mechanisms, with implications
        for malaria control strategies in C\xF4te d\u2019Ivoire.\\n\\n\\nWill run
        a server which exposes data: no\\n\\n\\nPlans to run publishing software (e.g.
        an IPT): no\\n\\n\\nNeeds help for data publishing: yes\\n\",\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-26T21:59:54.571+00:00\",\"modified\":\"2025-08-26T21:59:54.571+00:00\"}]},{\"key\":\"02204d44-9423-48ff-b771-3579e4a91163\",\"endorsingNodeKey\":\"e1b85abc-61f9-430f-ba79-6813dec53a0f\",\"endorsementApproved\":true,\"endorsementStatus\":\"ENDORSED\",\"title\":\"\u7FBD\u6797\u751F\u614B\u80A1\u4EFD\u6709\u9650\u516C\u53F8-FEATHERED
