        University in Olomouc, herbarium of Department of Botany (OL)\",\"description\":\"The
        Herbarium collections of the Department of Botany, Palack\xFD University in
        Olomouc (Index Herbariorum Acronym OL) house more than 100,000 specimens of
        algae, bryophytes, seeds / fruits, and vascular plants. The herbarium founded
        in 1946, therefore, the older specimens are only sparsely represented. The
        annual increase currently amounts to approximately 3000\u20135000 specimens.
        The collections of former as well as current employees of the department are
        significantly represented. A large part of the herbarium also consists of
        collections of students, especially graduate students.\\nThe OL collections
        include type specimens for taxa described by employees of the department,
        special collection of apomictic plants (genera Rubus and Taraxacum) and general
