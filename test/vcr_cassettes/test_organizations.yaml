        Institute for Environmental Studies\",\"description\":\"The National Institute
        for Environmental Studies (NIES), Japan aims to contribute to achieving societal
        goals by providing scientific evidence through its environmental research
        programs. The Biodiversity Division at NIES promotes open data in biodiversity
        research as a sub-core center of the Japan Initiative for Biodiversity Information
        (JBIF), funded through the National BioResource Project by the Ministry of
        Education, Culture, Sports, Science and Technology (MEXT). The Biodiversity
        Division conducts studies on ecological and fundamental biological subjects
        through various methods, including monitoring projects, DNA barcoding, camera
        trap data, environmental DNA analyses, experiments, culture/specimen collections,
        and literature reviews. Our research data covers a wide range of taxonomic
        groups, including plants (forests, herbaceous plants, seagrass, mangroves,
        freshwater aquatic plants), vertebrates (birds, mammals, amphibians, fish),
        corals, algae, plankton, benthos, insects and other arthropods, as well as
        microbes. Species identification is carried out by experts using both conventional
        and advanced techniques, such as DNA barcoding. In addition, AI-based classification
        is expected to be introduced in collaboration with other institutions. NIES
        works closely with the Ministry of the Environment to support the goals of
        the Convention on Biological Diversity (CBD) frameworks, ultimately contributing
        to the creation of a robust society in harmony with nature.\",\"language\":\"eng\",\"email\":[\"biodiv.data@nies.go.jp\"],\"phone\":[],\"homepage\":[\"https://www.nies.go.jp/\"],\"logoUrl\":\"https://www.nies.go.jp/biowm/img/nies_logo.png\",\"address\":[\"Onogawa
        16-2\"],\"city\":\"Tsukuba\",\"province\":\"Ibaraki\",\"country\":\"JP\",\"postalCode\":\"305-8506\",\"latitude\":36.05049,\"longitude\":140.12080,\"numPublishedDatasets\":22,\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-19T01:23:00.224+00:00\",\"modified\":\"2025-08-19T01:23:00.224+00:00\",\"endorsed\":\"2025-08-19T16:18:48.485+00:00\",\"contacts\":[{\"key\":6210101,\"type\":\"ADMINISTRATIVE_POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Natsuko\",\"lastName\":\"Kondo\",\"position\":[],\"email\":[\"kondo.natsuko@nies.go.jp\"],\"phone\":[],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-19T01:23:00.224+00:00\",\"modified\":\"2025-08-19T01:23:00.224+00:00\"},{\"key\":6210102,\"type\":\"TECHNICAL_POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Kumiko\",\"lastName\":\"Totsu\",\"position\":[],\"email\":[\"totsu.kumiko@nies.go.jp\"],\"phone\":[\"+81
