        society through the holistic formation of the human person, their preparation
        for professional practice, the production of knowledge, and regional development.
        Unisinos is committed to environmental and biodiversity preservation, promoting
        research and scientific knowledge. Through its Zoology Collection, the university
        contributes to preserving and disseminating knowledge about Brazilian and
        Antarctic biodiversity, while also serving as a foundation for taxonomic,
        ecological, and biogeographical research, in addition to supporting biodiversity
        conservation.\",\"language\":\"eng\",\"email\":[\"colecoes_zoo@unisinos.br\"],\"phone\":[\"+55
