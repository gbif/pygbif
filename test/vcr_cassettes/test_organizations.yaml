        University, Wondo Genet College of Forestry and Natural Resources\",\"description\":\"The
        Hawassa University JRS Biodiversity Pollination Project aims to generate information
        on insect pollinator diversity, openly share data, and create awareness platforms
        highlighting their value for food security and ecosystem health across different
        land uses in and around the Kafa Biosphere Reserve and Bale Mountains National
        Park. Develop a public, web-enabled database on Ethiopian insect pollinators.\\nData
        will be shared through the HU-WGCFNR MRV and GBIF platforms, enriching East
        African and global insect pollinator datasets and knowledge. This enables
        worldwide researcher collaboration. By fostering awareness, education, and
        research on pollinator diversity, the project provides essential input for
        their sustainable conservation. It also promotes digital skills among stakeholders.
        Ultimately, it may advance pollinator-friendly agriculture, enhancing both
        agricultural productivity and ecosystem health.\",\"language\":\"eng\",\"email\":[],\"phone\":[],\"homepage\":[],\"logoUrl\":\"https://www.hu.edu.et\",\"address\":[\"Hawassa,
