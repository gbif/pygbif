        Rwanda\",\"description\":\"Nature Rwanda is a Rwandan non-profit organization
        dedicated to conserving ecosystems and strengthening community-led conservation
        efforts to promote sustainable socio-economic transformation. Guided by the
        vision of Thriving Communities in Biodiverse and Resilient Landscapes, the
        organization integrates biodiversity research, ecosystem restoration, and
        environmental education to foster a sustainable coexistence between people
        and nature. By generating, managing, and sharing biodiversity data, Nature
        Rwanda contributes to the GBIF mission of making biodiversity information
        freely and universally accessible to support evidence-based conservation and
        development decisions.\",\"language\":\"eng\",\"email\":[\"info@naturerwanda.org\"],\"phone\":[\"+20788773177\"],\"homepage\":[\"https://www.naturerwanda.org\"],\"logoUrl\":\"https://www.naturerwanda.org/wp-content/uploads/2025/10/Logo-Nature-Rwanda.png\",\"address\":[\"NM
        11 ST\"],\"city\":\"Musanze\",\"province\":\"Nothern\",\"country\":\"RW\",\"latitude\":-1.96383,\"longitude\":29.99009,\"numPublishedDatasets\":0,\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-10-08T15:31:44.976+00:00\",\"modified\":\"2025-10-08T15:31:44.976+00:00\",\"endorsed\":\"2025-10-13T07:53:36.702+00:00\",\"contacts\":[{\"key\":6276992,\"type\":\"TECHNICAL_POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Elie\",\"lastName\":\"SINAYITUTSE\",\"position\":[],\"email\":[\"sinayitutse@naturerwanda.org\"],\"phone\":[\"+250788988150\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-10-08T15:31:44.976+00:00\",\"modified\":\"2025-10-08T15:31:44.976+00:00\"},{\"key\":6276993,\"type\":\"POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Jean
        Claude\",\"lastName\":\"DUSABIMANA\",\"position\":[],\"email\":[\"dusabimana@naturerwanda.org\"],\"phone\":[\"+250788869445\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-10-08T15:31:44.976+00:00\",\"modified\":\"2025-10-08T15:31:44.976+00:00\"}],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[{\"key\":41423,\"content\":\"\\nIs
        associated with a GBIF-funded project: no\\n\\n\\nExpects to publish:\\n\\n\\n
        - ChecklistData\\n - ResourceMetaData\\n - OccurrenceData\\n - SamplingEventData\\n\\nExpected
        data content:\\n\\n> Nature Rwanda plans to publish biodiversity occurrence
        and sampling-event data derived from its field surveys, ecological monitoring,
        and restoration initiatives across Rwanda\u2019s diverse ecosystems. The data
        will include species observations, distribution records, habitat characteristics,
        and ecological interactions collected through systematic fieldwork and citizen
        science initiatives. These datasets will document flora and fauna from forest,
        wetland, riverine, and agricultural landscapes, contributing to national and
        global biodiversity knowledge.\\n> To ensure data quality and interoperability
        with GBIF standards, Nature Rwanda may require technical support in data formatting
        (Darwin Core standards), metadata preparation, and integration of data management
        tools such as the GBIF IPT. Guidance on best practices for data cleaning,
        publishing workflows, and long-term data hosting solutions would also be valuable
        to strengthen our institutional data-sharing capacity.\\n\\n\\nWill run a
        server which exposes data: no\\n\\n\\nPlans to run publishing software (e.g.
        an IPT): yes\\n\\n\\nNeeds help for data publishing: yes\\n\",\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-10-08T15:31:44.976+00:00\",\"modified\":\"2025-10-08T15:31:44.976+00:00\"}]},{\"key\":\"5096b03f-bf87-4a80-90f1-2186e9d6b720\",\"endorsingNodeKey\":\"7f48e0c8-5c96-49ec-b972-30748e339115\",\"endorsementApproved\":true,\"endorsementStatus\":\"ENDORSED\",\"title\":\"THE
        EAST AFRICAN WILDLIFE SOCIETY\",\"description\":\"The East African Wild Life
        Society (EAWLS) is a membership-based conservation organization founded in
        1961, dedicated to promoting the sustainable management of wildlife and natural
        resources across East Africa. EAWLS works through research, advocacy, and
        partnerships to influence policies and practices that conserve biodiversity
        and improve community livelihoods. The Society supports biodiversity information
        management through data collection, monitoring, and dissemination to inform
        conservation planning and policy. As the host institution for the Kenya Forests
        Working Group (KFWG) and the Kenya Wildlife Conservation Forum (KWCF), EAWLS
        provides a collaborative platform for stakeholders to share biodiversity data,
        strengthen conservation governance, and promote ecosystem resilience across
        terrestrial and marine landscapes. EAWLS also promotes citizen science initiatives
        to enhance biodiversity monitoring, including participation in waterfowl counts
        and other community-based ecological assessments.\",\"language\":\"eng\",\"email\":[\"Jabes.Okumu@eawildlife.org\"],\"phone\":[\"0722202473\"],\"homepage\":[],\"logoUrl\":\"http://www.eawildlife.org/\",\"address\":[\"Riara
        Road, Off Ngong Road, Kilimani\"],\"city\":\"NAIROBI\",\"country\":\"KE\",\"postalCode\":\"00200\",\"latitude\":0.97947,\"longitude\":39.16258,\"numPublishedDatasets\":2,\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-10-08T15:09:53.581+00:00\",\"modified\":\"2025-10-08T15:09:53.581+00:00\",\"endorsed\":\"2025-10-13T10:20:35.325+00:00\",\"contacts\":[{\"key\":6276989,\"type\":\"ADMINISTRATIVE_POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Nancy\",\"lastName\":\"Ogonje\",\"position\":[],\"email\":[\"Nancy.Ogonje@eawildlife.org\"],\"phone\":[\"+254722202473\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-10-08T15:09:53.581+00:00\",\"modified\":\"2025-10-08T15:09:53.581+00:00\"},{\"key\":6276990,\"type\":\"TECHNICAL_POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Jabes\",\"lastName\":\"Okumu\",\"position\":[],\"email\":[\"Jabes.Okumu@eawildlife.org\"],\"phone\":[\"+254722202473\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-10-08T15:09:53.581+00:00\",\"modified\":\"2025-10-08T15:09:53.581+00:00\"},{\"key\":6276991,\"type\":\"POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Jabes\",\"lastName\":\"Okumu\",\"position\":[],\"email\":[\"info@eawildlife.org\"],\"phone\":[\"+254722202473\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-10-08T15:09:53.581+00:00\",\"modified\":\"2025-10-08T15:09:53.581+00:00\"}],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[{\"key\":41422,\"content\":\"\\nIs
        associated with a GBIF-funded project: no\\n\\n\\nExpects to publish:\\n\\n\\n
        - ChecklistData\\n - OccurrenceData\\n\\nExpected data content:\\n\\n> EAWLS
        intends to publish biodiversity occurrence and monitoring data collected through
        its terrestrial and marine conservation programmes across Kenya and the wider
        East African region. These include species observations from forest and wetland
        surveys, community-based monitoring, and citizen science initiatives such
        as annual waterfowl counts. Additional datasets will include information from
        habitat assessments, ecological inventories, and species distribution records
