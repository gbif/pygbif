        associated with a GBIF-funded project: no\\n\\n\\nExpects to publish:\\n\\n\\n
        - ResourceMetaData\\n - ChecklistData\\n - OccurrenceData\\n - SamplingEventData\\n\\nExpected
        data content:\\n\\n> We plan to publish biodiversity datasets including vegetation
        survey records, plant specimens from the PPI Herbarium, microbial experiment
        data, and GIS-based ecological observations. Additional datasets will include
        animal ecology surveys, plant physiology and carbon sequestration studies,
        as well as sampling-event data from long-term field monitoring.\\n\\n\\nWill
        run a server which exposes data: no\\n\\n\\nPlans to run publishing software
        (e.g. an IPT): no\\n\\n\\nNeeds help for data publishing: no\\n\",\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-09-02T06:55:18.283+00:00\",\"modified\":\"2025-09-02T06:55:18.283+00:00\"}]},{\"key\":\"211d9f99-95d8-498f-a6d7-846800019600\",\"endorsingNodeKey\":\"f4457fbc-1e17-4559-b8f8-9465217a5b7c\",\"endorsementApproved\":true,\"endorsementStatus\":\"ENDORSED\",\"title\":\"CABCN\",\"description\":\"Central
        Asia Biodiversity Conservation Network (CABCN) is a regional\\nnetwork dedicated
        to the implementation of the Global Strategy for Plant Conservation\\n(GSPC)
        through international cooperation. Its primary objective is to establish a\\ncomprehensive
        biodiversity conservation framework at the regional level in Central Asia.\\nCABCN
        was established to facilitate the Central Asia Green Road Project by fostering\\ncollaborative
        research on biodiversity conservation and enhancing the capacity of\\ntaxonomists
        and biodiversity experts from both Korea and Central Asia. This project was\\nlaunched
        following a proposal from the Korea Forest Service (KFS) at the 7th Korea-\\nCentral
        Asia Cooperation Forum in Bishkek, Kyrgyzstan, in 2013, and further advanced
        at\\nthe 8th Korea-Central Asia Cooperation Forum in Seoul, Republic of Korea,
        in 2014.\",\"language\":\"eng\",\"email\":[],\"phone\":[],\"homepage\":[],\"address\":[\"Mirzo
