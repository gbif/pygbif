        associated with a GBIF-funded project: no\\n\\n\\nExpects to publish:\\n\\n\\n
        - SamplingEventData\\n - OccurrenceData\\n - ResourceMetaData\\n\\nExpected
        data content:\\n\\n> Marine Species Monitoring: IUEM conducts regular monitoring
        of coastal marine species including birds.\\n> Phytoplankton Biodiversity:
        IUEM collects data on microphytoplankton along French coasts. This data helps
        in understanding the evolution of pelagic ecosystems and the impact of environmental
        changes on phytoplankton communities.\\n> Benthic Habitats: IUEM monitors
        macrofauna and macroflora communities associated with various benthic habitats,
        including soft intertidal zones, intertidal macroalgae, eelgrass beds, and
        maerl beds. This data is crucial for assessing the health of marine ecosystems
        and complying with environmental directives such as the Water Framework Directive
        (WFD) and the Marine Strategy Framework Directive (MSFD)\\n\\n\\nWill run
