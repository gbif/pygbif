        after consultation with the COL node manager, forwarding request to node manager
        Cameroon\",\"createdBy\":\"andrea\",\"modifiedBy\":\"andrea\",\"created\":\"2025-10-22T14:26:19.065+00:00\",\"modified\":\"2025-10-22T14:26:19.065+00:00\"},{\"key\":43151,\"content\":\"\\nIs
        associated with a GBIF-funded project: no\\n\\n\\nExpects to publish:\\n\\n\\n
        - ChecklistData\\n - OccurrenceData\\n - SamplingEventData\\n - ResourceMetaData\\n\\nExpected
        data content:\\n\\n> Green Awareness offrira plusieurs cat\xE9gories de donn\xE9es
        interconnect\xE9es, essentielles \xE0 la valorisation scientifique et \xE0
        la conservation de la biodiversit\xE9 notamment : \\n> - Donn\xE9es d'occurrence
        qui fait suite \xE0 l'observation document\xE9 de la pr\xE9sence des esp\xE8ces
        \xE0 un lieu et moment pr\xE9cis. ces donn\xE9es enregistr\xE9es constitueront
        une base principale des jeux de donn\xE9es publi\xE9s sur le GBIF.\\n> - Donn\xE9es
        taxonomiques qui se r\xE9f\xE8rent des identifications des oiseaux observ\xE9s,
        comprenant le nom scientifique complet, le nom vernaculaire, la famille, l'ordre,
        et, lorsque possible, l'identifiant GBIF ou Catalogue of Life. \\n> - M\xE9tadonn\xE9es
        temporelles et spatiales pour r\xE9f\xE9rencer les dates, heures, les coordonn\xE9es
        GPS et la pr\xE9cision g\xE9ographique de la localisation.\\n> - Donn\xE9es
        d'effort d'observation qui va renseigner sur la dur\xE9e de l'observation,
        le nombre d'observateurs, les conditions m\xE9t\xE9orologiques, la m\xE9thode
        employ\xE9e \\n> -Donn\xE9es d\u2019effort d\u2019observation : informations
        sur la dur\xE9e de l\u2019observation, le nombre d\u2019observateurs, les
        conditions m\xE9t\xE9orologiques, la m\xE9thode employ\xE9e (transect, point
        d\u2019\xE9coute, observation opportuniste, etc.).\\n> - Donn\xE9es num\xE9riques
        (photos, vid\xE9os) permettant d'enregistrer les visuels et sonores pour appuyer
        la validation des observations et enrichir les archives num\xE9riques accessibles
        via GBIF8\\n\\n\\nWill run a server which exposes data: yes\\n\\n\\nPlans
        to run publishing software (e.g. an IPT): yes\\n\\n\\nNeeds help for data
        publishing: yes\\n\",\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-10-21T20:10:25.079+00:00\",\"modified\":\"2025-10-21T20:10:25.079+00:00\"}]},{\"key\":\"b61f7626-9aa4-4b43-8e3e-6c97251c6adf\",\"endorsingNodeKey\":\"477b14bb-3d5c-474b-8dec-6bd73dd67dec\",\"endorsementApproved\":true,\"endorsementStatus\":\"ENDORSED\",\"title\":\"Institute
        of Zoology Slovak Academy of Sciences\",\"description\":\"Research activities
        at the Institute of Zoology SAS include basic and applied research in zoology,
        physiology, hydrobiology, ecology, and related biological disciplines. The
        main areas of interest relevant to GBIF's mission are as follows:\\n1. Parasitology
        and epidemiology, with a focus on ticks and tick-borne pathogens.\\n2. Taxonomy,
        systematics, phylogeny, ethology, and ecology of invertebrate animals (insects,
        ticks, soil and water invertebrates) and vertebrate animals (birds and small
        mammals).\\n3. Regional faunistic research on these animal groups is also
        conducted.\",\"language\":\"eng\",\"email\":[\"jana.kusnirova@savba.sk\"],\"phone\":[\"+
