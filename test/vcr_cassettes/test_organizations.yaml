        Universitaire Europ\xE9en de la Mer\",\"description\":\"The European University
        Institute of the Sea (IUEM) is a federative research group in marine and coastal
        sciences, established in 1997. As a federative research group, IUEM is under
        the supervision of the University of Western Brittany (Univ. Brest, UBO),
        CNRS, and IRD. It hosts approximately 540 staff members and comprises 7 research
        units (AMURE, LBCM, LETG-Brest, LGO, LEMAR, LMEE, LOPS). All units, except
        LBCM, are Joint Research Units (UMR) associated with the CNRS. The IRD oversees
        LEMAR and LOPS, while Ifremer oversees AMURE, LEMAR, LMEE, and LOPS.  IUEM
        is an internal school of UBO and, as such, hosts the master's programs in
        marine and coastal sciences and houses the Doctoral School of Marine and Coastal
        Sciences (EDSML). IUEM is an Observatory of the Universe Sciences of INSU-CNRS,
        which manages or contributes to national observation services (ARGO-France,
        Dynalit, Somlit, CoastHF), hosts the coordination of the IR ILICO, and supports
        its own observation series. The Environment and Ecology Institute INEE-CNRS
        is also present as a supervisory body of several UMRs (AMURE, LETG, LEMAR,
        LMEE) and within the Brest Iroise Workshop Zone.\",\"language\":\"eng\",\"email\":[\"direction.iuem@univ-brest.fr\"],\"phone\":[],\"homepage\":[\"http://www-iuem.univ-brest.fr/\"],\"logoUrl\":\"https://www-iuem.univ-brest.fr/wp-content/uploads/2018/06/iuem-logo-header.png\",\"address\":[\"rue
