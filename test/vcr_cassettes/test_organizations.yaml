        Nacional del Comahue Bariloche (UNCo Bariloche), Colecciones Biol\xF3gicas\",\"description\":\"Las
        colecciones biol\xF3gicas de la Universidad Nacional del Comahue en su sede
        en Bariloche incluyen: 1. Herbario BCRU, con colecciones de plantas vasculares,
        cript\xF3gamas y un cepario de bacterias y hongos; 2. Colecci\xF3n de Artr\xF3podos
        BACRU y 3. Colecci\xF3n de Mam\xEDferos CMIN.\\nEstas colecciones est\xE1n
        principalmente enfocadas en la biodiversidad de la Patagonia y de los Andes
        australes, y apoyan tanto a la investigaci\xF3n cient\xEDfica como a la educaci\xF3n.\\n\\n-----\\n\\nThe
        biological collections of the Universidad Nacional del Comahue at Bariloche
        include: 1. BCRU Herbarium, with collections of vascular plants, cryptogams,
        and microbial and fungal cultures; 2. Collection of arthropods BACRU; and
        3. Collection of Mammals CMIN.\\nThese collections are primarily focused on
        the biodiversity of Patagonia and the southern Andes, and support both scientific
        research and education.\",\"language\":\"eng\",\"email\":[\"ccalvino@comahue-conicet.gob.ar\"],\"phone\":[],\"homepage\":[],\"logoUrl\":\"https://web.crub.uncoma.edu.ar/wp-content/uploads/2021/04/logo-unco-bariloche-azul-gris.png\",\"address\":[\"Quintral
