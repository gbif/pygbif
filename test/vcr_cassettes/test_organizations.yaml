        44 701 4001\"],\"homepage\":[],\"address\":[\"Pohjoispuisto 7\"],\"city\":\"Pori\",\"province\":\"Satakunta\",\"country\":\"FI\",\"postalCode\":\"FI-28100\",\"createdBy\":\"finbif\",\"modifiedBy\":\"finbif\",\"created\":\"2025-07-14T11:20:40.395+00:00\",\"modified\":\"2025-07-22T09:34:41.705+00:00\"}],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[]},{\"key\":\"a22ee325-d036-47b5-a29c-fbfc0814b50c\",\"endorsingNodeKey\":\"dd514216-5c7c-45f3-910d-797424cb5be6\",\"endorsementApproved\":true,\"endorsementStatus\":\"ENDORSED\",\"title\":\"Ostrobothnian
        Museum\",\"description\":\"The natural history collections of the Ostrobothnian
        Museum include specimens of plants, animals, and stones. The collections mainly
        represent the flora and fauna of the biotic region of southern Ostrobothnia
        (Ostrobothnia Australis). The plant collection was established in 1925 and
        the insect collection in 1928. The collections include a small number of fish,
        reptiles, molluscs, and other organisms.\\n\\nThe bird collection consists
        of nearly 600 specimens and more than 100 nests with eggs and a number of
        unidentified eggs. The mammal collection contains about 80 animals. The most
        important of these are in the Bod\xE9n-Stenb\xE4ck collection. J. A. Bod\xE9n
        and district physician I. Stenb\xE4ck were pioneers in Finnish art of conservation.
        They donated their collection to the City of Vaasa in 1886.\\n\\nThe insect
        collection consists of about 37 000 specimens of various insects, including
        beetles, butterflies, and Hymenoptera. Sub-collections include the butterfly
        collection of jaeger Emil Sj\xF6holm and the butterfly collection of Birger
        and Hj\xF6rdis Lingonblad.\\n\\nThe plant collection contains some 46 000
        plant specimens, most of which are vascular plants. The plant collection also
        includes a small collection of algae, lichens, and mosses.\",\"language\":\"eng\",\"email\":[\"museoinfo@vaasa.fi\"],\"phone\":[\"+35863253800\"],\"homepage\":[\"https://www.vaasa.fi/en/see-and-experience/culture-in-vaasa-and-vaasa-region/museums-of-vaasa/collections/collections-of-the-ostrobothnian-museum/\"],\"logoUrl\":\"https://www.vaasa.fi/app/uploads/2024/02/d4437661-vaasan-museot-pikto_logo-2-150x150.png\",\"address\":[\"Museokatu
        3\"],\"city\":\"Vaasa\",\"province\":\"Ostrobothnia\",\"country\":\"FI\",\"postalCode\":\"FI-65100\",\"latitude\":63.09974,\"longitude\":21.60186,\"numPublishedDatasets\":4,\"createdBy\":\"finbif\",\"modifiedBy\":\"finbif\",\"created\":\"2025-07-11T12:22:58.856+00:00\",\"modified\":\"2025-07-24T06:31:53.674+00:00\",\"endorsed\":\"2025-07-11T12:22:58.856+00:00\",\"contacts\":[{\"key\":6169315,\"type\":\"ADMINISTRATIVE_POINT_OF_CONTACT\",\"primary\":true,\"userId\":[],\"firstName\":\"Tuomas\",\"lastName\":\"Jokela\",\"position\":[\"Curator\"],\"email\":[\"tuomas.jokela@vaasa.fi\"],\"phone\":[],\"homepage\":[],\"address\":[],\"createdBy\":\"finbif\",\"modifiedBy\":\"finbif\",\"created\":\"2025-07-11T12:41:58.978+00:00\",\"modified\":\"2025-07-11T12:41:58.978+00:00\"}],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[]},{\"key\":\"f128088f-0392-4e85-8af0-34d52e39fa08\",\"endorsingNodeKey\":\"dd514216-5c7c-45f3-910d-797424cb5be6\",\"endorsementApproved\":true,\"endorsementStatus\":\"ENDORSED\",\"title\":\"Forssa
        Nature Museum\",\"abbreviation\":\"FLHM\",\"description\":\"The first steps
        towards the establishment of the Forssa Museum of Natural History were taken
        in 1951, when The South-West H\xE4me Commission on Conservation of Nature
        was founded as a division of The South-West H\xE4me Regional and Museum Society.
        This society - Finland's first local one of the field - became an independent
        registered society in 1956 as The Nature Conservation Society of South-West
        H\xE4me.\\n\\nThe founder of the society and from then on its chairman, Torild
        Brander, then immediately started the systematic inventory of South-West H\xE4me
        minerals, flora, and fauna - in the 50s it was far from clear as it is today
        what species inhabit the society's geographical area of activity. During this
        inventory quite a collection was gathered for the museum of natural history.
        The collections were at first, from 1957 to 1967, stored at the society's
        office and archives on Vapaudenkatu, Forssa. Specimens would occasionally
        be brought out on display for example at exhibitions in local schools.\\n\\nGradually
        the collections grew so that the so-called public section of the collections
        was separated into its own entity. The first public museum was opened in the
        spacious second floor of Virastotalo on Kartanonkatu 10 in 1968. The more
        properly scientific collection remained private. The public section was named
        the Forssa Museum of Natural History, today the Forssa Nature Museum, as an
        expression of gratitude to the Town of Forssa.\\n\\nIn 1973 the exhibition
        moved from Virstotalo to the first floor of the town's fire station, a much
        smaller space. The Town of Forssa built the first premises especially designed
        for museum use on the first floor up in the waste spinning mill building of
        the old Finlayson premises. These premises became utilized as the museum in
        1988. In addition to its exhibitions, the museum now has closed rooms for
