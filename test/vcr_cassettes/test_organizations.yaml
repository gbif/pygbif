        Uganda\",\"description\":\"NatureUganda is a leading conservation NGO dedicated
        to documentation, monitoring, and conservation-focused management of Uganda's
        biodiversity. Our work integrates long-term ecological studies, species and
        habitat censuses, and community-driven restoration in key ecosystems. We organize
        and harness biodiversity data from field surveys, ESIA reports, and citizens
        science, focusing on birds, amphibians, reptiles, and aquatic organisms. Being
        Uganda's BirdLife partner and a regional center of excellence for biodiversity
        information, we endorse open-access sharing of data and policy-relevant conservation
        in alignment with GBIF objectives.\\n\\n- Mission & Vision: NatureUganda promotes
        the understanding, appreciation, and conservation of nature, integrating science,
        community action, and sustainable development.\\n- Conservation Programs:
        Learn about their work on key species, habitats, and Important Bird Areas
        (IBAs), including restoration and climate-smart agriculture.\\n- Research
        & Monitoring: Access insights from biodiversity surveys, ecological assessments,
        and citizen science initiatives.\\n- Membership & Volunteering: Opportunities
        to join as a member, volunteer, or partner in conservation.\\n- News & Events:
        Updates on fieldwork, workshops, and regional collaborations.\\n- Contact
        Info: Office located at Bwindi Trust House, Plot 1 Katalima Crescent, Naguru,
        Kampala.\",\"language\":\"eng\",\"email\":[\"mathias.behangana@natureuganda.org\"],\"phone\":[\"0772500171\"],\"homepage\":[\"https://natureuganda.org/\"],\"address\":[\"Plot
        1, Katalima Crescent, Lower Naguru\"],\"city\":\"Kampala\",\"country\":\"UG\",\"postalCode\":\"+256\",\"numPublishedDatasets\":0,\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-10-29T12:29:36.994+00:00\",\"modified\":\"2025-10-29T12:29:36.994+00:00\",\"contacts\":[{\"key\":6308852,\"type\":\"ADMINISTRATIVE_POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Achilles\",\"lastName\":\"Byaruhanga\",\"position\":[],\"email\":[\"achilles.byaruhanga@natureuganda.org\"],\"phone\":[\"0772522727\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-10-29T12:29:36.994+00:00\",\"modified\":\"2025-10-29T12:29:36.994+00:00\"},{\"key\":6308853,\"type\":\"POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Mathias\",\"lastName\":\"Behangana\",\"position\":[],\"email\":[\"mathias.behangana@natureuganda.org\"],\"phone\":[\"0772500171\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-10-29T12:29:36.994+00:00\",\"modified\":\"2025-10-29T12:29:36.994+00:00\"}],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[{\"key\":43987,\"content\":\"\\nExpects
        to publish:\\n\\n\\n - ResourceMetaData\\n - ChecklistData\\n - OccurrenceData\\n
        - SamplingEventData\\n\\nExpected data content:\\n\\n> NatureUganda aims to
        publish biodiversity data from a range of sources and media, including:\\n>
        - Species occurrence records from field surveys, especially amphibians, reptiles,
        birds, and wetland animals\\n> - Environmental Impact Assessment (ESIA) data
        extracted from development projects all over Uganda\\n> - Species recovery,
        condition of habitats, and ecological baseline records from restoration site
        records\\n> - Bird counts, citizen science observations, and community monitoring
        programmes\\n> - Metadata-linked images and audio of species and habitats\\n>
        - Digitized literature- and history-based records from publications and reports\\n>
        - Conservation-livelihood integrated program data on land-use and climate-smart
        agriculture\\n> These data will be ready to GBIF standards with tested and
        verified metadata, guiding open-access biodiversity data and regional ecological
        planning.\\n\\n\\nWill run a server which exposes data: yes\\n\\n\\nPlans
        to run publishing software (e.g. an IPT): no\\n\\n\\nNeeds help for data publishing:
        yes\\n\",\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-10-29T12:29:36.994+00:00\",\"modified\":\"2025-10-29T12:29:36.994+00:00\"}]},{\"key\":\"95112886-79ab-4799-b3b4-e28a748d4b2b\",\"endorsingNodeKey\":\"7f48e0c8-5c96-49ec-b972-30748e339115\",\"endorsementApproved\":true,\"endorsementStatus\":\"ENDORSED\",\"title\":\"Institute
        of Vertebrate Biology, Czech Academy of Sciences\",\"description\":\"The Institute
        of Vertebrate Biology (IVB) of the Czech Academy of Sciences conducts research
