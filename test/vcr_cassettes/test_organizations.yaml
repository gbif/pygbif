        Kokkola Museum of Natural History\",\"description\":\"The purpose of Veikko
        Salkio\u2019s life\u2019s work was to promote nature conservation and environmental
        education. Kieppi continues the work of its founder by spreading environmental
        knowledge through the hundreds of specimens in the collection.\\n\\nSalkio
        wanted to donate his collection to all interested in nature and animals. Future
        generations should have the chance to experience the variety of nature: \u201CMy
        aim is that the collection is still on display in the year 4999.\u201D The
        City of Kokkola enabled the development of the nature history collection and
        still finds it important.\\n\\nThe name of the Kieppi natural history collection
        was changed in 2012 into its current form: Kieppi, Kokkola Museum of Natural
        History. Here you will find more information about the different stages of
        the natural history collection and about how the other collections ended up
