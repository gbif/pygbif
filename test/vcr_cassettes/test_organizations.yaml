        Homi Bhabha State University\",\"description\":\"Dr. HOMI BHABHA STATE UNIVERSITY,
        MUMBAI (HBSU)\\nThe Government of Maharashtra has established the Dr. Homi
        Bhabha State University, as a Cluster University in 2019, with the Institute
        of Science, Mumbai; Elphinstone College, Mumbai; Sydenham College, Mumbai;
        Secondary Training College, Mumbai; Institute of Forensic Science, Mumbai;
        and Sydenham Institute of Management Studies, Research and Entrepreneurship
        Education, Mumbai as the Constituent Colleges. The Institute of Science, Mumbai
        is the Lead Institute of the University. All the colleges are more than 100
        years old; the youngest the Institute of Science was established in 1920;
        while the oldest the Elphinstone College was established in 1835..\\n\\n \\n\\nThe
        University is an independent degree granting entity with its own Rules and
        Regulations. This is the first University of its kind in the State of Maharashtra
        and is established as per the guidelines of Rashtriya Ucchatar Shiksha Abhiyan
        (RUSA). The establishment of this University is expected to charge the Higher
        Education system in the State with new vigour. It will lead to optimum use
        of resources of the constituent colleges and will offer the learners wide
        options of learning with flexibility and assist them with student-friendly
        support system. It will generate contemporary and relevant infrastructure
        and provide undergraduate and postgraduate programmes in diverse disciplines
        under choice based credit system (CBCS). The CBCS will adopt a cafeteria approach,
        where the students will be given freedom to select some courses from an array
        of courses as per their preferences. The students may take some of the courses
        across the constituent colleges. The programmes will be dynamic and demand
        driven. The students may participate in various activities organized by the
        constituent colleges.\\n\\nSome Special Features of the HBSU\\nInherent Multidisciplinary
        Education and Research University (MERU) Structure of Dr. Homi Bhabha State
        University, Mumbai\\nBeing the University of Cluster of only four constituent
        colleges, which are geographically in proximity, the University is managed
        and administered much more efficiently\\nAll the constituent colleges are
        accredited by Grade \u2018A\u2019 by the NAAC.\\nAll the colleges are elite
        colleges, are in existence for a long time, and with heritage mark.\\nThe
        colleges are Government Colleges and hence the fee structure is regulated
        and reasonable.\\nThe students are trained under Choice Based Credit System
        (CBCS) and offered subjects in a cafeteria mode.\\nThe students studying any
        core subject is allowed to take additional credits across the disciplines
        so as to enrich his learning experience.\\nConstituent colleges elite HEIs,
        in existence for more than 100 years, & with heritage mark\\nFocus on Skills,
        Industry Partnership, CBCS, Internship, Training & Placement of the students\\nEfficient,
        Timely Examination and Evaluation Process\\nRich Legacy with prominent Alumni
        network\\nConstituent Colleges\\nTHE INSTITUTE OF SCIENCE, MUMBAI (ISCM)\\nThe
        Institute of Science, Mumbai, formerly known as the Royal Institute of Science
        (RIS), was established in 1920 by the Royal Charter. It is a premier post-graduate
        centre for teaching and research. The I.Sc. has been identified as a centre
        with potential for excellence by the UG. It was reaccredited with Grade \u2018A\u2019
        by the National Accreditation and Assessment Council (NAAC) in 2014. It is
        the Lead Institute of the Dr. Homi Bhabha State University.\\n\\nThe Institute
        has nine Departments \u2013 biochemistry, biotechnology, botany, chemistry,
        environmental Science, Mathematics, Microbiology, Physics and Zoology. It
        offers Masters and Research programmes in Science. The institute receives
        grants for infrastructure from the UGC, DST, and Government of Maharashtra.
        It provides excellent facilities for research. Every Department is well equipped
        with sophisticated instruments. The instruments include AAS, HPTLC, HPLC,
        GC-MS, TG/DTA, NMR, IR, XRD, PCR, and Electrochemical Workstation. Its Library
        is one of the finest libraries in the city and provides large number of e-resources.
        The Institute has Botanical Garden with rare plants. The college provides
        limited Hostel facilities. It gives a number of Awards, Prizes and Scholarships
        to meritorious students.\\n\\n\\nAddress: 15, Madam Cama Road, Mumbai-400032\\nWebsite:
        www.iscm.ac.in\\nEmail: info[at]iscm[dot]ac[dot]in, admission[at]iscm[dot]ac[dot]in(for
        admission)\\nTel No: 022-22828393\\n\\nTHE ELPHINSTONE COLLEGE, MUMBAI\\nThe
        Elphinstone Institution was established in 1835 under the Bombay Native Education
        (Trust). The enlightened citizens of Mumbai collected a sum of Rs. 2,29,636
        for the Institution and the name was given as a tribute to the departing Governor
        of Bombay, Mountstuart Elphinstone (6th October, 1779 \u2013 20th November,
        1859). The classes commenced in 1836 and Elphinstone college separated from
        the High School in 1856. Thus the college was established before the establishment
        of the University of Mumbai; and in fact in the inception stage the classes
        of the University used to be held at the college. The college occupies a unique
        position in the annals of higher education in the country. The building of
        the college with its Gothic architecture has been classified as a Grade I
        Heritage structure. The college was awarded the Asia-Pacific Heritage Award
        for Culture Heritage Conservation by the UNESCO. The college has a Library
        with rich collection of over one lakh books. It is accredited with Grade \u2018A\u2019
        by the NAAC.\\n\\n\\nAddress: 156, Mahatma Gandhi Road, Mumbai-400032\\nWebsite:
        \ www.elphinstone.ac.in \\nEmail:  info[at]elphinstone[dot]ac[dot]in,  elphinstone1856[at]gmail[dot]com\\nTel
        No: 022-2284 4060 / 3797\\n\\nTHE SYDENHAM COLLEGE OF COMMERCE AND ECONOMICS,
        MUMBAI\\nThe college started on October 22, 1913, in a small borrowed premise
        of Elphinstone College, and was called the Government College of Commerce.
        Acknowledging the contributions of Lord Sydenham, the then Governor of the
        Bombay Presidency, towards the growth of the college, the college was named
        as Sydenham College. The college was shifted to the present campus in 1955.\\n\\nIt
        is the first institution offering commerce education in Asian countries and
        remained to be so for a long time. It is awarded Most Trusted Brands Award
        by Consumer Survey Report in 2016 and Asia\u2019s Most Trusted Brand Award.
        Many of its graduates get selected for higher and professional studies in
        foreign universities. NAAC has awarded \u201CA\u2019 grade to the college.
        It is recognized as the faculty development centre by the MHRD, New Delhi,
        in 2018.\\n\\n\\nAddress:  B- Road, Churchgate, Mumbai - 400 020.\\nWebsite:
        \ www.sydenham.ac.in\\nEmail:  sydprincipal[at]yahoo[dot]co[dot]in\\nTel No:
        022-220442897, 22871452\\n\\nSECONDARY TRAINING COLLEGE, MUMBAI\\nThe Secondary
        Training College, Mumbai, is a premier teachers training institute in Mumbai.
        It was established in 1906 as per the recommendations of the Wood\u2019s Dispatch
        (1854). It was a Diploma (S.T.C.) granting college, and after the permanent
        affiliation to the University of Mumbai, it started granting B.T. degree.
        Since 1955 the degree granted is B.Tech., The vision of the college is to
        prepare excellent teachers through capacity-building training. The college
        has a well-equipped library, ultra-modern computer laboratory, and educational
        technology cell. The college is accredited with \u2018A\u2019 grade, CGPA
        3.23 in 2015 by NAAC.\\n\\n\\nAddress:  3, Mahapalika Marg, Dhobi Talao, Mumbai-400
        001.\\nWebsite: www.secondarytrainingcollege.org\\nEmail:  secondarytrainingcollege[at]gmail[dot]com\\nTel
        No: 022-22620050\\n\\nINSTITUTE OF FORENSIC SCIENCE, MUMBAI\\nThe Institute
        of Forensic Science was established in 2009 by the Department of Higher and
        Technical Education of the State Government of Maharashtra, with the aim of
        creating a world-class curriculum in the field of Forensic Science to educate
        and train young minds to counter the rising crime scenario in the country.\\n\\nThe
        institute offers several courses including, BSc in Forensic Science, MSc in
        Forensic Science with specialisations in Forensic Serology and DNA Analysis,
        Toxicology, Ballistics, and Digital and Cyber Forensics, as well as Post Graduate
        Diploma courses in Forensic Science and Cyber Forensics. In the due course
        of time, the institute also aspires to be starting a number of short-term
        courses for professionals in a variety of forensically essential subjects,
        such as Questioned Documents and Fingerprinting, Forensic Journalism etc.\\n\\nThe
        Institute of Forensic Science is a constituent institute of Dr. Homi Bhabha
        State University, Mumbai and is housed under one of the most historically
        beautiful heritage buildings of the city- the Institute of Science, Mumbai.
        The campus is an exorbitant with natural beauty as well as highly well-equipped
        with all essential modern infrastructures, including excellent instrumental
        and library facilities. Academically, the college consists of 7 multidisciplinary
        departments, namely, Department of Forensic Science, Department of Forensic
        Chemistry, Department of Forensic Physics, Department of Forensic Biology,
        Department of Forensic Psychology, Department of Digital and Cyber Forensics,
        and Department of Law. The ultimate goal of the institute is providing world
        class forensic curriculum suiting the students, crime detection agencies,
        corporate offices, banks, etc. which will ultimately open up job opportunities
        for the students and allow them in assisting and directing the Judiciary system
        in the country to its maximum competence!\\n\\n\\nAddress:  15, Madam Cama
        Road, Mumbai-400032.\\nWebsite: www.ifsm.ac.in\\nEmail:  forensicscience[at]gmail[dot]com\\nTel
        No: 022-22816102\\n\\nSYDENHAM INSTITUTE OF MANAGEMENT STUDIES, RESEARCH AND
        ENTREPRENEURSHIP EDUCATION, MUMBAI\\nIn keeping with the rich Sydenham tradition
        of imparting high quality education, the Sydenham Institute of Management
        Studies, Research and Entrepreneurship Education (SIMSREE) was founded in
        the year 1983. Since then, SIMSREE has endeavoured to produce global managers
        of shining excellence. Today, 38 years after its inception, SIMSREE stands
        as one of the most popular management institutes in India. Located at Churchgate,
        in the heart of the financial capital of the country, SIMSREE has the advantage
