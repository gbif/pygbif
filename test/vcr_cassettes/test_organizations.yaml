        of Turku - Department of Biology\",\"description\":\"The University of Turku's
        Department of Biology explores life and biological evolution in a range of
        terrestrial and aquatic ecosystems. The Department of Biology is one of the
        scientifically most productive units of the University and successfully educates
        experts at all degree levels.\\n\\nThe Department of Biology does internationally
        recognized research at all organization levels of life, from molecules to
        ecosystems.  Model organisms include humans and other animals, plants, algae,
