        Bee Society of BC\",\"description\":\"The Native Bee Society of British Columbia
        was founded in 2019 to bring together bee experts and enthusiasts to promote
        native bee species as a critical component of a healthy ecosystem. Through
        outreach and education, we aim to increase public awareness around the 500+
