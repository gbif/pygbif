        Ocean Exploration\",\"description\":\"NOAA Ocean Exploration (NOAA Office
        of Ocean Exploration and Research) is the only federal program dedicated to
        exploring the unknown ocean, unlocking its potential through scientific discovery,
        technological advancements, partnerships, data delivery, and education. By
        leading national efforts to fill gaps in basic understanding of the deep-ocean
        environment, we are providing critical data, information, and awareness needed
        to protect American livelihoods, strengthen national security, and promote
        a vibrant U.S. economy.\\n\\nWe execute our mission to explore the ocean for
        national benefit by leading expeditions on NOAA Ship Okeanos Explorer and
        other research vessels; establishing public, private, and academic partnerships;
        providing funding and other support for ocean exploration expeditions and
        technology development, including via a competitive grants program; and guiding
