        Management Consortium\",\"abbreviation\":\"WMC\",\"description\":\"WMC works
        are undertaken in a sympathetic manner in accordance with environmental legislation.
        Wildlife sightings in our watercourses demonstrate that systems can be well
        maintained without adversely affecting the environment.\\r\\n\\r\\nIDBs are
        public bodies that manage water levels in areas of special drainage need.
        \ They undertake works to reduce the flood risk to people and property, and
        manage water levels for agricultural and environmental needs within their
        district.\\r\\n\\r\\nThe Water Management Consortium covers a total area of
        120,106 hectares and includes the following internal drainage boards (IDBs):\\r\\n*
        Lindsey Marsh Drainage Board (LM)\\r\\n* Isle of Axholme and North Nottinghamshire
        Water Level Management Board (AX)\\r\\n* Trent Valley Internal Drainage Board
        (TV)\\r\\n* Doncaster East Internal Drainage Board (DE)\\r\\n\\r\\nAll our
        work is undertaken in a sympathetic manner in accordance with environmental
