        associated with a GBIF-funded project: no\\n\\n\\nExpects to publish:\\n\\n\\n
        - ResourceMetaData\\n - OccurrenceData\\n - SamplingEventData\\n\\nExpected
        data content:\\n\\n> In the coming years, we plan to mobilize and publish
        data from various sources, including a literature review of fish occurrences
        in Hokkaido, the NIES algae culture collection, citizen science observation
        records, national surveys and monitoring projects, and the Lake Kasumigaura
        monitoring program. We will publish sampling-event datasets, including records
        of absence, provided that the study methods are well-documented. Additionally,
        our research projects align with new data models such as Camtrap DP and DNA-derived
        datasets. In collaboration with the National Institute of Genetics (ROIS),
        we have provided datasets for nearly 10 years. We now aim to become an official
        publisher to take responsibility for our datasets and receive appropriate
        credit as an institution. We are preparing to publish datasets through the
        IPT hosted by ROIS, and would like to kindly request a token for our institution.
        As a member of JBIF, we have been actively collaborating with stakeholders
        and are interested in publishing biodiversity datasets contributed by government
        agencies, research institutions, universities, and the citizen science community.\\n\\n\\nWill
        run a server which exposes data: yes\\n\\n\\nPlans to run publishing software
        (e.g. an IPT): no\\n\\n\\nNeeds help for data publishing: no\\n\",\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-19T01:23:00.224+00:00\",\"modified\":\"2025-08-19T01:23:00.224+00:00\"}]},{\"key\":\"96904744-4552-4cc5-92d4-668c3e92038e\",\"endorsingNodeKey\":\"cdc9736d-5ff7-4ece-9959-3c744360cdb3\",\"endorsementApproved\":true,\"endorsementStatus\":\"ENDORSED\",\"title\":\"Instituto
        Federal Baiano\",\"description\":\"The Instituto Federal Baiano is a teaching,
        research, and extension institution whose mission is to generate social transformation
        in its territories through education, knowledge production, and technological
        innovation. The Instituto Federal Baiano Biological Collection, a repository
        of biodiversity research samples conducted by the institution's faculty, promotes
        the preservation of the region's biodiversity and stands out as a reference
        in biodiversity research in the Brazilian semiarid region.\",\"language\":\"eng\",\"email\":[\"gabinete@xique-xique.ifbaiano.edu.br\"],\"phone\":[\"(71)
