        County\",\"country\":\"TW\",\"postalCode\":\"36443\",\"latitude\":24.37237,\"longitude\":121.06781,\"numPublishedDatasets\":0,\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-15T09:12:38.721+00:00\",\"modified\":\"2025-08-15T09:12:38.721+00:00\",\"endorsed\":\"2025-08-15T09:28:57.491+00:00\",\"contacts\":[{\"key\":6207784,\"type\":\"ADMINISTRATIVE_POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Shu-Fen\",\"lastName\":\"Yu\",\"position\":[],\"email\":[\"Yu@nps.gov.tw\"],\"phone\":[\"+886-37-996100\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-15T09:12:38.721+00:00\",\"modified\":\"2025-08-15T09:12:38.721+00:00\"},{\"key\":6207785,\"type\":\"TECHNICAL_POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Yi-Sih\",\"lastName\":\"Huang\",\"position\":[],\"email\":[\"ys0621@nps.gov.tw\"],\"phone\":[\"+886-37-996100\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-15T09:12:38.721+00:00\",\"modified\":\"2025-08-15T09:12:38.721+00:00\"},{\"key\":6207786,\"type\":\"POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Yi-Sih\",\"lastName\":\"Huang\",\"position\":[],\"email\":[\"ys0621@nps.gov.tw\"],\"phone\":[\"+886-37-996100\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-15T09:12:38.721+00:00\",\"modified\":\"2025-08-15T09:12:38.721+00:00\"}],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[{\"key\":40086,\"content\":\"\\nIs
        associated with a GBIF-funded project: no\\n\\n\\nExpects to publish:\\n\\n\\n
        - ChecklistData\\n - OccurrenceData\\n - SamplingEventData\\n\\nExpected data
        content:\\n\\n> Our datasets are derived from comprehensive biological resource
        surveys within Shei-Pa National Park. They primarily include species checklists,
        detailing the flora and fauna in specific regions; species occurrence records,
        providing georeferenced data points for individual organisms; and structured
        sampling event data from our long-term monitoring programs. This information
        captures the rich biodiversity across the park\u2019s diverse habitats, from
        subtropical, warm-temperate forests to alpine zones. By sharing these core
        datasets, we aim to provide a valuable resource for taxonomic, ecological,
        and conservation research worldwide,\\n> contributing directly to the global
        understanding of mountain ecosystems.\\n\\n\\nWill run a server which exposes
        data: no\\n\\n\\nPlans to run publishing software (e.g. an IPT): no\\n\\n\\nNeeds
        help for data publishing: no\\n\",\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-15T09:12:38.721+00:00\",\"modified\":\"2025-08-15T09:12:38.721+00:00\"}]},{\"key\":\"f942c553-1517-4963-a753-4eecfee37533\",\"endorsingNodeKey\":\"8618c64a-93e0-4300-b546-7249e5148ed2\",\"endorsementApproved\":false,\"endorsementStatus\":\"WAITING_FOR_ENDORSEMENT\",\"title\":\"Thomas
        and Eno Nwoko Educational Foundation (TENEF USA) Inc\",\"description\":\"TENEF
        USA Inc. \u2013 Biodiversity Program Overview\\nThe Biodiversity Program of
        TENEF USA Inc. was established to support the systematic documentation of
        tropical forest herbs found in Akwa Ibom State and the broader South\u2013South
        region of Nigeria. Its primary goal is to collect and share reliable data
        with the Global Biodiversity Database, with a particular focus on the rich
        and often underrepresented plant life of this region.\\nTENEF USA has begun
        a collaborative review of existing records on unique plants\u2014especially
        those with proven or potential medicinal properties. This initiative aligns
        with TENEF\u2019s mission to promote environmental stewardship, educational
        enrichment, and community empowerment.\\nThe program places special emphasis
        on youth education within underserved communities, offering opportunities
        to learn about the economic and nutritional potential of local plants. Many
        of these herbs, historically overlooked, hold significant value as food sources
        and traditional medicines.\\nBy highlighting the economic potential of the
        region\u2019s biodiversity, the program seeks to lay a foundation for sustainable
        community development. This includes creating learning opportunities, fostering
        entrepreneurial exploration, and encouraging local ownership of biodiversity
        resources.\\nThe ultimate aim is to build strategic partnerships that will:\\n\u2022\\tDocument
        the unique plants of Nigeria\u2019s tropical forests.\\n\u2022\\tEducate future
        generations about the medicinal and ecological value of the coastal biodiversity
        ecosystem in Eastern Nigeria.\\n\u2022\\tContribute meaningful data to the
        Global Biodiversity Database in support of worldwide conservation efforts.\",\"language\":\"eng\",\"email\":[\"admin@tenefusa.org\"],\"phone\":[\"8322333858\"],\"homepage\":[\"https://tenefusa.org\"],\"logoUrl\":\"https://shorturl.at/wNoXP\",\"address\":[\"440
