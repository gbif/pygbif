        Pollinator Monitoring Scheme\",\"description\":\"UK PoMS is the first scheme
        in the world to have begun (since 2017) generating systematic data on the
        abundance of bees, hoverflies and other flower-visiting insects at a national
        scale. Together with long-term occurrence records collated by national recording
        schemes, these data are an invaluable resource from which to measure trends
        in pollinator populations and target conservation efforts.\\r\\n\\r\\n\\r\\nUK
        PoMS is a partnership funded jointly by the UK Centre for Ecology & Hydrology
        (UKCEH) and Joint Nature Conservation Committee (JNCC) (through funding from
        the Department for Environment, Food & Rural Affairs, Scottish Government,
        Welsh Government and Department of Agriculture, Environment and Rural Affairs
        for Northern Ireland). UK PoMS is co-ordinated by UKCEH. Project partners
        are Bumblebee Conservation Trust, Butterfly Conservation, British Trust for
        Ornithology, Buglife, Hymettus, Natural History Museum, Royal Horticultural
        Society, University of Reading and University of Leeds.\",\"language\":\"eng\",\"email\":[],\"phone\":[],\"homepage\":[\"https://ukpoms.org.uk/\"],\"logoUrl\":\"https://registry.nbnatlas.org/data/dataProvider/poms-logo.png\",\"address\":[],\"country\":\"GB\",\"numPublishedDatasets\":1,\"createdBy\":\"uknbn\",\"modifiedBy\":\"uknbn\",\"created\":\"2025-08-29T13:03:57.776+00:00\",\"modified\":\"2025-08-29T13:03:57.776+00:00\",\"endorsed\":\"2025-08-29T13:03:57.776+00:00\",\"contacts\":[],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[]},{\"key\":\"84070e70-ddfd-4bbb-9632-38b4d447046d\",\"endorsingNodeKey\":\"7f48e0c8-5c96-49ec-b972-30748e339115\",\"endorsementApproved\":true,\"endorsementStatus\":\"ENDORSED\",\"title\":\"Mycological
        Laboratory, Institute of Biology, Faculty of Natural Science and Mathematics,
        Ss. Cyril and Methodius University in Skopje\",\"description\":\"The Mycological
        Laboratory, at the Institute of Biology (Faculty of Natural Sciences and Mathematics,
        UKIM, Skopje) was founded in 2001. It mainly researches the mycodiversity
        of Macedonia, and ecotaxonomic studies of certain species are also carried
        out. In the last 15 years, a novelty in research has been molecular analyses
        aimed at phylogeny of certain groups of fungi (mainly done in collaboration
        in foreign countries). \\nThe Mycological Laboratory has constant international
        cooperation with scientific institutions, such as: the Department of Mycology
        at Philips University in Marburg, Germany; the Institute of Wood Chemistry
        in Riga, Latvia; the Faculty of Natural Sciences and Arts at Selcuk University
        in Konya, Turkey; the Institute of Forestry in Ljubljana, Slovenia; the Laboratory
        of Molecular Systematics, Royal Botanical Garden (RJB) in Madrid, Spain; the
        University of Palermo, Italy; the Institute of Microbiology at the University
        of Innsbruck, Austria; the Department of Botany and Biodiversity Research
        at the University of Vienna, Austria, and others.\\nWithin the Mycological
        Laboratory, the unique national collection of fungi (fungarium) operates,
        registered as the Macedonian Collection of Fungi (MCF) with about 25,000 specimens
        and a database (MAKFUNGI, in Access) with about 38,000 records of fungi from
        Macedonia, the Balkan Peninsula and beyond.\\nMost of the equipment in the
        Mycological Laboratory is provided by donations from various institutions
        or international projects.\\n\\n\\n\\n\u041C\u0438\u043A\u043E\u043B\u043E\u0448\u043A\u0430\u0442\u0430
        \u043B\u0430\u0431\u043E\u0440\u0430\u0442\u043E\u0440\u0438\u0458\u0430,
        \u043F\u0440\u0438 \u0418\u043D\u0441\u0442\u0438\u0442\u0443\u0442\u043E\u0442
        \u0437\u0430 \u0431\u0438\u043E\u043B\u043E\u0433\u0438\u0458\u0430 (\u041F\u0440\u0438\u0440\u043E\u0434\u043D\u043E-\u043C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u0447\u043A\u0438
        \u0444\u0430\u043A\u0443\u043B\u0442\u0435\u0442, \u0423\u041A\u0418\u041C,
        \u0421\u043A\u043E\u043F\u0458\u0435) \u0435 \u043E\u0441\u043D\u043E\u0432\u0430\u043D\u0430
        2001 \u0433\u043E\u0434\u0438\u043D\u0430. \u0412\u043E \u043D\u0435\u0430
        \u0433\u043B\u0430\u0432\u043D\u043E \u0441\u0435 \u0433\u043B\u0430\u0432\u043D\u043E
        \u0441\u0435 \u0438\u0441\u0442\u0440\u0430\u0436\u0443\u0432\u0430 \u043C\u0438\u043A\u043E\u0434\u0438\u0432\u0435\u0440\u0437\u0438\u0442\u0435\u0442\u043E\u0442
        \u043D\u0430 \u041C\u0430\u043A\u0435\u0434\u043E\u043D\u0438\u0458\u0430,
        \u0430 \u0441\u0435 \u0432\u0440\u0448\u0430\u0442 \u0438 \u0435\u043A\u043E\u0442\u0430\u043A\u0441\u043E\u043D\u043E\u043C\u0441\u043A\u0438
        \u0438\u0441\u043F\u0438\u0442\u0443\u0432\u0430\u045A\u0430 \u043D\u0430
        \u043F\u043E\u0435\u0434\u0438\u043D\u0438 \u0432\u0438\u0434\u043E\u0432\u0438.
        \u041F\u043E\u0441\u043B\u0435\u0434\u043D\u0438\u0442\u0435 15-\u0442\u0438\u043D\u0430
        \u0433\u043E\u0434\u0438\u043D\u0438 \u043A\u0430\u043A\u043E \u043D\u043E\u0432\u0438\u043D\u0430
        \u0432\u043E \u0438\u0441\u0442\u0440\u0430\u0436\u0443\u0432\u0430\u045A\u0430\u0442\u0430
        \u0441\u0435 \u043C\u043E\u043B\u0435\u043A\u0443\u043B\u0430\u0440\u043D\u0438\u0442\u0435
        \u0430\u043D\u0430\u043B\u0438\u0437\u0438 \u0441\u043E \u0446\u0435\u043B
        \u0444\u0438\u043B\u043E\u0433\u0435\u043D\u0438\u0458\u0430 \u043D\u0430
        \u043E\u0434\u0440\u0435\u0434\u0435\u043D\u0438 \u0433\u0440\u0443\u043F\u0438
        \u0433\u0430\u0431\u0438.\\n\u041C\u0438\u043A\u043E\u043B\u043E\u0448\u043A\u0430\u0442\u0430
        \u043B\u0430\u0431\u043E\u0440\u0430\u0442\u043E\u0440\u0438\u0458\u0430 \u0438\u043C\u0430
        \u043F\u043E\u0441\u0442\u043E\u0458\u0430\u043D\u0430 \u043C\u0435\u0453\u0443\u043D\u0430\u0440\u043E\u0434\u043D\u0430
        \u0441\u043E\u0440\u0430\u0431\u043E\u0442\u043A\u0430 \u0441\u043E \u043D\u0430\u0443\u0447\u043D\u0438
        \u0438\u043D\u0441\u0442\u0438\u0442\u0443\u0446\u0438\u0438, \u043A\u0430\u043A\u043E
        \u0448\u0442\u043E \u0441\u0435: \u041E\u0434\u0434\u0435\u043B\u043E\u0442
        \u0437\u0430 \u043C\u0438\u043A\u043E\u043B\u043E\u0433\u0438\u0458\u0430
        \u043F\u0440\u0438 \u0443\u043D\u0438\u0432\u0435\u0440\u0437\u0438\u0442\u0435\u0442
        \u0424\u0438\u043B\u0438\u043F\u0441 \u0432\u043E \u041C\u0430\u0440\u0431\u0443\u0440\u0433,
        \u0413\u0435\u0440\u043C\u0430\u043D\u0438\u0458\u0430; \u0418\u043D\u0441\u0442\u0438\u0442\u0443\u0442\u043E\u0442
        \u0437\u0430 \u0445\u0435\u043C\u0438\u0458\u0430 \u043D\u0430 \u0434\u0440\u0432\u043E
        \u0432\u043E \u0420\u0438\u0433\u0430, \u041B\u0430\u0442\u0432\u0438\u0458\u0430;
        \u0424\u0430\u043A\u0443\u043B\u0442\u0435\u0442\u043E\u0442 \u0437\u0430
        \u043F\u0440\u0438\u0440\u043E\u0434\u043D\u0438 \u043D\u0430\u0443\u043A\u0438
        \u0438 \u0443\u043C\u0435\u0442\u043D\u043E\u0441\u0442 \u043F\u0440\u0438
        \u0443\u043D\u0438\u0432\u0435\u0440\u0437\u0438\u0442\u0435\u0442 \u0421\u0435\u043B\u045F\u0443\u043A
        \u0432\u043E \u041A\u043E\u043D\u0458\u0430, \u0422\u0443\u0440\u0446\u0438\u0458\u0430;
        \u0418\u043D\u0441\u0442\u0438\u0442\u0443\u0442\u043E\u0442 \u0437\u0430
        \u0448\u0443\u043C\u0430\u0440\u0441\u0442\u0432\u043E \u043E\u0434 \u0409\u0443\u0431\u0459\u0430\u043D\u0430,
        \u0421\u043B\u043E\u0432\u0435\u043D\u0438\u0458\u0430; \u041B\u0430\u0431\u043E\u0440\u0430\u0442\u043E\u0440\u0438\u0458\u0430\u0442\u0430
        \u0437\u0430 \u043C\u043E\u043B\u0435\u043A\u0443\u043B\u0430\u0440\u043D\u0430
        \u0441\u0438\u0441\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430, \u041A\u0440\u0430\u043B\u0441\u043A\u0430
        \u0431\u043E\u0442\u0430\u043D\u0438\u0447\u043A\u0430 \u0432\u043E \u041C\u0430\u0434\u0440\u0438\u0434,
        \u0428\u043F\u0430\u043D\u0438\u0458\u0430; \u0423\u043D\u0438\u0432\u0435\u0440\u0437\u0438\u0442\u0435\u0442\u043E\u0442
        \u041F\u0430\u043B\u0435\u0440\u043C\u043E, \u0418\u0442\u0430\u043B\u0438\u0458\u0430;
