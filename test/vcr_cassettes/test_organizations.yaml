        Museum of Natural Science\",\"description\":\"The museum\u2019s Vertebrate
        Zoology collection contains over 5000 specimens. Birds represent approximately
        70% of the collection, and mammals approximately 25%, with herps and fish
        being represented to a lesser extent. The Texas coastal bend region is the
        major part of the collection, with other holdings including Africa, Latin
        America, threatened and endangered species, and select archived groups (gamebirds,
        pigeons/doves, parrots and LightsOut casualties). A constant effort is made
        to encourage and facilitate the use of the collections for research by students,
        scholars and interested scientists.\",\"language\":\"eng\",\"email\":[\"dbrooks@hmns.org\"],\"phone\":[\"713-639-4776\"],\"homepage\":[\"https://www.hmns.org/\"],\"address\":[\"5555
