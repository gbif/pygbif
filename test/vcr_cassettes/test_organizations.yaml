        populations, communities and ecosystems.\",\"language\":\"eng\",\"email\":[],\"phone\":[],\"homepage\":[\"https://www.utu.fi/en/university/faculty-of-science/biology\"],\"logoUrl\":\"https://upload.wikimedia.org/wikipedia/en/thumb/a/ab/University_of_Turku.svg/250px-University_of_Turku.svg.png\",\"address\":[\"Vesilinnantie
