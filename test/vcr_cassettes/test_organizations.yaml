        Anatolica\",\"description\":\"Floranatolica is managed by a group of dedicated
        volunteers. The platform aims to foster a deeper appreciation of nature and
        to inspire curiosity, research, and conservation efforts by providing general
        information about natural sites, routes, and living organisms.\\nFloranatolica
        offers a space where plant observations can be recorded, organized, and shared
        with other observers and researchers. Everyone is welcome to contribute voluntarily
        to this collective effort.\\nThe platform invites all nature enthusiasts\u2014including
        hikers, plant observers, mushroom gatherers, forest and park rangers, ecologists,
        and conservation-minded individuals\u2014to take part as citizen scientists.
        It also encourages researchers and academics to share their findings through
        accessible and systematic platforms.\\nFloranatolica believes that all data
        identified or discovered within our biogeographical region represent a shared
        value of society. By recognizing and understanding this collective natural
        heritage, we strengthen our common will to protect it.\",\"language\":\"eng\",\"email\":[\"admin@floranatolica.com\"],\"phone\":[\"+905332834522\"],\"homepage\":[\"https://www.floranatolica.com/\"],\"logoUrl\":\"https://www.floranatolica.com/eukaria/images/masters/floranatolica_header.png\",\"address\":[\"Portakal
