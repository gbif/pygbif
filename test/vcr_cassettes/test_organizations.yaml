        \u0432\u043E \u0412\u0438\u0435\u043D\u0430, \u0410\u0432\u0441\u0442\u0440\u0438\u0458\u0430
        \u0438 \u0434\u0440\u0443\u0433\u0438.\\n\u0412\u043E \u0440\u0430\u043C\u043A\u0438\u0442\u0435
        \u043D\u0430 \u041C\u0438\u043A\u043E\u043B\u043E\u0448\u043A\u0430\u0442\u0430
