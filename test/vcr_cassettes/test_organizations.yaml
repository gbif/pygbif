        Museum\",\"description\":\"The idea to establish the Tatra Museum arose in
        1888 among friends of Tytus Cha\u0142ubi\u0144ski (1820-1889), who wished
        to honor his achievements as a discoverer of the medicinal value of Zakopane,
        an eminent Warsaw physician, scholar, and social activist, and a great lover
        of the Tatra Mountains and highland culture. To realize this idea, the founders
        established the Dr. Tytus Cha\u0142ubi\u0144ski Tatra Museum Society. One
        of the Society's tasks was to seek resources and methods for organizing and
        developing the museum. The oldest collections, consisting of botanical, geological,
        zoological, and ethnographic collections, as well as the beginnings of a library,
        were amassed through donations and the purchase of entire collections from
        private collectors. The first exhibition was housed in a house rented by the
        Society, now defunct, on Krup\xF3wki Street. The 1880s saw the beginnings
        of the first collections of crafts and folk art. Ethnographic specimens were
        collected at that time by Countess R\xF3\u017Ca Raczy\u0144ska, n\xE9e Potocka,
        Maria and Bronis\u0142aw Dembowscy, and Zygmunt Gnatowski. Over time, their
        collections were transferred to the Tatra Museum.\",\"language\":\"eng\",\"email\":[\"mwarchalowski@muzeumtatrzanskie.pl\"],\"phone\":[\"693957099\"],\"homepage\":[\"https://muzeumtatrzanskie.pl/\"],\"logoUrl\":\"https://muzeumtatrzanskie.pl/wp-content/uploads/2022/12/logo-muzeum-tatrzanskie-nowe-2022-kolor-scaled.jpg\",\"address\":[\"Krup\xF3wki
        10\"],\"city\":\"Zakopane\",\"province\":\"Ma\u0142opolska\",\"country\":\"PL\",\"postalCode\":\"34-500\",\"numPublishedDatasets\":0,\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-05T13:28:01.771+00:00\",\"modified\":\"2025-08-05T13:28:01.771+00:00\",\"endorsed\":\"2025-08-05T14:34:52.375+00:00\",\"contacts\":[{\"key\":6199445,\"type\":\"POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Marcin\",\"lastName\":\"Warcha\u0142owski\",\"position\":[],\"email\":[\"mwarchalowski@muzeumtatrzanskie.pl\"],\"phone\":[\"+48693957099\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-05T13:28:01.771+00:00\",\"modified\":\"2025-08-05T13:28:01.771+00:00\"}],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[{\"key\":40021,\"content\":\"\\nIs
        associated with a GBIF-funded project: no\\n\\n\\nExpects to publish:\\n\\n\\n
        - ResourceMetaData\\n - ChecklistData\\n - OccurrenceData\\n - SamplingEventData\\n\\nExpected
        data content:\\n\\n> The Tatra Museum's collections began with natural history
        collections \u2013 351 bird specimens and 54 mammal specimens, purchased from
        forester and preparator Antoni Kocyan, as well as a herbarium of mosses and
        vascular plants and a collection of Tatra rocks \u2013 a gift from Tytus Cha\u0142ubi\u0144ski.
        The moss herbarium was complemented by a valuable collection of Polish and
        foreign works on bryology (the study of mosses), donated to the Museum by
        Cha\u0142ubi\u0144ski's heirs. Since 1888, the number of zoological, botanical,
        and geological specimens has steadily increased, currently numbering approximately
        71,000 items (including: BOTANY: 11,500, ZOOLOGY: 55,600, and GEOLOGY: 4,000).
        These collections have been used for years for research in various fields.
        Among the most valuable is the aforementioned T. Cha\u0142ubi\u0144ski moss
        collection. Of historical value are nine albums, encompassing 900 species
        of vascular plants, donated at the Museum's inception by the Physiographic
        Commission of the Academy of Arts and Sciences in Krak\xF3w. Most of the specimens
        for this collection were collected by zoologist W\u0142adys\u0142aw Kulczy\u0144ski,
        along with others from Boles\u0142aw Kotula and Antoni Rehmann. The lichen
        collection of the eminent lichenologist J\xF3zef Motyka is particularly valuable.
        The Museum's natural history collection also includes herbaria created by
        naturalists closely associated with the institution: Konstanty Stecki, Irena
        Domaniewska, and Zofia Radwa\u0144ska-Paryska, as well as contemporary herbaria
        by botanists Halina and Zbigniew Mirka, Urszula Bielczyk, Anna Ronikier, and
        Adam Flakus.\\n> \\n> The zoological collections come from the Tatra Mountains,
        the Rocky Podhale region, the Orava-Nowy Targ Basin, and the Pieniny Mountains.
        Among the most valuable are Antoni Kocyan's 19th-century ornithological collection,
        Stanis\u0142aw Batkowski's collection of greater butterflies from the Tatra
        Mountains and the Tatra foothills, and J\xF3zef Fudakowski's collection of
        Tatra dragonflies. The collection also includes 7,000 cave bear bones, primarily
        from the Magura Cave in the Tatra Mountains.\\n> \\n> The geological collection
        comprises nearly 2,800 specimens of typical rocks, minerals, and fossils from
        throughout the Tatra Mountains and the Tatra foothills. The Museum's geological
        collections are of significant scientific value and are largely displayed
        in the permanent exhibition. They primarily document the work of eminent geologists
        who have focused on Tatra issues \u2013 both ancient and contemporary \u2013
        including J\xF3zef Morozewicz, W\u0142adys\u0142aw Pawlica, Mieczys\u0142aw
        Limanowski, Zbigniew W\xF3jcik, Jerzy Lefeld, and Andrzej Ga\u017Adzicki.
        A distinctive feature is the beautiful collection of marine fossils, including:
        ammonites, sea urchins, mussels, snails, collected by Edward Passendorfer.\\n\\n\\nWill
        run a server which exposes data: yes\\n\\n\\nPlans to run publishing software
        (e.g. an IPT): no\\n\\n\\nNeeds help for data publishing: no\\n\",\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-05T13:28:01.771+00:00\",\"modified\":\"2025-08-05T13:28:01.771+00:00\"}]},{\"key\":\"c97764ed-19d1-4c0a-85da-87b6a0f01f90\",\"endorsingNodeKey\":\"7f48e0c8-5c96-49ec-b972-30748e339115\",\"endorsementApproved\":true,\"endorsementStatus\":\"ENDORSED\",\"title\":\"Research
        Center for Public Health and Nutrition, Health Research Organization, National
        Research and Innovation Agency Indonesia\",\"description\":\"The Center for
        Public Health and Nutrition Research, a research center under the Indonesian
        National Research and Innovation Agency Indonesia, is dedicated to conducting
        research, development, evaluation, and application, as well as fostering inventions
        and innovations in the field of public health and nutrition. This research
        center undertakes technical tasks encompassing these activities and actively
        engages in collaborative research with national and international institutions,
        universities, and organizations. One of its prominent research groups focuses
        on vector-borne and zoonotic diseases, specializing in the study, development,
        assessment, and application of solutions related to all vector-borne and zoonotic
        diseases in Indonesia. Additionally, the center provides comprehensive information
        on various vector species and disease reservoirs across the country, supporting
        national programs and strategies aimed at controlling and eliminating these
        diseases.\",\"language\":\"eng\",\"email\":[\"prkmg@brin.go.id\"],\"phone\":[\"+62811-1064-6797\"],\"homepage\":[\"https://brin.go.id/ork/pusat-riset-kesehatan-masyarakat-dan-gizi/page/pusat-riset-kesehatan-masyarakat-dan-gizi\"],\"logoUrl\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Main_Logo_of_National_Research_and_Innovation_Agency_of_Indonesia.svg/448px-Main_Logo_of_National_Research_and_Innovation_Agency_of_Indonesia.svg.png\",\"address\":[\"Gedung
