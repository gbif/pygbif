        Civico di Storia Naturale di Ferrara\",\"description\":\"The museum originated
        from small donations as early as the 18th century but was officially opened
        in 1872.Created to provide support for the city university\u2019s Natural
        History, Zoology and Comparative Anatomy departments, for many decades the
        museum remained a teaching venue illustrating the diversity of life forms
        around the world. Beginning in 1982 it devoted itself to the documentation
        of its target territory, which includes the Po river Delta and its ecosystems.
        In 1987 it opened a research facility, not accessible to visitors but used
        by scholars, volunteers, trainees and thesis students, called the \u201CStazione
        di Ecologia del Territorio.\u201D\\nThe Museum does research on the animal
        communities of the Ferrara province and Delta territories; gives advice to
        land management bodies, citizens and scholars; organizes exhibitions, lecture
        series, conferences, training and advanced training courses; has a rich specialized
        library; and carries out intensive educational and outreach activities for
        schools and families. The ever-growing collections include nearly one million
        specimens (geology, paleontology, vertebratology, entomology and other invertebrates).\",\"language\":\"eng\",\"email\":[\"c.corazza@comune.fe.it\"],\"phone\":[],\"homepage\":[\"https://www.museiferrara.it/museo-di-storia-naturale/\"],\"logoUrl\":\"https://storianaturale.comune.ferrara.it/839/pix/redazione/logo_museo_per_mail.jpg\",\"address\":[\"Largo
