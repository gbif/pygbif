        Ark Nature Centre\",\"description\":\"The Ark Nature Centre is a natural science
        museum founded in 2000, located in the center of Pori. In addition to public
        spaces, The Ark Nature Centre preserves natural history collections. Most
        of the natural history collections of The Ark Nature Centre are from Satakunta.
        The collections include taxidermy, pressed plants, beetles, bird nests and
