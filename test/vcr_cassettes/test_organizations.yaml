        is a web application that supports taxonomists in classifying the vast number
        of images produced by quantitative imaging instruments. It combines deep learning
        with an efficient user interface to facilitate the classification of thousands
        of images per day. The platform also stores extensive metadata alongside the
        images, with minimal constraints on content. These metadata can be used by
        operators to filter and organize images, and by the machine learning backend
        to propose identifications. Finally, EcoTaxa enables the export of both metadata
        and identifications, either as a flexible text table or in the Darwin Core
        Archive standard, making them suitable for publication on GBIF and OBIS.\",\"language\":\"eng\",\"email\":[],\"phone\":[],\"homepage\":[\"https://ecotaxa.obs-vlfr.fr/\"],\"logoUrl\":\"https://raw.githubusercontent.com/ecotaxa/ecotaxa_front/refs/heads/master/appli/static/gui/images/logos/logo_ecotaxa_front_b.png\",\"address\":[\"181
