        Costa Rica\",\"description\":\"Panthera is the only organization in the world
        dedicated exclusively to the conservation of the planet's 40 wild cat species
        and the ecosystems in which they live.\\nUsing the expertise of feline biologists
        from around the world, Panthera develops and implements global strategies
        for the most endangered big cat species: tigers, lions, jaguars, snow leopards,
        pumas, and leopards.\\nTo achieve its goals, Panthera often establishes partnerships
        with local and international NGOs, scientific institutions, local communities,
        governments around the world, and citizens who want to help ensure a future
        for wild cats, which is especially essential for resolving human-cat conflicts.\\nIn
        addition, Panthera conducts scientific research that informs decision-making,
        utilizing techniques such as camera traps (for population density studies
        and occupancy models), satellite telemetry, genetic analysis, Geographic Information
        Systems and map analysis, track detection, and more.\\nFinally, Panthera's
        grant program, the Small Cat Action Fund (SCAF), supports conservation and
        research initiatives related to several of the 31 species of small cats that
        inhabit the planet.\\nPanthera has been working in Costa Rica since 2008,
        focusing primarily on consolidating the Jaguar Corridor Initiative (JCI).
        To this end, it works in the most vulnerable sites throughout the region,
        developing pilot projects, which it hopes to implement in other jaguar corridors
        throughout Mesoamerica.\\nThe Jaguar Corridor Initiative (JCI) proposes connectivity
        routes throughout the distribution of this species in the Americas. Without
        a doubt, this is one of the most comprehensive and bold conservation strategies
        in the world to ensure the preservation of this carnivore. Currently, work
        is being done with this goal in mind in 13 of the 18 countries on the continent
        where the jaguar still lives, and agreements have been reached with the governments
        of five of these countries (including Costa Rica) as a further effort to continue
        developing this project.\\nPanthera es la \xFAnica organizaci\xF3n del mundo
        que se dedica exclusivamente a la conservaci\xF3n de las 40 especies de felinos
        silvestres que existen en el planeta, y los ecosistemas en que viven.\\nUtilizando
        la experiencia de bi\xF3logos de todo el mundo, expertos en felinos, Panthera
        desarrolla e implementa estrategias globales para las especies de grandes
        felinos m\xE1s amenazadas: tigres, leones, jaguares, leopardos de las nieves,
        pumas y leopardos.\\nPara lograr sus objetivos Panthera suele establecer alianzas
        con ONGs locales e internacionales, instituciones cient\xEDficas, comunidades
        locales, gobiernos de todo el mundo y ciudadanos que quieren ayudar a asegurar
        un futuro para los gatos salvajes, esto es fundamental sobretodo para la resoluci\xF3n
        de conflictos humanos-felinos.\\nAdem\xE1s se desarrollan investigaciones
        cient\xEDficas que sirven de fundamento para la toma de decisiones y para
        ello se utilizan t\xE9cnicas como el uso de c\xE1maras-trampa (para estudios
        de densidad poblacional y modelos de ocupaci\xF3n), telemetr\xEDa satelital,
        an\xE1lisis gen\xE9ticos, Sistemas de Informaci\xF3n Geogr\xE1fica y an\xE1lisis
        de mapas, detecci\xF3n de huellas, etc.\\nFinalmente, el programa de becas
        de Panthera, el Small Cat Action Fund (SCAF), apoya iniciativas de conservaci\xF3n
        e investigaci\xF3n relacionadas con varias de las 31 especies de peque\xF1os
        felinos que habitan el planeta.\\nPanthera trabaja en Costa Rica desde el
        a\xF1o 2008, enfoc\xE1ndose principalmente en consolidar la Iniciativa del
        Corredor del Jaguar (ICJ). Para esto, se trabaja en los sitios de mayor vulnerabilidad
        a nivel de toda la regi\xF3n, desarrollando proyectos piloto, los cuales se
        pretenden implementar en los dem\xE1s corredores del jaguar a lo largo de
        toda Mesoam\xE9rica.\\nLa Iniciativa del Corredor del Jaguar (ICJ), propone
        rutas de conectividad a lo largo de la distribuci\xF3n de esta especie en
        el continente americano. Sin duda alguna, esta es una de las estrategias de
        conservaci\xF3n m\xE1s comprensivas y audaces que existen en el mundo, para
        asegurar la preservaci\xF3n de un carn\xEDvoro. Actualmente se trabaja con
        este objetivo en mente, en 13 de los 18 pa\xEDses del continente donde a\xFAn
        vive el jaguar y se han logrado convenios con los gobiernos de 5 de estos
        pa\xEDses (incluyendo Costa Rica), como un esfuerzo m\xE1s para continuar
        desarrollando este proyecto.\",\"language\":\"eng\",\"email\":[\"info@pantheracostarica.org\"],\"phone\":[],\"homepage\":[\"https://pantheracostarica.org/\"],\"logoUrl\":\"https://api.gbif.org/v1/image/unsafe/https%3A%2F%2Fraw.githubusercontent.com%2FSIB-Colombia%2Flogos%2Fmain%2Fsocio-SiB-panthera.png\",\"address\":[\"Edificio
