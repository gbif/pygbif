        RDC\",\"description\":\"ADE-CLIMATERRA RDC (Action pour le D\xE9veloppement
        Endog\xE8ne et le Climat en Territoires Ruraux) est une organisation congolaise
        \xE0 but non lucratif engag\xE9e dans la r\xE9silience climatique, la reforestation
        communautaire, l\u2019agroforesterie durable et la valorisation des savoirs
        autochtones. Active dans plusieurs provinces de la R\xE9publique D\xE9mocratique
        du Congo (Ituri, Sud-Kivu, Tshopo, Kinshasa), elle coordonne des projets int\xE9gr\xE9s
        visant \xE0 restaurer les \xE9cosyst\xE8mes, renforcer les capacit\xE9s locales
        et promouvoir une gouvernance environnementale inclusive.\\n\\n\\uD83D\\uDD0D
        Domaines d\u2019expertise :\\n\\nReforestation participative et agroforesterie
        \xE0 haute valeur \xE9cologique\\n\\nCollecte et structuration de donn\xE9es
        sur la biodiversit\xE9 locale\\n\\nMobilisation communautaire et renforcement
        des capacit\xE9s des jeunes et des femmes\\n\\nInt\xE9gration des savoirs
        traditionnels dans les strat\xE9gies de conservation\\n\\nSuivi-\xE9valuation
        et reporting conforme aux standards internationaux (UE, BMZ)\\n\\n\\uD83C\\uDF0D
        Alignement strat\xE9gique : ADE-CLIMATERRA RDC contribue \xE0 la documentation
        et \xE0 la diffusion des donn\xE9es sur la biodiversit\xE9 en RDC, en coh\xE9rence
        avec les objectifs du GBIF. L\u2019organisation d\xE9veloppe des initiatives
        de collecte de donn\xE9es sur les esp\xE8ces v\xE9g\xE9tales et les pratiques
        agro\xE9cologiques locales, en vue de leur int\xE9gration dans des plateformes
        ouvertes et interop\xE9rables. Elle participe \xE9galement \xE0 des forums
        internationaux (Paris Peace Forum, SCUP) pour renforcer la visibilit\xE9 des
        solutions locales et favoriser les partenariats scientifiques et financiers.\\n\\n\\uD83D\\uDCCA
        Capacit\xE9s techniques : L\u2019\xE9quipe dispose d\u2019une expertise en
        structuration de donn\xE9es, justification budg\xE9taire, r\xE9daction de
        notes conceptuelles bilingues (FR/EN), et conformit\xE9 aux crit\xE8res des
        bailleurs internationaux. ADE-CLIMATERRA RDC est \xE9galement en cours d\u2019\xE9largissement
        de sa mission pour inclure la finance climatique, le leadership des jeunes,
        et le plaidoyer pour la biodiversit\xE9.\",\"language\":\"eng\",\"email\":[\"direction@aadeasbl.org\"],\"phone\":[\"0970823336\"],\"homepage\":[],\"address\":[\"48
