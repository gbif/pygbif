        Collaborative\",\"description\":\"FishEye Collaborative is an emerging conservation
        technology non-profit specializing in marine conservation bioacoustics. In
        collaboration with other organizations, we do research and development on
        non-invasive listening technologies that can help evaluate and protect ocean
        habitats. Our mission is to equip decision-makers with the actionable data
        needed to manage marine protected areas and nearshore habitats effectively.
        By developing 360\xB0 video and audio visualizations, building species-specific
        fish-sound libraries, and training AI systems, we provide critical insights
        into underwater soundscapes, helping to protect biodiversity hotspots and
        fisheries essential to millions worldwide. This curated collection of species-specific
        recordings provides essential data for understanding underwater ecosystems.\",\"language\":\"eng\",\"email\":[\"mdantzker@fisheyecollaborative.org\"],\"phone\":[\"6075922418\"],\"homepage\":[\"https://www.fisheyecollaborative.org/\"],\"address\":[\"4313
        35th St N\"],\"city\":\"Arlington\",\"province\":\"Virginia\",\"country\":\"US\",\"postalCode\":\"22207\",\"latitude\":38.88643,\"longitude\":-77.16531,\"numPublishedDatasets\":1,\"createdBy\":\"gbif.express\",\"modifiedBy\":\"andrea\",\"created\":\"2025-08-13T15:46:37.288+00:00\",\"modified\":\"2025-09-15T10:33:44.716+00:00\",\"endorsed\":\"2025-09-01T16:22:25.729+00:00\",\"contacts\":[{\"key\":6206723,\"type\":\"ADMINISTRATIVE_POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Erika\",\"lastName\":\"Berlik\",\"position\":[],\"email\":[\"eberlik@fisheyecollaborative.org\"],\"phone\":[\"\u202D+1
        (571) 327-6208\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-13T15:46:37.288+00:00\",\"modified\":\"2025-08-13T15:46:37.288+00:00\"},{\"key\":6206724,\"type\":\"POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Marc\",\"lastName\":\"Dantzker\",\"position\":[],\"email\":[\"mdantzker@fisheyecollaborative.org\"],\"phone\":[\"\u202D+1
        (607) 592-2418\u202C\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-13T15:46:37.288+00:00\",\"modified\":\"2025-08-13T15:46:37.288+00:00\"}],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[{\"key\":40081,\"content\":\"\\nIs
        associated with a GBIF-funded project: no\\n\\n\\nExpects to publish:\\n\\n\\n
        - SamplingEventData\\n - OccurrenceData\\n\\nExpected data content:\\n\\n>
        Our specimens make up our species-specific fish sound library. Each specimen
        contains video (reframed, though originally recorded in 360), the corresponding
        audio (recorded with a tetrahedral array), and visualizations of the sound,
        including a spectrogram and a \\\"powermap\\\" created using spatial audio
        to localize the sound and determine the source. These audio-video specimens
        are each associated with an entry in a Specify database including information
        including the location, time, depth, and temperature where the data were collected.\\n\\n\\nWill
        run a server which exposes data: yes\\n\\n\\nPlans to run publishing software
        (e.g. an IPT): no\\n\\n\\nNeeds help for data publishing: no\\n\",\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-13T15:46:37.288+00:00\",\"modified\":\"2025-08-13T15:46:37.288+00:00\"}]},{\"key\":\"2ceb9d02-6831-40e3-9d34-cc4e6db61d42\",\"endorsingNodeKey\":\"8618c64a-93e0-4300-b546-7249e5148ed2\",\"endorsementApproved\":true,\"endorsementStatus\":\"ENDORSED\",\"title\":\"Edwards
        Aquifer Research and Data Center\",\"description\":\"The Edwards Aquifer Research
        and Data Center (EARDC) has been a leader in groundwater research and education
        since 1979, and we are the only academic center in North America devoted to
        the scientific exploration of groundwater ecology. Our Aquifer Biodiversity
        Collection is the largest repository for groundwater organisms (predominantly
        invertebrates) from Texas groundwater habitats, with a smaller number of lots
        from Mexico and other US states.\",\"language\":\"eng\",\"email\":[\"bh1333@txstate.edu\"],\"phone\":[\"5122453541\"],\"homepage\":[\"https://www.eardc.txst.edu/\"],\"address\":[\"601
        University Dr.\"],\"city\":\"San Marcos\",\"province\":\"tx\",\"country\":\"US\",\"postalCode\":\"78666\",\"latitude\":29.88966,\"longitude\":-97.93578,\"numPublishedDatasets\":1,\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-07T18:42:22.357+00:00\",\"modified\":\"2025-08-07T18:42:22.357+00:00\",\"endorsed\":\"2025-08-15T18:09:49.517+00:00\",\"contacts\":[{\"key\":6201479,\"type\":\"ADMINISTRATIVE_POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Benjamin\",\"lastName\":\"Schwartz\",\"position\":[],\"email\":[\"bs37@txstate.edu\"],\"phone\":[\"001-512-245-7608\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-07T18:42:22.357+00:00\",\"modified\":\"2025-08-07T18:42:22.357+00:00\"},{\"key\":6201480,\"type\":\"POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Ben\",\"lastName\":\"Hutchins\",\"position\":[],\"email\":[\"bh1333@txstate.edu\"],\"phone\":[\"001-512-245-3541\"],\"homepage\":[],\"address\":[],\"createdBy\":\"gbif.express\",\"modifiedBy\":\"gbif.express\",\"created\":\"2025-08-07T18:42:22.357+00:00\",\"modified\":\"2025-08-07T18:42:22.357+00:00\"}],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[{\"key\":40058,\"content\":\"\\nIs
        associated with a GBIF-funded project: no\\n\\n\\nExpects to publish:\\n\\n\\n
        - OccurrenceData\\n\\nExpected data content:\\n\\n> Our collection currently
        includes 9500+ digitized lots, representing primarily EtOH-preserved invertebrates
        from Texas groundwater (with additional samples from Mexico and elsewhere
        in the United States). Digitized data are currently stored in MS Excel using
        DarwinCore standards. Data include standard fields including Locality, taxonomic,
