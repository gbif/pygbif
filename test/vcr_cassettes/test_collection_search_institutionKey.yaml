        - Museum national d'Histoire naturelle\",\"institutionCode\":\"MNHN\"},{\"key\":\"492ed1b4-4583-41e6-b791-5caf3bed85b9\",\"code\":\"EY\",\"name\":\"The
        Hymenoptera collection (EY) of the Mus\xE9um national d'Histoire naturelle
        (MNHN - Paris)\",\"description\":\"This dataset is the databased part of the
        Hymenoptera from the entomological collections of the Mus\xE9um National d&#39;Histoire
        Naturelle (Paris).\\n\\t\\t\\t\\t\\n\\t\\t\\t\\tThe Hymenoptera collection
        holds about 1 million specimens, out of which 6000 are types (the oldest being
        from Fabricius and Latreille) ; 95 % are stored pinned, the other being either
        in alcool (mostly Formicidae), or in microscopical preparations. The collection
        consists of 9 sections: Apoidea apiformes (21 % of the specimens), Apoidea
        spheciformes (8 %), Vespoidea (22 %), Formicidae (10 %), Chrysidoidea (2 %),
        Ichneumonoidea (20 %), Chalcidoidea (6 %), others Parasitica (4 %) and Symphytes
        (7 %). The collection also includes 30 authors\u2019 collections (notably
        those of Benoist, Berthoumieu, Bosc, Brull\xE9, Dufour, Boyer de Fonscolombe,
        Ferton, de Gaulle, Giraud, Girault, Granger, Lepeletier, Lucas, P\xE9rez,
        Pic, Saussure, Seyrig, Sichel, Vachal\u2026). The main represented geographical
        area are the Palearctic and Afrotropic zones (especially Madagascar with Seyrig\u2019s
