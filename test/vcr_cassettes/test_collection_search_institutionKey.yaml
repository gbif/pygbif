        Diptera collection (ED) of the Mus\xE9um national d'Histoire naturelle (MNHN
        - Paris)\",\"description\":\"This dataset is the databased part of the Diptera
        from the entomological collections of the Mus\xE9um National d&#39;Histoire
        Naturelle (Paris).\\n\\t\\t\\t\\t\\n\\t\\t\\t\\tThe Diptera collection of
        MNHN is divided into a general collection, classified into families, and separate
        nominal collections. The heart of the collection is composed of two historical
        nominal collections: Meigen and Macquart, both dating from the nineteenth
        century;  they contain about 5,000 holotypes. In total the collection contains
