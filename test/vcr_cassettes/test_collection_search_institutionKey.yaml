      string: "{\"offset\":0,\"limit\":10,\"endOfRecords\":false,\"count\":27,\"results\":[{\"key\":\"745ce2d0-a64b-4089-aae6-3712a39caa2a\",\"code\":\"RS\",\"name\":\"The
        Scorpiones collection (RS) of the Mus\xE9um national d'Histoire naturelle
        (MNHN - Paris)\",\"description\":\"This dataset is the databased part of the
        Scorpiones from the terrestrial arthropods collections of the Mus\xE9um National
        d&#39;Histoire Naturelle (Paris).\\n \\n\\t\\t\\t\\tThe MNHN scorpion collection
        is one of the most important in the world, due to a long tradition of work
        on this group at the museum. The collection began to be formed towards the
        middle of the 19th century and still contains types of some species described
        from this period by authors like Audouin, Savigny, Gervais and Gu\xE9rin-M\xE9n\xE9ville.
        The collection was considerably augmented during the period 1880\u20121910
        by E. Simon, who described numerous species either collected by himself or
        received through his extensive network of correspondents. During the 20th
        century scorpions were studied at the museum by Fage and by his successor,
        M. Vachon. Since the 1970s, systematic activity on the collection has continued
        intensively through the work of W. Louren\xE7o, who was a student of Vachon.
        As a result, the collection is both large and rich, containing an unusually
        high proportion of type material. In addition to material studied by authors
        working at the museum, a significant part has come from outside sources, either
        through gift or exchange. Thus it also contains material studied by authorities
        such as R.I. Pocock, T. Thorell, K. Kraepelin, W.D. Sissom and V. Fet. The
        scorpion collection is worldwide in scope, but the best represented regions
        are tropical South America, North Africa, the Middle East, Western Africa,
        Madagascar and Southeast Asia. It contains over 9000 lots, including about
        700 types, preserved in 80 % alcohol and stored in the museum\u2019s Zooth\xE8que.
        The collections are made available to external researchers, either through
        loans or visits, at the discretion of the curator. In cases where neither
        is feasible, photographic documentation of specimens may be provided on request.\",\"contentTypes\":[],\"active\":true,\"personalCollection\":false,\"email\":[],\"phone\":[],\"catalogUrls\":[],\"apiUrls\":[],\"preservationTypes\":[],\"institutionKey\":\"6a6ac6c5-1b8a-48db-91a2-f8661274ff80\",\"mailingAddress\":{\"key\":43397},\"address\":{\"key\":43396,\"address\":\"Mus\xE9um
