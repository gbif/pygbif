        (MNHN - Paris)\",\"description\":\"This dataset is the databased part of the
        Apterygota part of the entomological collections of the Mus\xE9um National
        d&#39;Histoire Naturelle (Paris).\\n\\t\\t\\t\\t\\n\\t\\t\\t\\tThe Apterygota
        (primarily wingless Hexapoda) collection includes the Collembola, Protura,
        Diplura, Zygentoma and Archeognatha (&#61;Microcoryphia) collections. The
        two later groups were formerly known as the Thysanura. Several hundred thousand
        specimens are stored in the collections with over 50 000 microscopical slides
        and specimens in alcohol jars. There are about a thousand type specimens.
        The Apterygota collectionhas been built on merging several legacy and working
        collections from Denis, Delamare-Deboutteville, Thibaud, Betsch, Massoud,
        Najt, Deharveng, Cassagnau and D&#39;Haese among others. It includes specimens
        from all over the planet, including Antarctica. The Collembola collection
