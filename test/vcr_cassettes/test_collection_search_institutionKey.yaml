        the Hemiptera collection is organized in 4 large units: Sternorrhyncha, Fulgoromorpha,
        Cicadomorpha and Heteroptera. The general collection is completed by nominal
        collections (Bagnall, Bergevin, Cohic, Dlabola, Mamet, Goux, Noualhier, Puton,
        Ribaut, Sorin\u2026). This set, gathering over 7 million specimens and including
        7.000 holotypes, is one of the asset of the Mus\xE9um entomological collection.
        From 30 to 70% of the 100.000 species described can be found in the collection,
