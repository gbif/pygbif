        - Museum national d'Histoire naturelle\",\"institutionCode\":\"MNHN\"},{\"key\":\"d13fc182-11a9-4a6c-92fd-3da6eb43f5d9\",\"code\":\"ZA\",\"name\":\"The
        reptiles, amphibians and fishes collection (ZA) in the Comparative Anatomy
        Collection of the Mus\xE9um national d'Histoire naturelle (MNHN - Paris)\",\"description\":\"The
        collection of mammals of the Mus\xE9um national d\u2019Histoire naturelle
        (MNHN) started during the XVIIIth century. The collection consists of skeletons
        (mounted or not), skins (mounted or not), casts, specimens or organs in fluid
        (alcohol or formalin), and tissues, belonging to different classes and orders.\\nThe
        database ZAC (acronym for \u201CZoology, Comparative anatomy\u201D) exists
        since 2010. It is the result of the merger of MAMMALIA (former collection
        of \u201CZoologie, Mammif\xE8res et Oiseaux\u201D) and ANATOMIC (former collection
        of \u201CAnatomie compar\xE9e\u201D). For many groups, computerization is
        at a preliminary stage, and most entries have not yet been proofed for errors
        or verified against the collections. Acronym ZM is used for Mammals, ZO for
        birds and ZA is used for the other classes present in the collection: Reptiles,
        Amphibians and Fishes.\\nMore detailed information can be obtained by writing
        to the curators and collection managers.\\nThe database will help you prepare
        loan requests or visits to the collection. For any request contact: http://colhelper.mnhn.fr/\",\"contentTypes\":[],\"active\":true,\"personalCollection\":false,\"email\":[],\"phone\":[],\"catalogUrls\":[],\"apiUrls\":[],\"preservationTypes\":[],\"institutionKey\":\"6a6ac6c5-1b8a-48db-91a2-f8661274ff80\",\"mailingAddress\":{\"key\":43399},\"address\":{\"key\":43394,\"address\":\"Mus\xE9um
