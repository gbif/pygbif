        - Museum national d'Histoire naturelle\",\"institutionCode\":\"MNHN\"},{\"key\":\"c03f64bb-aa46-44dc-990e-1716b6175be8\",\"code\":\"AR\",\"name\":\"The
        Araneae collection (AR) of the Mus\xE9um national d'Histoire naturelle (MNHN
        - Paris)\",\"description\":\"This dataset is the databased part of the Araneae
        from the terrestrial arthopods collections of the Mus\xE9um national d&#39;Histoire
        naturelle (Paris).\\n\\t\\t\\t\\t\\n\\t\\t\\t\\tThe spider collection of the
        Museum is amongst the most important in the world (along with those of London
        and New York). The specimens come from around the world. They are mainly preserved
        in 75% alcohol in glass jars with some preparations on microscope slides.
        All specimens whether or not the types are located in two places: a large
        general reserve of the Museum, the zooth\xC3\xA8que, and a smaller reserve
        in a research building. About 26,000 species of spiders, some 12,000 types
        (mixed in the entire collection) are represented in the Museum. This represents
        a number of individuals estimated to be approximately 2 million. Started in
        the 1860s by Eug\xC3\xA8ne SIMON, the collection has grown significantly over
        the years with substantial collections in number of specimens (including a
        large part of the material remaining to be studied and identified) from other
        arachnologists or naturalists, among them Bonnet, Denis, Dresco Legendre or
        Strand ... This collection has a predominantly scientific vocation. It grows
        with some specimens to several hundred per year with donations mainly from
        current collections. The main domains of research activity related to this
        collection are systematic, with two major axes, taxonomy and biosystematics,
        but also applications in the management of biodiversity and the environment
        as well as expertise. The loan service of the collection is of great importance
        each year along with hosting of visitors and sending material. Databasing
        began in the 2000s. Are currently integrated into the general database of
        the Museum some 3,000 lots spiders. The sources of information related to
        this collection are also based on manual files easily available to visitors
        and on a library with historical reference books as well as most recent reprints.\",\"contentTypes\":[],\"active\":true,\"personalCollection\":false,\"email\":[],\"phone\":[],\"catalogUrls\":[],\"apiUrls\":[],\"preservationTypes\":[],\"institutionKey\":\"6a6ac6c5-1b8a-48db-91a2-f8661274ff80\",\"mailingAddress\":{\"key\":43400},\"address\":{\"key\":43393,\"address\":\"Mus\xE9um
