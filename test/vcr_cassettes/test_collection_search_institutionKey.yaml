        curator\"],\"phone\":[],\"fax\":[],\"email\":[],\"address\":[\"CP 53, 61 rue
        Buffon\"],\"city\":\"Paris\",\"country\":\"FR\",\"postalCode\":\"75231\",\"primary\":false,\"taxonomicExpertise\":[],\"userIds\":[],\"createdBy\":\"s.pamerlon\",\"modifiedBy\":\"s.pamerlon\",\"created\":\"2024-04-30T14:12:49.736+00:00\",\"modified\":\"2024-04-30T14:12:49.736+00:00\"},{\"key\":38144,\"firstName\":\"Jean-Jacques\",\"lastName\":\"Geoffroy\",\"position\":[\"Curator\"],\"phone\":[],\"fax\":[],\"email\":[\"geoffroy@mnhn.fr\"],\"address\":[\"4
        avenue du Petit-Ch\xE2teau\"],\"city\":\"Brunoy\",\"postalCode\":\"F-91800\",\"primary\":true,\"taxonomicExpertise\":[],\"userIds\":[],\"createdBy\":\"s.pamerlon\",\"modifiedBy\":\"s.pamerlon\",\"created\":\"2024-04-30T14:12:49.736+00:00\",\"modified\":\"2024-04-30T14:12:49.736+00:00\"}],\"machineTags\":[],\"taxonomicCoverage\":\"As
        depicted in Figure 1 and Figure 2, the dataset reflects the scientific activities
        of the researchers doing the digitization. Consequently, even though the collection
        taxonomically covers the whole myriapods and onychophorans, the dataset actually
        contains a majority of millipedes, and the totality of the onychophorans.
        As a result of this work in the last decades, these two collections are also
        more scattered than the others, with less specimens per batch, as depicted
        in Figure 3. The taxonomy used in this dataset reflects the one used in the
        collection. Similarly to most of the big historical collections it is in many
        ways outdated, and would be nearly impossible to update (Sober\xF3n & al.
        2002, Gaston & al. 1992, Alroy 2002). Cross-checking it with taxonomical datasets
        such as the dataset NCBI taxonomy is then an important step while using it
        (ECAT development publisher).\\nThe Onychophorans collection contains 48 species
        plus 7 subspecies within 15 genera of the two actual families: Animalia, animalArthropoda,
        arthropodOnychophora, velvet wormChilopoda, centipedeDiplopoda, millipedePauropodaSymphylaUdeonychophoraEuonychophoraGeophilomorphaLithobiomorphaScolopendromorphaScutigeromorphaCallipodidaChordeumatidaGlomeridaGlomeridesmidaJulidaPlatydesmidaPolydesmidaPolyxenidaPolyzoniidaSiphonophoridaSphaerotheriidaSpirobolidaSpirostreptidaStemmiulidaTetramerocerata\",\"geographicCoverage\":\"To
        date, no batches from this dataset have been georeferenced. Contemporary administrative
        countries, corresponding to where the specimens have been sampled, have however
        been included when possible. Although imperfect for biodiversity studies,
        an image of the collection events repartition using the ISO 3166 (ISO 2014),
        can be given. The two main parts of the collection have a different spatial
        repartition, due in part to the distribution of the taxa represented, but
        also to a different history.\\nThe myriapod dataset is a collection for \u201Cmetropolitan
        France and the world\u201D. Indeed, ca. 56.80% of the batches were collected
        in metropolitan France, but these batches represent ca. 72.64% of the total
        number of specimens in the collection. This can be explained by the fact that
        the number of specimens per batch collected in metropolitan France is significantly
        higher than the average number of specimens per batch for the rest of the
        world, including the French overseas territories. Even though the metropolitan
        French collection has been extensively studied (and consequently its batches
        have been split numerous times), they are still, on average, larger than the
        batches coming from the rest of the world. The distribution worldwide, as
        depicted in Figure 4 is not homogeneous. Both characteristics of the dataset,
        as well as the taxonomic coverage (see above) are the main focus of J.-M.
        Demange and J.-P. Mauri\xE8s\u2019 research work. The studies of H.W. Brolemann
        over the fauna from Algeria, Brazil and the USA are clearly visible on Figure
        5 (Brolemann 1896b, 1897, 1909, 1931, MyriaLit).\\nAlthough it is highly probable
        that the amount of specimens from metropolitan France is over-represented
        in the dataset, compared to the whole physical collection, it is still the
        first geographical area of origin for the specimens of MNHN-MY. The same phenomenon
        is observed when interpreting the average number of specimen per batch, as
        depicted on Figure 6. With the exception of a few countries, the average number
        of specimen per batch is relatively low (average of 4.049 specimens per batch
        for the non-French specimens). Also, in the distribution of the type batches,
        France tends to be still over-represented in the dataset, though less drastically
        (see Figure 7). We suspect this is due to the fact that even though France
        is not a \u201Chot spot\u201D for myriapod biodiversity, it has been and still
        is an intensively studied area.\\nIn contrast with the myriapods, the onychophorans
        specimens come from different locations outside France, reflecting the ecology
        and distribution of the group. One could be surprised to notice in Figure
        8 the importance of South Africa as geographical origin of the specimens in
        the collection. These specimens mainly come from institutional exchanges,
        driven by L.E. Bouvier between the MNHN and other institutes, such as the
        British Museum. The Figure 9 reflects the extensive and general work of description
        L.E. Bouvier made over these few specimens.\",\"incorporatedCollections\":[\"Myriapoda
