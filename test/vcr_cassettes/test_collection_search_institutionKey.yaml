lse,\"taxonomicExpertise\":[],\"userIds\":[],\"createdBy\":\"s.pamerlon\",\"modifiedBy\":\"s.pamerlon\",\"created\":\"2024-04-30T14:12:49.736+00:00\",\"modified\":\"2024-04-30T14:12:49.736+00:00\"},{\"key\":38134,\"firstName\":\"Pierre\",\"lastName\":\"Lozouet\",\"position\":[\"Correspondant\"],\"phone\":[],\"fax\":[],\"email\":[],\"address\":[],\"primary\":true,\"taxonomicExpertise\":[],\"userIds\":[],\"createdBy\":\"s.pamerlon\",\"modifiedBy\":\"s.pamerlon\",\"created\":\"2024-04-30T14:12:49.736+00:00\",\"modified\":\"2024-04-30T14:12:49.736+00:00\"}],\"machineTags\":[],\"taxonomicCoverage\":\"\",\"geographicCoverage\":\"\",\"incorporatedCollections\":[],\"alternativeCodes\":[],\"comments\":[],\"occurrenceMappings\":[{\"key\":46,\"datasetKey\":\"4b6f0569-9925-4a42-84a0-7d4ff5d13593\",\"createdBy\":\"mgrosjean\",\"created\":\"2022-03-25T12:36:15.530+00:00\"}],\"masterSource\":\"GBIF_REGISTRY\",\"masterSourceMetadata\":{\"key\":8582,\"source\":\"DATASET\",\"sourceId\":\"4b6f0569-9925-4a42-84a0-7d4ff5d13593\",\"createdBy\":\"mgrosjean\",\"created\":\"2022-03-25T12:36:15.138+00:00\"},\"displayOnNHCPortal\":true,\"occurrenceCount\":9155,\"typeSpecimenCount\":951,\"institutionName\":\"MNHN
        - Museum national d'Histoire naturelle\",\"institutionCode\":\"MNHN\"},{\"key\":\"2e6c6f00-d50d-4bc8-8455-2aff335bb3ef\",\"code\":\"MY\",\"name\":\"The
        Myriapoda & Onychophora collection (MY) of the Mus\xE9um national d'Histoire
        naturelle (MNHN - Paris)\",\"description\":\"Established in the second half
        of the 19th century, the MNHN\u2019s collections of myriapods and onychophorans
        are still stored as one collection, mostly for historical and practical reasons.\\n\\nThe
        myriapods section is a major collection for myriapodology worldwide, all the
        groups it includes, and its history. The material comes from all around the
        world and belongs to the classes Pauropoda (2 extant orders), Symphyla, Chilopoda
        (5 extant orders) and Diplopoda (16 extant orders), collected from most of
        the terrestrial ecosystems. About 5000 species of myriapods are represented
        in the collections, including a high number of historical samples. The myriapods
        collection comprises 300 000 to 400 000 specimens. Nearly half of it constitutes
        the reference collection, the other half, which includes a potentially important
        amount of taxa yet unknown to science, is awaiting further studies. The reference
        collection gathers about 25 000 to 30 000 batches, each containing from 1
        to more than 300 specimens, stored into 4639 jars. The reference collection
        includes about 3 000 to 3 500 batches containing altogether 15 000 to 20 000
        type specimens.\\nTo date, the MNHN-MY dataset has gathered 9 795 batches
        of myriapods, consisting of 63 617 specimens, which represents 33% to 40%
        of the reference collection.\\n\\nThe Onychophorans collection, contains invaluable
        historical material, such as type specimens of species described by Bouvier
        in the 1900s. The MNHN\u2019s collection of Onychophorans (commonly known
        as velvet worms) is one of the world\u2019s most important for this group.
        Although only a small phylum, it is of key importance in several aspects within
        the Metazoa, particularly regarding phylogenetic relationships between arthropods
        and other invertebrates (Oliveira &amp; al. 2012). The collection boasts almost
        a hundred species, represented by 202 batches containing 279 specimens and
        43 dissections. This collection is stored into 67 jars. It includes 56 batches
        containing altogether 73 nomenclatural types (plus 2 dissections of types).\\nThis
        part of the collection is fully databased and included in the MNHN-MY dataset,
        and has been since used for studies on the group (Oliveira &amp; al. 2012).\",\"contentTypes\":[],\"active\":true,\"personalCollection\":false,\"email\":[],\"phone\":[],\"catalogUrls\":[],\"apiUrls\":[],\"preservationTypes\":[\"SampleFluidPreserved\"],\"institutionKey\":\"6a6ac6c5-1b8a-48db-91a2-f8661274ff80\",\"mailingAddress\":{\"key\":43402},\"address\":{\"key\":43391,\"address\":\"Mus\xE9um
