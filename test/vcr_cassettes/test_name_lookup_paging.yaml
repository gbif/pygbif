    body:
      string: "{\"offset\":0,\"limit\":1,\"endOfRecords\":false,\"count\":3699,\"results\":[{\"key\":100559474,\"datasetKey\":\"16c3f9cb-4b19-4553-ac8e-ebb90003aa02\",\"scientificName\":\"Mammaliaformes\",\"canonicalName\":\"Mammaliaformes\",\"nameType\":\"SCIENTIFIC\",\"taxonomicStatus\":\"ACCEPTED\",\"origin\":\"SOURCE\",\"numDescendants\":0,\"numOccurrences\":0,\"taxonID\":\"2547897\",\"extinct\":true,\"habitats\":[],\"nomenclaturalStatus\":[],\"threatStatuses\":[],\"descriptions\":[{\"description\":\"Die
        Morganucodonta sind eine Gruppe ausgestorbener S\xE4ugetiervorfahren (Mammaliaformes),
        die in der Obertrias und im unteren Jura lebte.\"},{\"description\":\"Morganucodonta
        waren kleine (rund 10 bis 12 Zentimeter lange), \xE4u\xDFerlich vermutlich
        spitzmaus\xE4hnliche Tiere. Im Bau ihres Kiefergelenks zeigen sie \xDCbergangsmerkmale
        zwischen den synapsiden Vorfahren der S\xE4ugetiere und den eigentlichen S\xE4ugern,
        so ist noch das prim\xE4re Kiefergelenk zwischen Os articulare und Os quadratum
        erkennbar. Wie heutige S\xE4ugetiere hatten sie aber schon vier unterschiedliche
        Zahntypen: Schneidez\xE4hne, Eckz\xE4hne, Pr\xE4molaren und Molaren. Die meist
        drei Molaren jeder Kieferh\xE4lfte wiesen jeweils drei scharfe H\xF6cker auf,
        die Okklusion (der Kontakt der Z\xE4hne des Ober- und Unterkiefers) war gut
        ausgepr\xE4gt. Der Bau der Z\xE4hne l\xE4sst auf Insekten oder andere Kleintiere
        als Nahrung schlie\xDFen. Wie bei den heutigen S\xE4ugetieren und im Gegensatz
        zu \xE4lteren Formen wie Sinoconodon kam es zu einem einmaligen Zahnwechsel,
        wobei die Molaren erst beim bleibenden Gebiss erscheinen. Da dieser Zahnwechsel
        entwicklungsgeschichtlich mit dem S\xE4ugen in Verbindung gebracht wird, ist
        es denkbar, dass diese Tiere ihre Jungen s\xE4ugten. Da jedoch von einer schrittweisen
        Evolution der Zitzen und des damit einhergehenden Saugverhaltens der Jungtiere
        \xFCber einen Zustand, wie wir ihn bei den Kloakentieren (Monotremata) finden,
        ausgegangen wird, bei dem zun\xE4chst nur Dr\xFCsenfelder ausgebildet sind,
        die von den aus dem Ei geschl\xFCpften Jungtieren beleckt werden, ist im Falle
        des geschilderten Zahnwechsels der Morganucodonta auch die M\xF6glichkeit
        zu ber\xFCcksichtigen, dass der einmalige Zahnwechsel mit Molaren im bleibenden
        Gebiss evolutionsgeschichtlich auch in v\xF6llig anderem Zusammenhang stehen
        k\xF6nnte. Auch der \xFCbrige K\xF6rperbau stimmt weitgehend mit dem der S\xE4ugetiere
        \xFCberein, wenngleich sie im Bau der Halswirbel, des Schulterg\xFCrtels und
        des Beckens noch einige \xDCbergangsmerkmale aufweisen. Es d\xFCrfte sich
        bei ihnen um flinke, bodenbewohnende Tiere gehandelt haben.\"},{\"description\":\"Funde
        der Morganucodonta sind von der Obertrias bis in den unteren Jura (rund 210
        bis 175 Millionen Jahre) bekannt. Fossilien wurden in Europa, Asien, dem s\xFCdlichen
        Afrika und Nordamerika gefunden, was auf eine nahezu weltweite Verbreitung
        dieser Tiergruppe schlie\xDFen l\xE4sst. Sie werden zu einer Reihe von Tieren
        gez\xE4hlt, die fortgeschrittene s\xE4ugetier\xE4hnliche Merkmale aufweisen,
        sich aber in Details noch von den heutigen S\xE4ugern unterscheiden und darum
        als Mammaliaformes (S\xE4ugetierartige) oder als Mammalia sensu lato (im weiteren
        Sinn) zusammengefasst werden. Ob man sie bereits als S\xE4ugetier oder noch
        als S\xE4ugetiervorfahren bezeichnet, ist weitgehend Definitionsfrage. Verworfen
        ist hingegen eine Zugeh\xF6rigkeit zu den Triconodonta, eine S\xE4ugetiergruppe,
        die durch dreih\xF6ckrige Molaren charakterisiert wurde, die sich aber als
        keine nat\xFCrliche Gruppe herausgestellt hat.\"},{\"description\":\"Die Morganucodonta
        werden in zwei Familien unterteilt, die Morganucodontidae und die Megazostrodontidae.
        Allerdings halten manche Forscher die Megazostrodontidae f\xFCr n\xE4her mit
        den Docodonta als mit den Morganucodontidae verwandt. Die bekannteste Gattung
        der Morganucodontidae ist Morganucodon (Synonym Eozostrodon), andere Gattungen
        sind Erythrotherium aus S\xFCdafrika, Hallautherium (benannt nach dem Fundort
        Hallau) und Helvetiodon aus Europa (Schweiz), Indotherium aus Indien sowie
        Brachyzostrodon und Wareolestes aus Westeuropa. (Die beiden letztgenannten
        Gattungen werden manchmal auch den Megazostrodontidae zugerechnet.) Die Megazostrodontidae
        umfassen neben dem namensgebenden Megazostrodon noch Dinnetherium aus Arizona
        (USA) und Indozostrodon aus Indien.\"}],\"vernacularNames\":[],\"synonym\":false,\"higherClassificationMap\":{}}],\"facets\":[]}"
