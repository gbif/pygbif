        key\",\"Moroniella\",\"Strigoderma\",\"aedeagus\",\"endophallus\",\"new species\"],\"language\":\"eng\",\"literatureType\":\"JOURNAL\",\"month\":10,\"notes\":\"10.13039/501100004892;10.13039/501100020636\",\"openAccess\":true,\"peerReview\":true,\"publisher\":\"Pensoft
        Publishers\",\"relevance\":[\"GBIF_MENTIONED\"],\"source\":\"ZooKeys\",\"tags\":[\"2016\",\"Biodiversity_science\",\"CR_biodiversity\",\"ES\",\"GBIF_mentioned\",\"SDG15\",\"citation_scope:na\",\"citation_type:generic\",\"lit_source:publisher\",\"open_access:TRUE\",\"peer_review:TRUE\"],\"title\":\"Checklist
        and identification key of Anomalini (Coleoptera, Scarabaeidae, Rutelinae)
        of Costa Rica\",\"topics\":[\"BIODIVERSITY_SCIENCE\"],\"modified\":\"2025-11-12T10:30:52.676+00:00\",\"websites\":[\"https://doi.org/10.3897/zookeys.621.7565\"],\"year\":2016,\"abstract\":\"A
        checklist and identification key for the species of the tribe Anomalini in
        Costa Rica are presented. The Anomalini species are important economically,
        as they have larvae that are or can become agricultural pests, as well as
        ecologically, having potential as bioindicators. In spite of their importance
        and richness, identification tools for the group in the Neotropics remain
        scarce. The Costa Rican fauna comprises six genera (Anomala, Anomalorhina,
        Callistethus, Epectinaspis, Moroniella, and Strigoderma) and a total of 120
        species. Anomala contusa Filippini, Mic\xF3, Galante, 2015 is proposed as
        a synonym of A. inbio (Ram\xEDrez-Ponce, Bitar, Curoe 2014); Anomala limon
        nom. n. is proposed as a new name for A. inbio Filippini, Galante, Mic\xF3,
        2015, a homonym of A. inbio (Ram\xEDrez-Ponce, Bitar, Curoe, 2014); Anomala
        cinaedias nom. n. is proposed as a new name for A. chloropyga Ohaus, 1897,
        a homonym of A. chloropyga Burmeister, 1844; and Anomala chrysomelina is moved
        to the genus Callistethus.\"},{\"discovered\":\"2025-01-14\",\"authors\":[{\"firstName\":\"Matteo\",\"lastName\":\"Cecchetto\"},{\"firstName\":\"Maria
        Chiara\",\"lastName\":\"Alvaro\"},{\"firstName\":\"Claudio\",\"lastName\":\"Ghiglione\"},{\"firstName\":\"Alice\",\"lastName\":\"Guzzi\"},{\"firstName\":\"Claudio\",\"lastName\":\"Mazzoli\"},{\"firstName\":\"Paola\",\"lastName\":\"Piazza\"},{\"firstName\":\"Stefano\",\"lastName\":\"Schiaparelli\"}],\"countriesOfCoverage\":[\"AQ\"],\"countriesOfResearcher\":[\"IT\"],\"publishingCountry\":[\"IT\"],\"added\":\"2025-11-12T10:26:23.915+00:00\",\"published\":\"2017-10-02T00:00:00.000+00:00\",\"day\":2,\"gbifDownloadKey\":[],\"gbifOccurrenceKey\":[],\"gbifTaxonKey\":[],\"gbifHigherTaxonKey\":[],\"gbifNetworkKey\":[\"8534dd20-c368-4a1f-bdaf-e6b390710f89\",\"2b7c7b4f-4d4f-40d3-94de-c28b6fa054a6\"],\"gbifProjectIdentifier\":[],\"gbifProgramme\":[],\"citationType\":\"DOI\",\"gbifRegion\":[\"ANTARCTICA\"],\"id\":\"6e950573-bb4a-3bc0-8407-4135e437824e\",\"identifiers\":{\"doi\":\"10.3897/zookeys.705.13712\"},\"keywords\":[\"3D
        models\",\"Antarctica\",\"Bransfield Strait\",\"Echinodermata\",\"Falkland
        Islands (Islas Malvinas)\",\"MNA\",\"Ophiuroidea\",\"Ross Sea\",\"Terra Nova
        Bay\",\"Weddell Sea\",\"virtual collection\"],\"language\":\"eng\",\"literatureType\":\"JOURNAL\",\"month\":10,\"notes\":\"10.13039/100013420;10.13039/501100008640\",\"openAccess\":true,\"peerReview\":true,\"publisher\":\"Pensoft
        Publishers\",\"relevance\":[\"GBIF_PUBLISHED\"],\"source\":\"ZooKeys\",\"tags\":[\"2017\",\"AQ_biodiversity\",\"Data_paper\",\"GBIF_published\",\"IT\",\"Marine\",\"SDG14\",\"citation_scope:na\",\"citation_type:DOI\",\"gbifDOI:10.15468/qkc0dz\",\"lit_source:publisher\",\"open_access:TRUE\",\"peer_review:TRUE\"],\"title\":\"Distributional
        records of Antarctic and sub-Antarctic Ophiuroidea from samples curated at
        the Italian National Antarctic Museum (MNA): check-list update of the group
        in the Terra Nova Bay area (Ross Sea) and launch of the MNA 3D model \u2018virtual
        gallery\u2019\",\"topics\":[\"MARINE\",\"DATA_PAPER\"],\"modified\":\"2025-11-12T10:26:23.915+00:00\",\"websites\":[\"https://doi.org/10.3897/zookeys.705.13712\"],\"year\":2017,\"abstract\":\"The
        distributional records of Ophiuroidea stored at the Italian National Antarctic
        Museum (MNA, Section of Genoa) are presented, corresponding to 1595 individuals
        that belong to 35 species and 17 genera. Specimens were collected in 106 different
        sampling stations at depths ranging from 21 to 1652 m in the framework of
        14 Antarctic expeditions to the Ross Sea, one to the Antarctic Peninsula,
        and one to the Falkland Islands (Islas Malvinas). Three species, Amphiura
        joubini Koehler, 1912, Amphiura (Amphiura) angularis Lyman, 1879, and Ophiura
        flexibilis (Koehler, 1911), are reported as new records for the Terra Nova
        Bay area, whose check-list of species increases from 15 to 18 species. The
        determination of these three new records was based both on morphological identification
        and molecular analyses (COI barcoding). Some of the genetically characterised
        specimens were also documented through photogrammetry and micro-computed tomography
        and represent the first bulk of 3D models that will be available through the
        MNA and Sketchfab websites, both for research and educational purposes.\"},{\"discovered\":\"2025-01-14\",\"authors\":[{\"firstName\":\"Tilo\",\"lastName\":\"Henning\"},{\"firstName\":\"Rafael\",\"lastName\":\"Acu\xF1a-Castillo\"},{\"firstName\":\"Xavier\",\"lastName\":\"Cornejo\"},{\"firstName\":\"Pa\xFAl\",\"lastName\":\"Gonz\xE1les\"},{\"firstName\":\"Edgar\",\"lastName\":\"Segovia\"},{\"firstName\":\"Akira
        Armando\",\"lastName\":\"Wong Sato\"},{\"firstName\":\"Maximilian\",\"lastName\":\"Weigend\"}],\"countriesOfCoverage\":[\"EC\",\"PE\"],\"countriesOfResearcher\":[\"EC\",\"CR\",\"PE\",\"DE\"],\"publishingCountry\":[],\"added\":\"2025-11-12T10:22:47.526+00:00\",\"published\":\"2023-06-30T00:00:00.000+00:00\",\"day\":30,\"gbifDownloadKey\":[],\"gbifOccurrenceKey\":[3764320941,4011672795,3947206738,3416222423,3858810457,3466042315,3802749525,3802781447,3947631714],\"gbifTaxonKey\":[],\"gbifHigherTaxonKey\":[],\"gbifNetworkKey\":[],\"gbifProjectIdentifier\":[],\"gbifProgramme\":[],\"citationType\":\"generic\",\"gbifRegion\":[\"LATIN_AMERICA\"],\"id\":\"562687b3-ad73-31bd-900f-cd5bac750930\",\"identifiers\":{\"doi\":\"10.3897/phytokeys.229.100082\"},\"keywords\":[\"Andes\",\"conservation\",\"iNaturalist\",\"specimen\",\"threatened
        species\"],\"language\":\"eng\",\"literatureType\":\"JOURNAL\",\"month\":6,\"notes\":\"10.13039/501100001664\",\"openAccess\":true,\"peerReview\":true,\"publisher\":\"Pensoft
        Publishers\",\"relevance\":[\"GBIF_CITED\"],\"source\":\"PhytoKeys\",\"tags\":[\"2023\",\"CR\",\"Conservation\",\"DE\",\"EC\",\"EC_biodiversity\",\"GBIF_cited\",\"PE\",\"PE_biodiversity\",\"SDG15\",\"Species_distributions\",\"citation_scope:na\",\"citation_type:generic\",\"gbifOccurrence:3416222423\",\"gbifOccurrence:3466042315\",\"gbifOccurrence:3764320941\",\"gbifOccurrence:3802749525\",\"gbifOccurrence:3802781447\",\"gbifOccurrence:3858810457\",\"gbifOccurrence:3947206738\",\"gbifOccurrence:3947631714\",\"gbifOccurrence:4011672795\",\"lit_source:publisher\",\"open_access:TRUE\",\"peer_review:TRUE\"],\"title\":\"\uFEFFWhen
        the absence of evidence is not the evidence of absence: Nasa (Loasaceae) rediscoveries
        from Peru and Ecuador, and the contribution of community science networks\",\"topics\":[\"SPECIES_DISTRIBUTIONS\",\"CONSERVATION\"],\"modified\":\"2025-11-12T10:22:47.526+00:00\",\"websites\":[\"https://doi.org/10.3897/phytokeys.229.100082\"],\"year\":2023,\"abstract\":\"Documentation
        of plant taxa has long been subject to the temporal and spatial selectivity
        of professional research expeditions, especially in tropical regions. Therefore,
        rare and/or narrowly endemic species are sometimes known only from very few
        and very old herbarium specimens. However, these taxa are very important from
        a conservation perspective. The lack of observations of living plants and
        confirmation of the actual occurrence of taxa hinders the planning and implementation
        of effective conservation measures. Community science networks have recently
        made tremendous contributions to documenting biodiversity in many regions
        across the globe. The rediscovery of six species of Nasa (Loasaceae) from
        Peru and Ecuador primarily via the platform iNaturalist, is reported.\"},{\"discovered\":\"2025-01-14\",\"authors\":[{\"firstName\":\"Peter\",\"lastName\":\"Decker\"},{\"firstName\":\"Axel\",\"lastName\":\"Christian\"},{\"firstName\":\"Willi
        E.R.\",\"lastName\":\"Xylander\"}],\"countriesOfCoverage\":[],\"countriesOfResearcher\":[\"DE\"],\"publishingCountry\":[],\"added\":\"2025-11-12T10:15:14.178+00:00\",\"published\":\"2018-03-07T00:00:00.000+00:00\",\"day\":7,\"gbifDownloadKey\":[],\"gbifOccurrenceKey\":[],\"gbifTaxonKey\":[],\"gbifHigherTaxonKey\":[],\"gbifNetworkKey\":[],\"gbifProjectIdentifier\":[],\"gbifProgramme\":[],\"citationType\":\"generic\",\"gbifRegion\":[],\"id\":\"6bd4d7c6-34be-37dc-a2e0-b8912b6ebb54\",\"identifiers\":{\"doi\":\"10.3897/zookeys.741.22284\"},\"keywords\":[\"Database\",\"digitisation\",\"morphology\",\"museum
        collection\",\"soil invertebrates\",\"type material\",\"visualisation\"],\"language\":\"eng\",\"literatureType\":\"JOURNAL\",\"month\":3,\"notes\":\"10.13039/501100001659\",\"openAccess\":true,\"peerReview\":true,\"publisher\":\"Pensoft
        Publishers\",\"relevance\":[\"GBIF_MENTIONED\"],\"source\":\"ZooKeys\",\"tags\":[\"2018\",\"Biodiversity_science\",\"DE\",\"GBIF_mentioned\",\"SDG15\",\"citation_scope:na\",\"citation_type:generic\",\"lit_source:publisher\",\"open_access:TRUE\",\"peer_review:TRUE\"],\"title\":\"VIRMISCO
        \u2013 The Virtual Microscope Slide Collection\",\"topics\":[\"BIODIVERSITY_SCIENCE\"],\"modified\":\"2025-11-12T10:15:14.178+00:00\",\"websites\":[\"https://doi.org/10.3897/zookeys.741.22284\"],\"year\":2018,\"abstract\":\"Digitisation
        allows scientists rapid access to research objects. For transparent to semi-transparent
        three-dimensional microscopic objects, such as microinvertebrates or small
        body parts of organisms, available databases are scarce. Most mounting media
        used for permanent microscope slides deteriorate after some years or decades,
        eventually leading to total damage and loss of the object. However, restoration
        is labour-intensive, and often the composition of the mounting media is not
        known. A digital preservation of important material, especially types, is
        important and an urgent need. The Virtual Microscope Slide Collection \u2013
        VIRMISCO project has developed recommendations for taking microscopic image
        stacks of three-dimensional objects, depositing and presenting such series
        of digital image files or z-stacks as an online platform. The core of VIRMISCO
        is an online viewer, which enables the user to virtually focus through an
        object online as if using a real microscope. Additionally, VIRMISCO offers
        features such as search, rotating, zooming, measuring, changing brightness
        or contrast, taking snapshots, leaving feedback as well as downloading complete
        z-stacks as jpeg files or video file. The open source system can be installed
        by any institution and can be linked to common database or images can be sent
        to the Senckenberg Museum of Natural History G\xF6rlitz. The benefits of VIRMISCO
        are the preservation of important or fragile material, to avoid loan, to act
        as a digital archive for image files and to allow determination by experts
        from the distance, as well as providing reference libraries for taxonomic
        research or education and providing image series as online supplementary material
        for publications or digital vouchers of specimens of molecular investigations
        are relevant applications for VIRMISCO.\"},{\"discovered\":\"2025-11-12\",\"authors\":[{\"firstName\":\"B.D.\",\"lastName\":\"Williams\"},{\"firstName\":\"R.C.\",\"lastName\":\"Francisco\"},{\"firstName\":\"B.\",\"lastName\":\"Mewded\"},{\"firstName\":\"C.\",\"lastName\":\"Oppong\"},{\"firstName\":\"C.B.\",\"lastName\":\"Ayensu\"},{\"firstName\":\"C.W.\",\"lastName\":\"Masinde\"},{\"firstName\":\"D.B.\",\"lastName\":\"Chukwuma\"},{\"firstName\":\"A.G.\",\"lastName\":\"Deresa\"},{\"firstName\":\"D.D.\",\"lastName\":\"Yeboah\"},{\"firstName\":\"O.D.\",\"lastName\":\"Ahossou\"},{\"firstName\":\"F.\",\"lastName\":\"Rasaminirina\"},{\"firstName\":\"U.P.\",\"lastName\":\"Igho-Osagie\"},{\"firstName\":\"M.J.\",\"lastName\":\"Korir\"},{\"firstName\":\"K.B.\",\"lastName\":\"Antwi-Boasiako\"},{\"firstName\":\"R.A.\",\"lastName\":\"Mfodwo\"},{\"firstName\":\"A.S.M.\",\"lastName\":\"Mutegeki\"},{\"firstName\":\"P.\",\"lastName\":\"Atta-Adjei\"},{\"firstName\":\"P.K.\",\"lastName\":\"Akomatey\"},{\"firstName\":\"S.\",\"lastName\":\"Kumordzie\"},{\"firstName\":\"R.\",\"lastName\":\"Borosova\"},{\"firstName\":\"C.\",\"lastName\":\"Tang\"},{\"firstName\":\"A.\",\"lastName\":\"Asase\"},{\"firstName\":\"G.\",\"lastName\":\"Ameka\"},{\"firstName\":\"A.R.G.\",\"lastName\":\"Sim\xF5es\"}],\"countriesOfCoverage\":[\"GH\"],\"countriesOfResearcher\":[\"UG\",\"BE\",\"ET\",\"CN\",\"GB\",\"BJ\",\"GH\",\"MG\",\"ZA\",\"KE\",\"NG\"],\"publishingCountry\":[\"GB\"],\"added\":\"2025-11-12T09:56:46.009+00:00\",\"published\":\"2024-12-31T00:00:00.000+00:00\",\"day\":31,\"gbifDownloadKey\":[],\"gbifOccurrenceKey\":[125818575,1057155345],\"gbifTaxonKey\":[2928509],\"gbifHigherTaxonKey\":[7707728,2389,6,1176,220],\"gbifNetworkKey\":[\"99d66b6c-9087-452f-a9d4-f15f2c2d0e7e\",\"17abcf75-2f1e-46dd-bf75-a5b21dd02655\"],\"gbifProjectIdentifier\":[],\"gbifProgramme\":[],\"citationType\":\"DOI\",\"gbifRegion\":[\"AFRICA\"],\"id\":\"1192343e-153b-3134-a8ba-e5e6de6bff40\",\"identifiers\":{\"doi\":\"10.22244/rheedea.2024.34.05.05\"},\"keywords\":[\"Conservation\",\"Education\",\"Identification\",\"Morphology\",\"Plant
        Taxonomy\",\"Traditional uses\"],\"language\":\"eng\",\"literatureType\":\"JOURNAL\",\"month\":12,\"notes\":\"10.13039/100012643;10.13039/501100020652\",\"openAccess\":true,\"peerReview\":true,\"publisher\":\"Indian
        Association for Angiosperm Taxonomy (IAAT)\",\"relevance\":[\"GBIF_CITED\"],\"source\":\"Rheedea\",\"tags\":[\"2024\",\"BE\",\"BJ\",\"Biodiversity_science\",\"CN\",\"ET\",\"GB\",\"GBIF_cited\",\"GH\",\"GH_biodiversity\",\"KE\",\"MG\",\"NG\",\"SDG15\",\"UG\",\"ZA\",\"citation_scope:na\",\"citation_type:DOI\",\"gbifDOI:10.5519/qd.cv5d8yso\",\"gbifOccurrence:1057155345\",\"gbifOccurrence:125818575\",\"gbifTaxon:2928509\",\"lit_source:gs\",\"open_access:TRUE\",\"peer_review:TRUE\"],\"title\":\"Advancing
        knowledge of West African morning glories: A taxonomic account of Ipomoea
        (Convolvulaceae) from Ghana\",\"topics\":[\"BIODIVERSITY_SCIENCE\"],\"modified\":\"2025-11-12T09:56:46.009+00:00\",\"websites\":[\"https://rheedea.in/journal/A2XjPglv\"],\"year\":2024,\"abstract\":\"Ghana\u2019s
        plant diversity is estimated at 3,419plant species, belonging to 1,222 genera.
        However, a Flora of Ghana is yet inexistent, and targeted floristic and taxonomic
        studies are still much needed to document the plant diversity of the country
        fully at the family, generic and species levels. This is essential for identifying
        priority conservation areas in the country and support further research in
        crop wild relatives or medicinal plants, which will help tackle food insecurity
        and improve livelihoods. In this study, we provide a taxonomic revision of
        the genus Ipomoea in Ghana to enhance their identification, conservation and
        sustainable utilization as food and medicine among other uses. An extensive
        literature review was carried out, including historical references and online
        taxonomic databases, to recover information on accepted names, type specimens
        and synonyms, followed by consultation of herbarium specimens at GC, to retrieve
        morphological information and database specimens. Specimen locality information
        was georeferenced, and records plotted onto distribution maps. As a result,
        this work provides an identification key to the species of genus Ipomoea of
        Ghana, nomenclatural information, comprehensive morphological descriptions,
        detailed list of examined specimens, distribution maps and notes on conservation
        status and traditional plant uses. In total, 28 species are fully described,
        20 of which are native and eight introduced from the Americas; five are new
        records to Ghana.\"},{\"discovered\":\"2025-01-13\",\"authors\":[{\"firstName\":\"Vestidhia
        Y.\",\"lastName\":\"Atmaja\"},{\"firstName\":\"Rury\",\"lastName\":\"Eprilurahman\"},{\"firstName\":\"Misbahul\",\"lastName\":\"Munir\"},{\"firstName\":\"Eric
        N.\",\"lastName\":\"Smith\"},{\"firstName\":\"Tuty\",\"lastName\":\"Arisuryanti\"},{\"firstName\":\"Rosichon\",\"lastName\":\"Ubaidillah\"},{\"firstName\":\"Amir\",\"lastName\":\"Hamidy\"}],\"countriesOfCoverage\":[\"ID\"],\"countriesOfResearcher\":[\"US\",\"ID\"],\"publishingCountry\":[],\"added\":\"2025-11-12T09:38:29.588+00:00\",\"published\":\"2024-12-04T00:00:00.000+00:00\",\"day\":4,\"gbifDownloadKey\":[],\"gbifOccurrenceKey\":[],\"gbifTaxonKey\":[2422094,2422104,8028213],\"gbifHigherTaxonKey\":[1,131,6741,952,44,2422089],\"gbifNetworkKey\":[],\"gbifProjectIdentifier\":[],\"gbifProgramme\":[],\"citationType\":\"generic\",\"gbifRegion\":[\"ASIA\"],\"id\":\"5a29e650-6d3e-3c84-8b03-6a9d09f7935c\",\"identifiers\":{\"doi\":\"10.47605/tapro.v13i2.334\"},\"keywords\":[\"16S
        mtDNA\",\"M. butleri\",\"M. mantheyi\",\"M. mukhlesuri\",\"morphology\",\"systematics\"],\"language\":\"eng\",\"literatureType\":\"JOURNAL\",\"month\":12,\"notes\":\"10.13039/100000001\",\"openAccess\":true,\"peerReview\":true,\"publisher\":\"Research
        Center for Climate Change, University of Indonesia\",\"relevance\":[\"GBIF_CITED\"],\"source\":\"Taprobanica\",\"tags\":[\"2024\",\"Biodiversity_science\",\"GBIF_cited\",\"ID\",\"ID_biodiversity\",\"SDG15\",\"US\",\"citation_scope:na\",\"citation_type:generic\",\"gbifTaxon:2422094\",\"gbifTaxon:2422104\",\"gbifTaxon:8028213\",\"lit_source:gs\",\"open_access:TRUE\",\"peer_review:TRUE\"],\"title\":\"Unveiling
        Misidentification of Formerly Reported Microhyla Fissipes Boulenger, 1884
        (anura: Microhylidae) with Notes on Two Microhyla Species from Sumatra\",\"topics\":[\"BIODIVERSITY_SCIENCE\"],\"modified\":\"2025-11-12T09:38:29.588+00:00\",\"websites\":[\"https://doi.org/10.47605/tapro.v13i2.334\"],\"year\":2024,\"abstract\":\"Sumatra
        is widely recognized as a land bridge for the dispersal of amphibians between
        mainland Asia and the rest of the Indonesian Archipelago. Currently, six species
        of Microhyla are recognized in Sumatra: M. gadjahmadai, M. nakkavaram, M.
        palmipes, M. sundaica, M. superciliaris, and M. sriwijaya. Pradana et al.
        (2017) identified some Microhyla specimens as M. fissipes using molecular
        analysis (partial sequence of 16S mtDNA). Meanwhile, Yuan et al. (2016) restricted
        the distribution of M. fissipes to the northeast of the Red River Valley and
        Taiwan. In this study, we have revised the identification of \u2018Microhyla
        sp. aff. fissipes\u2019 Sumatra sensu Pradana et al. (2017) to M. mukhlesuri,
        based on both molecular and morphological analyses. Additionally, we report
        the first site records of M. mantheyi and M. butleri from Sumatra. We reconfirm
        the diagnostic characters based on their original descriptions and report
        on the morphological variation of the Sumatran populations of these three
        species.\"},{\"discovered\":\"2025-01-13\",\"authors\":[],\"countriesOfCoverage\":[\"FR\"],\"countriesOfResearcher\":[\"FR\"],\"publishingCountry\":[],\"added\":\"2025-11-12T09:24:39.000+00:00\",\"published\":\"2024-12-01T00:00:00.000+00:00\",\"day\":1,\"gbifDownloadKey\":[],\"gbifOccurrenceKey\":[],\"gbifTaxonKey\":[],\"gbifHigherTaxonKey\":[],\"gbifNetworkKey\":[],\"gbifProjectIdentifier\":[],\"gbifProgramme\":[],\"citationType\":\"generic\",\"gbifRegion\":[\"EUROPE\"],\"id\":\"d3727acb-2936-3719-85e1-0cebc6862b87\",\"identifiers\":{},\"keywords\":[],\"language\":\"fra\",\"literatureType\":\"REPORT\",\"month\":12,\"notes\":\"No
        specific funding information provided.\",\"openAccess\":true,\"peerReview\":false,\"publisher\":\"PatriNat\",\"relevance\":[\"GBIF_MENTIONED\"],\"tags\":[\"2024\",\"FR\",\"FR_biodiversity\",\"Freshwater\",\"GBIF_mentioned\",\"SDG15\",\"citation_scope:na\",\"citation_type:generic\",\"lit_source:gs\",\"open_access:TRUE\",\"peer_review:FALSE\"],\"title\":\"Guide
        de d\xE9termination des \xABn\xE9otaxons\xBB de poissons d'eau douce de France
        hexagonale\",\"topics\":[\"FRESHWATER\"],\"modified\":\"2025-11-12T09:24:39.000+00:00\",\"websites\":[\"https://hal.science/hal-04878704\"],\"year\":2024,\"abstract\":\"Dans
        les ann\xE9es 1990 et d\xE9but 2000, la France recensait 83 esp\xE8ces de
        poissons d\u2019eau douce en Hexagone (Allardi et Keith, 1991 ; Billard, 1997
        ; Keith et Allardi, 2001), et la plupart des esp\xE8ces paraissaient communes
        aux pays voisins. Or \xE0 partir des ann\xE9es 2000, avec d\u2019une part
        le d\xE9veloppement de l\u2019informatique et surtout des outils mol\xE9culaires,
        un nouveau type de donn\xE9es moins subjectif a permis l\u2019\xE9tude des
        similarit\xE9s, de l\u2019\xE9volution des esp\xE8ces et l\u2019identification
        pr\xE9cises des \xE9chantillons (Denys et al., 2024). C\u2019est ainsi que
        neuf genres ont \xE9t\xE9 r\xE9vis\xE9s, avec 26 esp\xE8ces suppl\xE9mentaires
        \u2013 dits \xAB n\xE9otaxons \xBB \u2013 int\xE9grant le r\xE9f\xE9rentiel
        taxonomique fran\xE7ais (Kottelat et Freyhof, 2007 ; Keith et al., 2011, 2020
        ; Denys et al., 2024). La grande majorit\xE9 de ces esp\xE8ces sont end\xE9miques
        ou subend\xE9miques en France, et ont donc un statut patrimonial. Il est donc
        important que les acteurs (gestionnaires, chercheurs, bureaux d\u2019\xE9tudes,
        etc\u2026) puissent les identifier sur le terrain afin d\u2019apporter de
        la donn\xE9e primaire fiable pour les \xE9tudes en \xE9cologie ou en biologie
        de conservation. Une multitude de cl\xE9s et de guides d\u2019identification
        des poissons d\u2019eau douce de France a \xE9t\xE9 publi\xE9es depuis un
        si\xE8cle. La grande majorit\xE9 d\u2019entre eux s\u2019adressent \xE0 un
        public avis\xE9, voire expert. Mais aucune ne parle (ou tr\xE8s peu) de ces
        n\xE9otaxons. Or le but de ce guide est de permettre l'identification rapide
        des individus et sans les sacrifier ce qui contraint le format de ce dernier
        en privil\xE9giant les caract\xE8res facilement observables. Ainsi, il peut
        \xEAtre utilis\xE9 par un large public non averti. Ce document apporte s\u2019articule
        en sept cl\xE9s d\u2019identification illustrant les genres r\xE9vis\xE9s
        pour lesquels l\u2019identification morphologique est r\xE9alisable sur le
        terrain : - Goujons (Gobio spp) - Vandoises (Leuciscus spp) - Chevesnes (Squalius
        spp) - Brochets (Esox spp) - Ombres (Thymallus spp) - Epinochettes (Pungitius
        spp). Trois autres genres sont \xE9galement pr\xE9sent\xE9s : les vairons
        (Phoxinus spp) pour lesquels seuls les robes nuptiales observables de mai
        \xE0 juillet sont diagnostiques sur le terrain. En revanche, pour les loches
        franches (Barbatula spp) et les chabots (Cottus spp), seule l\u2019identification
        au genre est possible. Apr\xE8s chaque cl\xE9, des fiches esp\xE8ces avec
        le nom scientifique, le code ASPE s\u2019il est disponible, le statut Liste
        Rouge UICN national ou r\xE9gionale (UICN comit\xE9 fran\xE7ais et al., 2019
        ; ARPO technique, non publi\xE9), une photo, la diagnose et l\u2019aire de
        r\xE9partition.\"},{\"discovered\":\"2025-01-13\",\"authors\":[{\"firstName\":\"Nicolas\",\"lastName\":\"Moity\"},{\"firstName\":\"Gregorio\",\"lastName\":\"Bigatti\"},{\"firstName\":\"Frank\",\"lastName\":\"Muller-Karger\"},{\"firstName\":\"Enrique\",\"lastName\":\"Montes\"}],\"countriesOfCoverage\":[],\"countriesOfResearcher\":[\"EC\",\"US\",\"AR\"],\"publishingCountry\":[],\"added\":\"2025-11-12T09:19:54.116+00:00\",\"published\":\"2024-12-06T00:00:00.000+00:00\",\"day\":6,\"gbifDownloadKey\":[],\"gbifOccurrenceKey\":[],\"gbifTaxonKey\":[],\"gbifHigherTaxonKey\":[],\"gbifNetworkKey\":[],\"gbifProjectIdentifier\":[],\"gbifProgramme\":[],\"citationType\":\"generic\",\"gbifRegion\":[],\"id\":\"afa5657a-fa9f-3391-bb90-3f45c5819784\",\"identifiers\":{\"doi\":\"10.5670/oceanog.2025.137\"},\"keywords\":[],\"language\":\"eng\",\"literatureType\":\"JOURNAL\",\"month\":12,\"notes\":\"10.13039/501100003074;10.13039/100000104\",\"openAccess\":true,\"peerReview\":true,\"publisher\":\"The
