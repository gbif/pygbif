        Spring Harbor Laboratory\",\"relevance\":[\"GBIF_MENTIONED\"],\"source\":\"bioRxiv\",\"tags\":[\"2024\",\"Evolution\",\"GBIF_mentioned\",\"IT\",\"IT_biodiversity\",\"SDG15\",\"Species_distributions\",\"citation_scope:na\",\"citation_type:DOI\",\"gbifDOI:10.15468/hstsnr\",\"lit_source:event-crossref\",\"open_access:TRUE\",\"peer_review:FALSE\"],\"title\":\"A
        survey of duckweed species in Southern Italy provided first distribution records
        of the hybrid Lemna\xD7mediterranea in nature\",\"topics\":[\"SPECIES_DISTRIBUTIONS\",\"EVOLUTION\"],\"modified\":\"2025-11-12T09:12:22.418+00:00\",\"websites\":[\"https://doi.org/10.1101/2024.08.09.607168\"],\"year\":2024,\"abstract\":\"Interspecific
        hybridisation and polyploidization are two main driving forces in plant evolution,
        shaping genomes and favouring evolutionary novelty and ecological adaptation.
        Recent studies have demonstrated hybridisation within the genusLemna(Lemnaceae
        Martinov) as well as triploid.L. \xD7mediterranea, a recently described hybrids
        betweenLemna minorandLemna gibbawas identified among only long lasting germplasm
        collections ofin vitropropagated plants, originally collected at different
        times in the Mediterranean area.We report the first distribution record ofL.
        \xD7 mediterraneain the nature, in the Campania region of Southern Italy,
        the same area whereLemna symmeterwas described as a new species about 50 years
        ago, confirming their synonymy. Eight specimens isolated from five different
        sampling sites over an area of about 4200 Km2showed identical genetic profiles
        by Tubulin-Based Polymorphism (TBP) analysis, suggesting their common origin
        from the same hybridisation event, followed by clonal dispersal. TheL. \xD7
        mediterraneapopulation of Campania is genetically different from any of the
        previously analysed clones, suggesting that recurrent hybridisation between
        the parental species may occur. The natural hybrid clone is triploid, withL.gibbaas
        the plastid donor, and remarkably similar to it by morphology, although the
        typical gibbosity of this species becomes evident only uponin vitroflower
        induction. Flowers are protogynous and self-sterile. Ecological factors including
        competition with parental and invasive species, niche and climate change adaptation,
        stability in time and space likely played a role in the successful establishment
        ofL. \xD7 mediterranea.HighlightsInterspecific hybridisation within the genus
        Lemna documented in nature\u03B2-tubulin intron length polymorphism for tracking
        duckweed species distributionFlower induction in Lemna \xD7 mediterranea\"},{\"discovered\":\"2025-11-12\",\"authors\":[{\"firstName\":\"Denis
