        specific funding information provided.\",\"openAccess\":true,\"peerReview\":true,\"publisher\":\"Siberian
        Federal University\",\"relevance\":[\"GBIF_CITED\"],\"source\":\"Journal of
        Siberian Federal University. Biology\",\"tags\":[\"2024\",\"Conservation\",\"GBIF_cited\",\"RU\",\"RU_biodiversity\",\"SDG15\",\"citation_scope:na\",\"citation_type:generic\",\"gbifOccurrence:4416851330\",\"lit_source:gs\",\"open_access:TRUE\",\"peer_review:TRUE\"],\"title\":\"Rare
        Species of Plants and Fungi of Buryatia: Distribution and Geodata Structure
        in the Protected Areas\",\"topics\":[\"CONSERVATION\"],\"modified\":\"2025-11-12T08:53:54.414+00:00\",\"websites\":[\"http://journal.sfu-kras.ru/en/article/154335\"],\"year\":2024,\"abstract\":\"Work
        on the fourth edition of the Red Data Book of the Republic of Buryatia has
        been completed. All descriptions and data on the distribution, structure,
        and population size of rare plants and fungi have been updated. Recommendations
        for the protection of these species have been prepared. Today, all available
        data on the distribution of rare plants and fungi in Buryatia have been converted
        into a digital format. An assessment of the spatial distribution of rare bryophytes,
        lichens, and fungi showed that they, liverworts in particular, have been studied
        thoroughly in protected areas of the region. The authors have created distribution
        databases for rare vascular plants of the Baikalsky State Nature Reserve and
        the Tunkinsky National Park. As part of this research, the lists and locations
        of rare vascular plants were respecified, data from literature, archives,
        and field observations were summarized, and large amounts of geodata from
        herbarium collections and open sources were used. Comparison of information
        from databases and plant distribution maps in different editions of the Red
        Data Book revealed an increase of high-quality data on the distribution of
        rare vascular plants of Buryatia. The reasons for that development were the
        public access to digitized herbaria, the availability of precise georeferencing
        for modern herbarium specimens, the publication of abundant reference materials,
        and increasing interest of non-professionals in botanical observations in
        the region.\"}],\"facets\":[]}"
