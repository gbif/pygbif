        Wesleyan University\",\"institutionCode\":\"SAL\"},{\"key\":\"162b841b-38f8-408a-94bf-aa475d2613f7\",\"code\":\"Birds\",\"name\":\"KUBI
        Ornithology Collection\",\"description\":\"The Ornithology group in the Biodiversity
        Institute at the University of Kansas conducts research and provides undergraduate
        and graduate education on the birds of the world. Research topics include
        the species limits and species diversity, evolution, geography, genetics and
        genomics, morphology, conservation, ecology, and behavior. This work is greatly
        enhanced by extensive research collections of world birds, numbering more
        than 107,000 specimens, many of which are recently collected as part of the
        group&#39;s global bird sampling program.<br /> <br />\\n\\n\\nOrnithology&#39;s
        study skin collections total about 60,000 specimens. The historical collections
        are strongest for the Great Plains of the United States and for Mexico, with
        additional holdings from Central and South America, Borneo, and Kenya. Recent
        large-scale collections have built significant recent holdings from Mexico,
        Dominican Republic, El Salvador, Panama, Guyana, Peru, Paraguay, Argentina,
        Sierra Leone, Ghana, Botswana, Democratic Republic of the Congo, Mongolia,
        China, Vietnam, Philippines, Malaysia, Papua New Guinea, Solomon Islands,
        Fiji, Palau, and others. Collections of special importance include series
        of more than 14,000 House Sparrow (Passer domesticus), which formed the basis
        for landmark scientific research by Richard Johnston and his students; extensive
        series of several North American species (Red-winged Blackbird Agelaius phoeniceus,
        meadowlarks Sturnella spp., Horned LarkEremophila alpestris); series documenting
        many of the Great Plains hybrid zones; and the feathers of an extinct moa
        (Dinornithidae). Recent additions include extensive series from Guyana, Mexico,
        Panama, Peru, and Paraguay, including many species otherwise poorly represented
        in scientific collections.<br /> <br />\\n\\nThe avian osteological collections
        are extensive, totaling over 32,500 specimens, and ranked third largest in
        the world (Wood and Schnell 1986). This component of the collection has important
        strengths from the Great Plains of the United States, Mexico, and northern
        South America. Important holdings include critical and unique Ecuadorian series,
        extensive recent Australian material, and a large series of steamer-ducks
        (Tachyeres sp.). Recent collecting activities have built South American skeletal
        holdings into an important collection, with material from poorly represented
        sectors such as the Atlantic Forest, the Yucatan Peninsula, Guyana, and montane
        Central America.<br /> <br />\\n\_\\nAlthough fluid-preserved specimens were
        not an early focus of Ornithology activities, the collections at KU were ranked
        seventh in North America at the time of the last summary of anatomical holdings
        (Wood et al. 1982). More recently, as part of Prum&#39;s research program,
        these collections have grown significantly, with important holdings of suboscine
        passeriform birds, among other groups. Now housed with ample space and ideal
        storage conditions in an NSF- and State of Kansas-funded addition, this collection
        is seeing increased research applications.\",\"contentTypes\":[\"Biological\"],\"active\":true,\"personalCollection\":false,\"email\":[],\"phone\":[],\"homepage\":\"http://biodiversity.ku.edu/ornithology/collections\",\"catalogUrls\":[\"http://ornithology.biodiversity.ku.edu/collections-search\"],\"apiUrls\":[],\"preservationTypes\":[],\"accessionStatus\":\"Institutional\",\"institutionKey\":\"49fb6451-91b7-4af2-8cd3-354539a77589\",\"mailingAddress\":{\"key\":10959,\"address\":\"Biodiversity
