        Museum of China (Baoding Natural History Museum)\",\"description\":\"The museum,
        covering approximately 120 mu (80,000 square meters) with a total construction
        area of around 73,000 square meters, stands as a national-level theme museum
        in the field of natural sciences. It is a key project in the comprehensive
        implementation of the national strategy for coordinated development in the
        Beijing-Tianjin-Hebei region, which also aims to decentralize the non-capital
        functions of Beijing, according to China Central Television on Wednesday.\\n\\nThe
        museum, themed around nature, life and humanity, with evolution as its main
        storyline, provides a systematic presentation on paleontology and evolutionary
        biology. It narrates the stories of natural history, and is set to convey
        the natural concept that \\\"humans and nature are a community of life.\\\"\\n\\nThe
        exhibits, numbering around 6,000 items, primarily come from the Chinese Academy
        of Sciences' Institute of Vertebrate Paleontology and Paleoanthropology. Precious
        fossil specimens from Beijing have been relocated to the new museum. Among
        the displayed artifacts are rare treasures, including the world's only complete
        skeleton of the Chinese velociraptor, the earliest known jawed fish species,
