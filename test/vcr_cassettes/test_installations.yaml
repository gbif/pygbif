        data network.\",\"createdBy\":\"MattBlissett\",\"modifiedBy\":\"MattBlissett\",\"created\":\"2025-05-22T11:08:33.032+00:00\",\"modified\":\"2025-05-22T11:08:33.032+00:00\",\"disabled\":false,\"contacts\":[],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[]},{\"key\":\"74d91ce4-0565-4496-b1fd-7440dc47d9d4\",\"organizationKey\":\"f5fd374b-89cb-4ab6-b3eb-794c65f232c3\",\"type\":\"IPT_INSTALLATION\",\"title\":\"Sistema
