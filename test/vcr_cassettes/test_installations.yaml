        Biosphere Reserve - Biodiversity Day Field Surveys\",\"createdBy\":\"mgrosjean\",\"modifiedBy\":\"mgrosjean\",\"created\":\"2025-03-07T12:30:05.951+00:00\",\"modified\":\"2025-03-07T12:30:05.951+00:00\",\"disabled\":false,\"contacts\":[],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[]},{\"key\":\"6737714d-9f6c-4935-ac5a-79ce9b644e9c\",\"organizationKey\":\"ff7bd5db-b724-4932-b496-10ea298851f9\",\"type\":\"MDT_INSTALLATION\",\"title\":\"Canadensys
        Metabarcoding Datasets\",\"description\":\"This Metabarcoding Data Toolkit
        instance is a resource for the Canadian community to publish metabarcoding
        data, like eDNA, to GBIF through the Canadensys node. This installation is
        intended to improve GBIF\u2019s integration of DNA metabarcoding data on biodiversity.
        Data that are not a good fit for this tool can still be published through
        the Canadensys IPT (https://data.canadensys.net/ipt/). Please send any comments
        or questions to canadensys.network@gmail.com.\",\"createdBy\":\"MattBlissett\",\"modifiedBy\":\"trobertson\",\"created\":\"2025-02-26T12:25:45.744+00:00\",\"modified\":\"2025-02-26T13:23:21.554+00:00\",\"disabled\":false,\"contacts\":[],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[]},{\"key\":\"aaa6be77-344c-4ee9-ba47-39f107ea386e\",\"organizationKey\":\"dceeca13-45b7-4155-8069-9ed7cef1ab6a\",\"type\":\"IPT_INSTALLATION\",\"title\":\"cnr-isp\",\"description\":\"The
        Italian National Research Council (CNR) is a public research institution recognized
        for its extensive scientific expertise and a nationwide network of research
        institutes. CNR plays a key role in advancing scientific knowledge and fostering
        national development. Within CNR, the Institute of Polar Sciences (ISP) operates
        across multiple branches located in Venice, Bologna, Messina, and Rome. ISP's
        mission is to enhance the quality of Italian scientific and technological
        research in polar regions, provide insights into global environmental changes,
        and support both Italian and European environmental policies through innovative
        technologies and research methodologies. ISP-Bologna specializes in marine
        and atmospheric sciences, with a primary focus on the Strategic Area of Global
        Changes. Its research contributes significantly to understanding the polar
        system, a critical hotspot for climate change that influences atmospheric
        and oceanic dynamics at mid and low latitudes. Additionally, the ISP-Bologna
        manages two major marine infrastructures: one in the Svalbard Islands and
        another in the southern Adriatic Sea. The Svalbard Italian Observatory comprises
        four monitoring sites: three within the Kongsfjorden-Krossfjorden system (KIM,
        MDI, MAP) and one oceanic site, S1, in the Fram Strait. This Observatory collects
        comprehensive physical, biogeochemical, and biological data from various depths
        within the water column. As part of the Svalbard Integrated Arctic Earth Observing
        System (SIOS), it provides valuable insights into Arctic marine environments
        and their role in global climate dynamics. The Adriatic Observatory is located
        in the southern Adriatic Sea and consists of four moorings: BB, FF, EE, and
        E2M3A. The Adriatic Observatory focuses on measuring physical, biogeochemical,
        and biological parameters in the lower water column (last 100 meters). This
        site is an integral component of the European Multidisciplinary Seafloor and
        Water Column Observatory (EMSO-ERIC), a European Research Infrastructure Consortium
        dedicated to enhancing the understanding of deep marine ecosystems and their
