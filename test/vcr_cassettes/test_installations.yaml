        1985 para estudiar la flora y vegetaci\xF3n de los estados de Guanajuato,
        Quer\xE9taro y la parte septentrional de Michoac\xE1n. Este proyecto no solo
        result\xF3 en una s\xF3lida fuente de informaci\xF3n sobre la diversidad,
