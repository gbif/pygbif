        France Metabarcoding Datasets\",\"description\":\"Le Metabarcoding Data Toolkit
        (MDT) est un outil qui a pour objectif de faciliter la publication des donn\xE9es
        de m\xE9tabarcoding, telles que celles issues des techniques d\u2019ADN environnemental,
        sur le GBIF, en transformant les formats les plus courants (OTU et ASV) au
        standard Darwin Core et ses extensions. L\u2019installation du MDT GBIF France
        fait partie d\u2019un projet pilote GBIF de deux ans, destin\xE9 \xE0 am\xE9liorer
        l\u2019int\xE9gration par le GBIF des donn\xE9es de m\xE9tabarcoding ADN sur
        la biodiversit\xE9 et \xE0 renforcer les communaut\xE9s scientifiques et de
        gestion/surveillance de la biodiversit\xE9 en explorant leurs besoins et de
        nouveaux cas d\u2019\xE9tude.\",\"createdBy\":\"thomasgbif\",\"modifiedBy\":\"thomasgbif\",\"created\":\"2025-04-03T07:32:14.321+00:00\",\"modified\":\"2025-04-03T07:32:14.321+00:00\",\"disabled\":false,\"contacts\":[],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[]},{\"key\":\"6f7273fb-77ac-4bc1-9c0f-f5dfcba18b86\",\"organizationKey\":\"b94c4428-77c1-47e0-a8c2-2b08228d8dd8\",\"type\":\"IPT_INSTALLATION\",\"title\":\"BioEcoOcean
