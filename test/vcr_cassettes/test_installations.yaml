        Oceania Metabarcoding Toolkit\",\"description\":\"This installation of the
        Metabarcoding Data Toolkit (MDT) is intended for use by stakeholders based
        in GBIF Oceania and coordinated by the Atlas of Living Australia (ALA). The
        toolkit helps to standardise and publish DNA metabarcoding datasets according
