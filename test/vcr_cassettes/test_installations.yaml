        Metabarcoding Datasets\",\"description\":\"GBIF.pl Metabarcoding Datasets
        is intended to facilitate and publish data collected by members of the Polish
        Biodiversity Information Network (KSIB).\",\"createdBy\":\"MattBlissett\",\"modifiedBy\":\"MattBlissett\",\"created\":\"2024-11-06T11:47:57.972+00:00\",\"modified\":\"2024-11-06T11:47:57.972+00:00\",\"disabled\":false,\"contacts\":[],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[]},{\"key\":\"630ead34-adcb-4f9c-b37d-c319285da8ce\",\"organizationKey\":\"fbca90e3-8aed-48b1-84e3-369afbd000ce\",\"type\":\"MDT_INSTALLATION\",\"title\":\"LAC
        Metabarcoding Data Toolkit\",\"description\":\"The Latin America and Caribbean
        (LAC) Metabarcoding Data Toolkit (MDT) is available for the eDNA barcoding
        community to facilitate biodiversity data sharing with GBIF and to recognize
        the contributions of the data publishers to GBIF.\\n\\nEl kit de herramientas
        de codificaci\xF3n de datos de metabarcoding (MDT, por sus siglas en ingl\xE9s)
        est\xE1 disponible para la comunidad de codificaci\xF3n de barras de eDNA,
        con el objetivo de facilitar el intercambio de datos de biodiversidad con
        GBIF y reconocer las contribuciones de los editores de datos a GBIF.\",\"createdBy\":\"MattBlissett\",\"modifiedBy\":\"MattBlissett\",\"created\":\"2024-11-01T10:55:19.389+00:00\",\"modified\":\"2024-11-01T11:04:32.919+00:00\",\"disabled\":false,\"contacts\":[],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[]},{\"key\":\"80a12845-4799-4fa2-8aba-d6a803225b97\",\"organizationKey\":\"f5fd374b-89cb-4ab6-b3eb-794c65f232c3\",\"type\":\"MDT_INSTALLATION\",\"title\":\"Dados
        Metabarcoding Brasil | Datasets Metabarcoding Brazil\",\"description\":\"Os
        Dados Metabarcoding Brasil referem-se a conjuntos de dados gen\xE9ticos coletados
        atrav\xE9s de t\xE9cnicas de metabarcoding, aplicadas em amostras ambientais
        como solo, \xE1gua e sedimentos. Esse m\xE9todo utiliza sequenciamento de
        DNA para identificar m\xFAltiplas esp\xE9cies presentes em uma amostra ao
        mesmo tempo, permitindo an\xE1lises r\xE1pidas da biodiversidade em diferentes
        ecossistemas. No Brasil, esses dados s\xE3o cruciais para o monitoramento
