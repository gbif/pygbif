        GBIF Metabarcoding Data\",\"description\":\"This tool is to assist organisations
        and researchers in the UK who are sampling environmental DNA using metabarcoding
        techniques to process their derived taxon occurrence records into Darwin Core
        Archives and share their OTU tables with the wider biological recording community,
        both national and internationally via GBIF.\",\"createdBy\":\"MattBlissett\",\"modifiedBy\":\"MattBlissett\",\"created\":\"2024-12-11T12:28:24.385+00:00\",\"modified\":\"2024-12-11T12:28:24.385+00:00\",\"disabled\":false,\"contacts\":[],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[]},{\"key\":\"6a64810b-e75a-4d59-bdf6-e086dad12d0e\",\"organizationKey\":\"d2583793-e5c1-41ae-83bd-86300d34e2cb\",\"type\":\"MDT_INSTALLATION\",\"title\":\"GBIF.Togo
        Metabarcoding Datasets\",\"description\":\"The metabarcoding procedure, proceeds
        in order through stages of DNA extraction, PCR amplification, sequencing and
        data analysis. Different genes are used depending if the aim is to barcode
        single species or metabarcoding several species.\\n\\nThe greatest advantage
        of DNA metabarcoding is its ability to identify each single species within
        complex multi\u2010ingredient and processed mixtures simultaneously, where
        the application of DNA barcoding and conventional analytical methods is limited
        considerably.\\n\\nThe effort and cost of producing DNA barcode sequence data
        for large numbers of herbarium sheets specimens can be prohibitive. Aim of
        this approach is to apply a modified metabarcoding approach that provides
        a labor\u2010efficient and cost\u2010effective solution for sequencing the
        Togo herbarium sheets specimens DNA barcodes of multiple hundreds of specimens
        at once\",\"createdBy\":\"MattBlissett\",\"modifiedBy\":\"MattBlissett\",\"created\":\"2024-12-04T14:55:11.563+00:00\",\"modified\":\"2024-12-04T14:55:11.563+00:00\",\"disabled\":false,\"contacts\":[],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[]},{\"key\":\"540907f2-3379-4744-b0a4-2292470984ae\",\"organizationKey\":\"2b4e561b-0b1a-4c1b-b564-819bcfe006b8\",\"type\":\"IPT_INSTALLATION\",\"title\":\"OBIS
