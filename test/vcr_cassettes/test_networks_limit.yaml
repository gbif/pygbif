      string: "{\"offset\":0,\"limit\":5,\"endOfRecords\":false,\"count\":17,\"results\":[{\"key\":\"ab013f3a-3c00-42cb-9fdb-cb5f4ba20a4b\",\"title\":\"Biologging\",\"description\":\"Bio-logging
        science is concerned with the use of miniature animal-borne electronic devices
        for logging and/or relaying of data about an animal\u2019s movements, behaviour,
        physiology and/or environment. This network aims to increase the discoverability
        of bio-logging datasets on GBIF.\",\"language\":\"eng\",\"numConstituents\":386,\"email\":[],\"phone\":[],\"homepage\":[],\"address\":[],\"createdBy\":\"andrea\",\"modifiedBy\":\"peterdesmet\",\"created\":\"2025-06-18T10:00:41.043+00:00\",\"modified\":\"2025-10-03T13:47:46.984+00:00\",\"contacts\":[{\"key\":6144210,\"type\":\"TECHNICAL_POINT_OF_CONTACT\",\"primary\":true,\"userId\":[\"https://orcid.org/0000-0002-8442-8025\"],\"firstName\":\"Peter\",\"lastName\":\"Desmet\",\"position\":[],\"email\":[\"peter.desmet@inbo.be\"],\"phone\":[],\"homepage\":[],\"organization\":\"Research
        Institute for Nature and Forest (INBO)\",\"address\":[],\"country\":\"BE\",\"createdBy\":\"peterdesmet\",\"modifiedBy\":\"peterdesmet\",\"created\":\"2025-06-18T10:59:20.321+00:00\",\"modified\":\"2025-06-19T07:53:04.393+00:00\"}],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[{\"key\":39047,\"content\":\"[2025-06-18,
        ah] created on request from Peter Desmet (inbo.be) to support the upcoming
        Move BON initiative.\",\"createdBy\":\"andrea\",\"modifiedBy\":\"andrea\",\"created\":\"2025-06-18T10:01:39.250+00:00\",\"modified\":\"2025-06-18T10:01:39.250+00:00\"}]},{\"key\":\"0479d6b2-a4f4-4307-8346-0b80e8c88c66\",\"title\":\"Symbiota
        Support Hub\",\"description\":\"The Symbiota Support Hub provides accessible
        solutions and support for biodiversity collections to efficiently mobilize
        their data using Symbiota. Symbiota is an open source biodiversity data aggregation
        and collection management system software (https://github.com/BioKIC/Symbiota)
        that currently sustains a network of over 60 publicly-accessible data portals.
        Many of these portals are GBIF installations; they can push datasets directly
        to GBIF without the use of an IPT. Most portals welcome new data providers
        within their theme. To learn more about joining the Symbiota network, contact
        help@symbiota.org.\",\"language\":\"eng\",\"numConstituents\":590,\"email\":[],\"phone\":[],\"homepage\":[],\"address\":[],\"createdBy\":\"andrea\",\"modifiedBy\":\"andrea\",\"created\":\"2025-03-18T10:20:49.047+00:00\",\"modified\":\"2025-03-28T07:39:38.882+00:00\",\"contacts\":[],\"endpoints\":[],\"machineTags\":[{\"key\":24444326,\"namespace\":\"registry.gbif.org\",\"name\":\"visibleOnDatasetPage\",\"value\":\"true\",\"createdBy\":\"andrea\",\"created\":\"2025-03-28T07:40:49.621+00:00\"}],\"tags\":[],\"identifiers\":[],\"comments\":[]},{\"key\":\"55d38654-7954-46c6-ad18-7730a6a7f586\",\"title\":\"The
        Program for Biodiversity Research (PPBio)\",\"description\":\"The Program
        for Biodiversity Research (PPBio) is an innovative program designed to integrate
        all biodiversity research stakeholders in the Brazilian territory. Since its
        inception in 2004, PPBio has established a robust network of long-term ecological
        research sites across Brazil, with its methodology gaining traction in other
        countries in the Southern Hemisphere. This program supports a comprehensive
        suite of research activities essential for understanding biodiversity and
        the ecological and evolutionary processes shaping it. Currently, PPBio encompasses
        161 sampling sites most employing standardized methods that enable comparisons
        across all Brazilian ecosystems and their biomes, at various scales. To date,
        approximately 1,500 publications are associated with PPBio, encompassing diverse
        fields such as natural history, genetics, ecology, biodiversity, bioeconomy,
        sustainability, conservation, and climate change, among many others. The Program
        also fostered, directly and indirectly, local technical capacity building,
        and supported the training of hundreds of undergraduate and graduate students.
        The main challenge is maintaining the long-term funding necessary to understand
        biodiversity patterns and processes under pressure from global environmental
        changes. - http://memoria2.cnpq.br/web/guest/apresentacao-ppbio/\",\"language\":\"eng\",\"numConstituents\":5,\"email\":[],\"phone\":[],\"homepage\":[],\"address\":[],\"createdBy\":\"andrea\",\"modifiedBy\":\"andrea\",\"created\":\"2024-12-16T14:22:43.630+00:00\",\"modified\":\"2024-12-16T14:27:28.076+00:00\",\"contacts\":[{\"key\":5929513,\"type\":\"ADMINISTRATIVE_POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Geraldo\",\"lastName\":\"Wilson
        Fernandes\",\"position\":[],\"email\":[\"gw.fernandes@gmail.com\"],\"phone\":[],\"homepage\":[],\"organization\":\"Universidade
        Federal de Minas Gerais\",\"address\":[],\"createdBy\":\"andrea\",\"modifiedBy\":\"clara_baringo\",\"created\":\"2024-12-16T14:23:37.889+00:00\",\"modified\":\"2024-12-17T12:15:56.605+00:00\"},{\"key\":5931072,\"type\":\"POINT_OF_CONTACT\",\"primary\":true,\"userId\":[],\"firstName\":\"Equipe\",\"lastName\":\"SiBBr\",\"position\":[],\"email\":[\"atendimento_sibbr@rnp.br\"],\"phone\":[],\"homepage\":[],\"organization\":\"SiBBr
        GBIF Brazil\",\"address\":[],\"createdBy\":\"clara_baringo\",\"modifiedBy\":\"clara_baringo\",\"created\":\"2024-12-17T12:15:12.466+00:00\",\"modified\":\"2024-12-17T12:15:43.548+00:00\"}],\"endpoints\":[],\"machineTags\":[{\"key\":23132466,\"namespace\":\"registry.gbif.org\",\"name\":\"visibleOnDatasetPage\",\"value\":\"true\",\"createdBy\":\"andrea\",\"created\":\"2024-12-16T14:32:16.708+00:00\"}],\"tags\":[],\"identifiers\":[],\"comments\":[]},{\"key\":\"8e30b684-6a54-4aba-aa73-66201c2c736e\",\"title\":\"Specify
        Collections Consortium (SCC)\",\"language\":\"eng\",\"numConstituents\":134,\"email\":[],\"phone\":[],\"homepage\":[],\"address\":[],\"createdBy\":\"mgrosjean\",\"modifiedBy\":\"mgrosjean\",\"created\":\"2024-11-19T09:38:59.663+00:00\",\"modified\":\"2024-11-19T09:38:59.663+00:00\",\"contacts\":[],\"endpoints\":[],\"machineTags\":[{\"key\":22910597,\"namespace\":\"registry.gbif.org\",\"name\":\"visibleOnDatasetPage\",\"value\":\"true\",\"createdBy\":\"mgrosjean\",\"created\":\"2024-12-03T14:13:40.499+00:00\"}],\"tags\":[],\"identifiers\":[],\"comments\":[]},{\"key\":\"a6cdb5d1-d358-4ac0-b75c-2c33cf6c8936\",\"title\":\"Long-term
        Ecological Research Program - PELD/CNPq, Brazil\",\"description\":\"The PELD
        program, held for 23 years by the National Council for Scientific and Technological
        Development (CNPq) is maintained by ongoing Public Calls. The PELD network
        currently has 34 reference sites distributed in all biomes from Brazil, operating
        in dozens of protected areas and areas subject to anthropic impacts. The Program
        has a well-established and active management structure, in which the Management
        and Scientific Committees act in an integrated manner for strategic decisions
        in order to improve the Program. It is a member of the International Network
        for Long Term Ecological Research - ILTER, which brings together 44 member
        countries and their networks of long-term research sites. The program has
        been pooling efforts to foster a national culture devoted to long-term ecological
        research that can address environmental issues and point to solutions and
        practices for sustainable use of natural resources and ecosystem services,
        with important contributions to the proposition of public policies, promoting
        biodiversity conservation and human welfare.\\n\\nhttps://www.gov.br/cnpq/pt-br/acesso-a-informacao/acoes-e-programas/programas/peld\",\"language\":\"eng\",\"numConstituents\":50,\"email\":[],\"phone\":[],\"homepage\":[],\"address\":[],\"createdBy\":\"andrea\",\"modifiedBy\":\"andrea\",\"created\":\"2024-03-11T14:48:10.451+00:00\",\"modified\":\"2024-03-11T14:54:56.037+00:00\",\"contacts\":[{\"key\":5179449,\"type\":\"ADMINISTRATIVE_POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Conselho
        Nacional de Desenvolvimento Cient\xEDfico e Tecnol\xF3gico (CNPq/MCTI)\",\"position\":[],\"email\":[\"peld@cnpq.br\"],\"phone\":[],\"homepage\":[],\"address\":[],\"createdBy\":\"andrea\",\"modifiedBy\":\"andrea\",\"created\":\"2024-03-11T14:48:56.732+00:00\",\"modified\":\"2024-03-11T14:53:54.442+00:00\"},{\"key\":5179450,\"type\":\"ADMINISTRATIVE_POINT_OF_CONTACT\",\"primary\":false,\"userId\":[],\"firstName\":\"Sistema
        de Informa\xE7\xE3o sobre a biodiversidade Brasileira (SiBBr)\",\"position\":[],\"email\":[\"atendimento_sibbr@rnp.br\"],\"phone\":[],\"homepage\":[],\"address\":[],\"createdBy\":\"andrea\",\"modifiedBy\":\"andrea\",\"created\":\"2024-03-11T14:49:36.777+00:00\",\"modified\":\"2024-03-11T14:54:04.531+00:00\"}],\"endpoints\":[],\"machineTags\":[],\"tags\":[],\"identifiers\":[],\"comments\":[]}]}"
