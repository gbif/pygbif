        University Forest\",\"description\":\"Niigata University Forest is located
        in Koda, Sado City, Niigata Prefecture. It encompasses approximately 500 hectares
        of forest on the western slope of the Ohsado Mountains in northern Sado Island.
        Established in 1955 through the transfer of prefectural forest land, it relocated
        its lodging and offices to the current site in 1992. In 2019, it was integrated
        with the Coastal Laboratory and other facilities to form the current Center.
        The forest, spreading across mountainous terrain at elevations of 270 to 947
        meters, is primarily composed of natural cedar stands. It maintains a high
        degree of natural integrity, including diverse broadleaf trees characteristic
        of the beech zone and wetland vegetation. Groups of cedar trees exhibiting
        distinctive growth forms under snowy and windy conditions can also be observed.
        Today, it is positioned primarily as an educational and research site emphasizing
        coexistence with nature and biodiversity conservation rather than timber production.
        It is utilized for fieldwork and collaborative research by universities and
        research institutions nationwide. Diverse research themes are pursued, including
        forest dynamics, climate change responses, and island ecosystem studies. The
        center also participates in long-term observation projects such as the \u201CBiodiversity
        Monitoring 1000\u201D initiative. As a hub for learning about the coexistence
