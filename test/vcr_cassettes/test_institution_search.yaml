        Museum\",\"description\":\"Hokkaido museum, aka Mori no Charenga, is a museum
        introducing the nature, history and culture of Hokkaido.\\nThe museum investigates
        and researches the relationship between the nature environment and people,
        the culture of the Ainu people and their way of living, and the lives of immigrants
        from Honshu.\\nHokkaido Museum (nicknamed Mori no Charenga) was opened in
        April 2015 by integrating the Hokkaido Kaitaku Kinenkan (opened in 1971) and
        the Hokkaido Ainu Cultural Research Center (opened in 1994). Inheriting the
        traditions and outstanding achievements of the two institutions, the museum
        will celebrate its 10th anniversary in 2025 (Reiwa 7) as a \\\"comprehensive
        museum\\\" representing Hokkaido.\\nAs a core museum in Hokkaido, the museum
        will collaborate with local museums and other institutions, and as a research
        museum with approximately 30 curators and research staff, we will utilize
        the results of specialized and comprehensive research to strengthen our functions
        to meet diverse learning needs. In addition, as a comprehensive museum that
        can be proud of the world for specialized research on Ainu history and tangible
        and intangible culture, we will contribute to the promotion of Ainu culture
        and the realization of a multicultural society. Furthermore, we will contribute
        to the revitalization of the region while placing importance on our role as
        a cultural tourism base facility.\\nOur museum has a permanent comprehensive
        exhibition consisting of five areas that tell the story of Hokkaido's nature,
        history, and culture, as well as special exhibitions and various planned exhibitions.\",\"types\":[\"Museum\"],\"active\":true,\"email\":[\"hokkaido.museum@pref.hokkaido.lg.jp\"],\"phone\":[\"+81-11-898-0456\"],\"homepage\":\"https://www.hm.pref.hokkaido.lg.jp\",\"catalogUrls\":[\"https://jmapps.ne.jp/hmcollection1/list.html?keywords=&kwd_and_or=and&f2%5B%5D=\u751F\u7269&title=&f3=&f4=&list_type=LLA001&list_count=10&title_query=yes\"],\"apiUrls\":[],\"institutionalGovernances\":[],\"disciplines\":[\"Biological\",\"Cultural\"],\"latitude\":43.053000,\"longitude\":141.496500,\"mailingAddress\":{\"key\":55971,\"address\":\"Atsubetsu-ku
