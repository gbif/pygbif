name: Python live API tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GBIF_USER: ${{ secrets.GBIF_USER }}
      GBIF_PWD: ${{ secrets.GBIF_PWD }}
      GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-c1v5 libgeos-dev
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    # NOTE: Download tests use VCR cassettes to avoid GBIF API rate limits (3 downloads max)
    # All tests in test-occurrences-download_live.py create downloads, so we use cassettes
    # To regenerate: delete cassettes locally and run with GBIF credentials

    - name: Tests (using VCR cassettes to avoid rate limits)
      run: pytest test/test-occurrences-download_live.py -v  

