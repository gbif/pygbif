name: Python live API tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GBIF_USER: ${{ secrets.GBIF_USER }}
      GBIF_PWD: ${{ secrets.GBIF_PWD }}
      GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-c1v5 libgeos-dev
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Delete vcr cassettes to force live API tests
      run: |
        rm -rf test/vcr_cassettes/*
        if [ "$(ls -A test/vcr_cassettes)" ]; then
          echo "Directory is not empty"
          exit 1
        fi

    - name: Tests (all tests EXCEPT download_live, which hits rate limits)
      run: pytest test/ --ignore=test/test-occurrences-download_live.py -v  

